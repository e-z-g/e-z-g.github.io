<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Myst III node walk</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; color: #eee; }
  canvas { display: block; touch-action: none; }
  #bar { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #here { background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; }
  select, button { font: inherit; background: rgba(0,0,0,.6); color: #eee; border: 1px solid #666; border-radius: 4px; padding: 3px 6px; }
  #tip { position: fixed; pointer-events: none; background: rgba(0,0,0,.75); padding: 2px 6px; border-radius: 4px; font-size: 13px; display: none; }
  #moves { position: fixed; bottom: 8px; left: 8px; right: 8px; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
  #map { position: fixed; right: 8px; bottom: 48px; width: 260px; height: 260px; background: rgba(0,0,0,.72); border: 1px solid #555; border-radius: 6px; touch-action: none; }
  #map.big { width: min(560px, 90vw); height: min(560px, 70vh); }
  #fovtxt { background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; font-size: 12px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="bar">
  <span id="here"></span>
  <select id="sel"></select>
  <button id="back" title="Back (Backspace)">Back</button>
  <button id="show" title="Hotspots: off, areas, centres, both (H)">Hotspots: off</button>
  <button id="facebtn" title="The cube's faces and seams (F)">Faces</button>
  <button id="mapbtn" title="Map of the node layout (M); double-click it to enlarge">Map</button>
  <button id="laybtn" title="The map's layout: the proposed places where there are any, or the model's (L)">Layout: proposed</button>
  <span id="fovtxt"></span>
</div>
<canvas id="map"></canvas>
<div id="moves"></div>
<div id="tip"></div>
<script type="module">
// Myst III's nodes as the game shows them: a node's six faces as a cube round the eye, looked round by dragging,
// and its movement hotspots tested on a click as ScummVM tests them (engines/myst3/hotspot.cpp: each rectangle
// a quad facing the eye at its centre's pitch and heading, half its width and height w/90 and h/90 of its
// distance). A walk keeps the way you look, as the game does. Conditions on hotspots (doors open or shut) are
// not kept: every hotspot is live. Data: node_walk.py's walk.json and layout.json; faces in faces/<ROOM>/.
// F draws the cube's seams and names its faces. Zoom (wheel, pinch, + and -) runs from 20 to 360 degrees top to bottom: up to 120 an ordinary perspective view,
// beyond it the scene rendered into a cube map and drawn as a fisheye, r = tan(theta/s) / tan(fov/2s) with
// s = max(1, fov/120), so that at 360 the whole sphere fills a circle the height of the window.
import * as THREE from 'three';

const W = await (await fetch('walk.json')).json();
const LAY = await fetch('layout.json').then(r => r.ok ? r.json() : { nodes: {}, proposed: {} }).catch(() => ({ nodes: {}, proposed: {} }));
const NODES = W.nodes;
// the numbers the mesh work uses: room x 1000 + node (Amateria: MACA 1, MAIS 2, MALL 3, MASS 4, MAWW 5, MATO 6)
const num = n => (W.rooms.indexOf(n.slice(0, 4)) + 1) * 1000 + +n.slice(5);
const label = n => `${num(n)} · ${n.slice(0, 4)} ${+n.slice(5)}`;
const byNum = Object.fromEntries(Object.keys(NODES).map(n => [num(n), n]));
const names = Object.keys(NODES).sort((a, b) => num(a) - num(b));
const what = s => s.to ? `${s.kind} to ${num(s.to)}` : `${s.kind} (${s.args.join(' ')})`;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.01, 100);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// the node frame: x right, y up, -z face 1; face k's pixel (s, t) looks along DIRS[k] (moge_depth.py's)
const DIRS = { 1: (s, t) => [2 * s - 1, 1 - 2 * t, -1], 2: (s, t) => [1 - 2 * s, -1, 1 - 2 * t], 3: (s, t) => [1 - 2 * s, 1 - 2 * t, 1],
  4: (s, t) => [1, 1 - 2 * t, 2 * s - 1], 5: (s, t) => [-1, 1 - 2 * t, 1 - 2 * s], 6: (s, t) => [1 - 2 * s, 1, 2 * t - 1] };
const loader = new THREE.TextureLoader(), cache = new Map();
function tex(url) {
  if (!cache.has(url)) cache.set(url, new Promise(res => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; res(t); }, undefined, () => res(null))));
  return cache.get(url);
}
const faceUrl = (n, k) => `faces/${n.slice(0, 4)}/${n}-f${k}.jpg`;
const loadNode = n => Promise.all([1, 2, 3, 4, 5, 6].map(k => tex(faceUrl(n, k))));
function cube(texs) {
  const g = new THREE.Group();
  for (let k = 1; k <= 6; k++) {
    const P = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([s, t]) => DIRS[k](s, t));
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(P.flat(), 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 0, 0, 1, 0], 2));
    geo.setIndex([0, 2, 1, 1, 2, 3]);
    g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: texs[k - 1], side: THREE.DoubleSide, transparent: true, depthWrite: false })));
  }
  g.scale.setScalar(10);
  return g;
}

// ScummVM's direction (x = cos p sin h, y = sin p, z = cos p cos h) is the node frame's with x turned round
const sv = v => new THREE.Vector3(-v.x, v.y, v.z);
const dirOf = (p, h) => { const P = p * Math.PI / 180, H = h * Math.PI / 180; return new THREE.Vector3(Math.cos(P) * Math.sin(H), Math.sin(P), Math.cos(P) * Math.cos(H)); };
function rectCorners([p, h, w, hh]) {          // in ScummVM's frame, as polarRectTo3dRect
  const d = dirOf(p, h).multiplyScalar(50), u = new THREE.Vector3(d.z, 0, -d.x).normalize();
  const v = new THREE.Vector3().crossVectors(d, u).normalize();
  const U = u.multiplyScalar(w / 90 * 50), V = v.multiplyScalar(hh / 90 * 50);
  return [d.clone().add(V).sub(U), d.clone().add(V).add(U), d.clone().sub(V).add(U), d.clone().sub(V).sub(U)];   // TL TR BR BL
}
function hits(ray, rect) {                       // rayIntersectsRect, the ray from the origin
  const [tl, tr, br, bl] = rectCorners(rect), top = tr.clone().sub(tl), left = bl.clone().sub(tl);
  const n = new THREE.Vector3().crossVectors(top, left), nd = n.dot(ray);
  if (Math.abs(nd) < 1e-6) return false;
  const t = n.dot(tl) / nd; if (t < 0) return false;
  const q = ray.clone().multiplyScalar(t).sub(tl), a = q.dot(top), b = q.dot(left);
  return a >= 0 && a <= top.dot(top) && b >= 0 && b <= left.dot(left);
}
function spotAt(n, ray) {
  if (!ray) return null;
  const r = sv(ray);
  for (const s of NODES[n] || []) for (const rect of s.rects) if (hits(r, rect)) return s;
  return null;
}

// the hotspots drawn: 0 off, 1 their areas (filled, labelled with the move), 2 their centres (marked, labelled with
// the heading and pitch), 3 both
let spotMode = 0, outlines = null;
const MODES = ['off', 'areas', 'centres', 'both'];
const colOf = s => s.to ? (s.kind.startsWith('zip') ? 0x40c0ff : 0x40ff60) : 0xff8040;
function labelSprite(text, col, w = 0.7) {
  const cv = document.createElement('canvas'), cx = cv.getContext('2d'); cx.font = 'bold 40px system-ui, sans-serif';
  cv.width = Math.ceil(cx.measureText(text).width + 24); cv.height = 56;
  cx.fillStyle = 'rgba(0,0,0,.7)'; cx.fillRect(0, 0, cv.width, cv.height); cx.fillStyle = '#' + col.toString(16).padStart(6, '0');
  cx.font = 'bold 40px system-ui, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(text, cv.width / 2, 30);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  sp.userData.size = [w * cv.width / 256 * 1.6, w * 0.3]; sp.renderOrder = 12;
  return sp;
}
function drawSpots(n) {
  if (outlines) { scene.remove(outlines); outlines.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { o.material.map && o.material.map.dispose(); o.material.dispose(); } }); outlines = null; }
  document.getElementById('show').textContent = 'Hotspots: ' + MODES[spotMode];
  if (!spotMode) return;
  outlines = new THREE.Group();
  for (const s of NODES[n] || []) for (const rect of s.rects) {
    const col = colOf(s), pts = rectCorners(rect).map(c => sv(c).multiplyScalar(0.1));
    const target = s.to ? `${s.kind} → ${num(s.to)}` : `${s.kind} ${s.args.join(' ')}`;
    if (spotMode & 1) {
      outlines.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: col, depthTest: false })));
      const fill = new THREE.BufferGeometry().setFromPoints([pts[0], pts[1], pts[2], pts[0], pts[2], pts[3]]);
      const m = new THREE.Mesh(fill, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.16, depthTest: false, depthWrite: false, side: THREE.DoubleSide }));
      m.renderOrder = 9; outlines.add(m);
      const sp = labelSprite(target, col);                     // at the area's top edge, inside it
      const top = pts[0].clone().add(pts[1]).multiplyScalar(0.5), mid = pts[0].clone().add(pts[2]).multiplyScalar(0.5);
      sp.position.copy(top.lerp(mid, 0.18)); outlines.add(sp);
    }
    if (spotMode & 2) {
      const c = sv(dirOf(rect[0], rect[1])).multiplyScalar(5);
      const dot = labelSprite('+', col, 0.4); dot.position.copy(c); outlines.add(dot);
      const sp = labelSprite(`${s.to ? num(s.to) : s.kind} · ${rect[1]}° ${rect[0] >= 0 ? '+' : '−'}${Math.abs(rect[0])}°`, col, 0.55);
      sp.position.copy(c).add(new THREE.Vector3(0, -0.2, 0)); sp.userData.below = true; outlines.add(sp);
    }
  }
  outlines.renderOrder = 10; scene.add(outlines);
}
function sizeLabels() {                         // the labels' size kept about the same on screen as the view widens
  const k = Math.max(fov, 20) / 65;
  for (const g of [outlines, seams]) if (g) g.traverse(o => { if (o.isSprite) { o.scale.set(o.userData.size[0] * k, o.userData.size[1] * k, 1); } });
}
// the cube's seams (its twelve edges, straight lines between the corners' directions, so they fall on the seams at
// any zoom and in the fisheye) and each face's number and side at its centre
let seams = null;
const FACE = { 1: 'front', 2: 'bottom', 3: 'back', 4: 'right', 5: 'left', 6: 'top' };
function toggleSeams() {
  if (seams) { scene.remove(seams); seams.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { o.material.map && o.material.map.dispose(); o.material.dispose(); } }); seams = null; }
  else {
    seams = new THREE.Group();
    const mat = new THREE.LineBasicMaterial({ color: 0xffe040, depthTest: false, transparent: true, opacity: 0.85 });
    for (let k = 1; k <= 6; k++) {
      const P = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([u, t]) => new THREE.Vector3(...DIRS[k](u, t)).multiplyScalar(4));
      const l = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(P), mat); l.renderOrder = 8; seams.add(l);
      const sp = labelSprite(`f${k} ${FACE[k]}`, 0xffe040, 0.6);
      sp.position.copy(new THREE.Vector3(...DIRS[k](0.5, 0.5)).multiplyScalar(4)); seams.add(sp);
    }
    scene.add(seams);
  }
  document.getElementById('facebtn').style.borderColor = seams ? '#ffe040' : '#666';
}
document.getElementById('facebtn').onclick = toggleSeams;

// looking round: yaw about the node's up, pitch; the game's heading 0 looks along +z (face 3)
let yaw = 0, pitch = 0, fov = 65, forceFish = false;
const FOV_MIN = 20, FOV_MAX = 360;
const fish = () => forceFish || fov > 120;
const sOf = f => Math.max(1, f / 120);
function look() {
  const d = new THREE.Vector3(...dirOf(pitch, yaw).toArray()); d.x = -d.x;
  camera.lookAt(d); camera.fov = Math.min(fov, 120); camera.updateProjectionMatrix();
  document.getElementById('fovtxt').textContent = `${Math.round(fov)}°` + (fish() ? ' fisheye' : '');
}
// a window point's direction, as either view draws it (null outside the fisheye's circle)
function rayAt(x, y) {
  const X = (x / innerWidth * 2 - 1) * innerWidth / innerHeight, Y = 1 - y / innerHeight * 2, r = Math.hypot(X, Y);
  const T = fov / 2 * Math.PI / 180, s = sOf(fov), th = s * Math.atan(r * Math.tan(T / s));
  if (th > Math.PI) return null;
  const q = r > 0 ? [X / r, Y / r] : [0, 0];
  return new THREE.Vector3(Math.sin(th) * q[0], Math.sin(th) * q[1], -Math.cos(th)).applyQuaternion(camera.quaternion).normalize();
}
// the fisheye: the scene into a cube map, then each pixel's direction looked up in it
const cubeRT = new THREE.WebGLCubeRenderTarget(Math.min(2048, renderer.capabilities.maxCubemapSize),
  { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, colorSpace: THREE.SRGBColorSpace });
const cubeCam = new THREE.CubeCamera(0.01, 100, cubeRT);
const fishMat = new THREE.ShaderMaterial({
  uniforms: { env: { value: cubeRT.texture }, rot: { value: new THREE.Matrix3() }, aspect: { value: 1 }, tanT: { value: 1 }, s: { value: 1 }, seams: { value: 0 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `uniform samplerCube env; uniform mat3 rot; uniform float aspect, tanT, s, seams; varying vec2 vUv;
    void main() {
      vec2 p = (vUv * 2.0 - 1.0) * vec2(aspect, 1.0); float r = length(p), th = s * atan(r * tanT);
      if (th > 3.14159265) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }
      vec2 q = r > 0.0 ? p / r : vec2(0.0);
      vec3 d = rot * vec3(sin(th) * q, -cos(th));
      gl_FragColor = textureCube(env, d);
      if (seams > 0.5) {          // a seam: the two largest of the direction's components equal
        vec3 a = abs(d); float hi = max(a.x, max(a.y, a.z)), lo = min(a.x, min(a.y, a.z)), mid = a.x + a.y + a.z - hi - lo;
        float e = (hi - mid) / hi, w = fwidth(e) * 1.2;
        if (e < w) gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0, 0.88, 0.25), 0.9);
      }
      #include <colorspace_fragment>
    }`, depthTest: false, depthWrite: false });
const fishScene = new THREE.Scene(), fishCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
fishScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fishMat));
function render() {
  sizeLabels();
  if (!fish()) { renderer.render(scene, camera); return; }
  cubeCam.update(renderer, scene);
  const s = sOf(fov);
  fishMat.uniforms.rot.value.setFromMatrix4(camera.matrixWorld); fishMat.uniforms.aspect.value = innerWidth / innerHeight;
  fishMat.uniforms.tanT.value = Math.tan(fov / 2 * Math.PI / 180 / s); fishMat.uniforms.s.value = s;
  fishMat.uniforms.seams.value = seams ? 1 : 0;
  renderer.render(fishScene, fishCam);
}

let here = null, now = null, fading = null;
const hist = [];
const sel = document.getElementById('sel');
for (const n of names) sel.add(new Option(label(n), n));
sel.onchange = () => go(sel.value, true);
async function go(n, push = true) {
  if (!NODES[n] || n === here) return;
  const texs = await loadNode(n);
  if (push && here) hist.push(here);
  const next = cube(texs); scene.add(next);
  if (now) { const old = now; fading = { old, next, t0: performance.now() }; next.children.forEach(m => m.material.opacity = 0); }
  now = next; here = n; sel.value = n; location.hash = num(n);
  document.getElementById('here').textContent = label(n);
  document.getElementById('moves').textContent = (NODES[n] || []).map(s => `${what(s)} at heading ${s.rects[0][1]}°, pitch ${s.rects[0][0]}°`).join(' · ') || 'no moves';
  drawSpots(n);
  for (const s of NODES[n] || []) if (s.to) loadNode(s.to);          // the next nodes' faces ready
}
document.getElementById('back').onclick = () => { if (hist.length) go(hist.pop(), false); };
document.getElementById('show').onclick = () => { spotMode = (spotMode + 1) % 4; drawSpots(here); };
addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') { spotMode = (spotMode + 1) % 4; drawSpots(here); }
  if (e.key === 'm' || e.key === 'M') toggleMap();
  if (e.key === 'l' || e.key === 'L') toggleLayout();
  if (e.key === 'f' || e.key === 'F') toggleSeams();
  if (e.key === '+' || e.key === '=') fov = Math.max(FOV_MIN, fov / 1.25);
  if (e.key === '-' || e.key === '_') fov = Math.min(FOV_MAX, fov * 1.25);
  if (e.key === 'Backspace' && hist.length) { e.preventDefault(); go(hist.pop(), false); }
});

// drag to look, click (or tap) a hotspot to move; the cursor shows a hotspot under it
const el = renderer.domElement, ptr = new Map();
let down = null, pinch = null;
el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); down = { x: e.clientX, y: e.clientY, yaw, pitch, t: performance.now(), moved: false };
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), fov }; } });
el.addEventListener('pointermove', e => {
  if (ptr.has(e.pointerId)) ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinch && ptr.size === 2) { const [a, b] = [...ptr.values()]; fov = Math.min(FOV_MAX, Math.max(FOV_MIN, pinch.fov * pinch.d / Math.hypot(a[0] - b[0], a[1] - b[1]))); down && (down.moved = true); return; }
  if (down && ptr.size === 1) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (Math.hypot(dx, dy) > 6) down.moved = true;
    if (down.moved) { const k = Math.min(fov, 180) / innerHeight; yaw = down.yaw - dx * k; pitch = Math.max(-89, Math.min(89, down.pitch + dy * k)); }
  } else if (here) {
    const s = spotAt(here, rayAt(e.clientX, e.clientY)), tip = document.getElementById('tip');
    el.style.cursor = s ? 'pointer' : 'grab';
    tip.style.display = s ? 'block' : 'none';
    if (s) { tip.textContent = what(s); tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 10 + 'px'; }
  }
});
const up = e => {
  ptr.delete(e.pointerId); if (ptr.size < 2) pinch = null;
  if (down && !down.moved && ptr.size === 0 && here) { const s = spotAt(here, rayAt(e.clientX, e.clientY)); if (s && s.to) go(s.to); }
  if (ptr.size === 0) down = null;
};
el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
el.addEventListener('wheel', e => { fov = Math.min(FOV_MAX, Math.max(FOV_MIN, fov * Math.exp(e.deltaY * 0.001))); e.preventDefault(); }, { passive: false });

// the map: every node the layout places, seen from above with heading 0 up (the game's headings run clockwise),
// the game's moves between them, the eye's node and the way it looks; proposed places (not built) as rings,
// dashed from where the model has the node. Wheel over it to zoom, click a node to go there, double-click to enlarge.
const MC = document.getElementById('map'), mcx = MC.getContext('2d');
const ROOMCOL = ['#e8b04a', '#5ec4e8', '#b58cf0', '#7fd46a', '#f07a7a', '#e8e06a'];
let mapOn = innerWidth > 600, mapScale = 30, mapHover = null;
const P = LAY.nodes, PROP = LAY.proposed;
let useProp = true;                                         // the proposed places where there are any, or the model's
const posOf = n => (useProp && PROP[n]) || (P[n] && P[n].pos) || null;
const other = n => useProp ? (PROP[n] && P[n] ? P[n].pos : null) : (PROP[n] || null);   // shown dashed
function toggleLayout() { useProp = !useProp; document.getElementById('laybtn').textContent = 'Layout: ' + (useProp ? 'proposed' : 'model'); }
document.getElementById('laybtn').onclick = toggleLayout;
function toggleMap() { mapOn = !mapOn; MC.style.display = mapOn ? 'block' : 'none'; }
MC.style.display = mapOn ? 'block' : 'none';
document.getElementById('mapbtn').onclick = toggleMap;
MC.addEventListener('dblclick', () => MC.classList.toggle('big'));
MC.addEventListener('wheel', e => { mapScale = Math.min(400, Math.max(4, mapScale * Math.exp(-e.deltaY * 0.0015))); e.preventDefault(); }, { passive: false });
let mapCentre = [0, 0, 0];
const toMap = (p, w, h) => [w / 2 - (p[0] - mapCentre[0]) * mapScale, h / 2 - (p[2] - mapCentre[2]) * mapScale];
function nodeAtMap(x, y) {
  const w = MC.clientWidth, h = MC.clientHeight; let best = null, bd = matchMedia('(pointer: coarse)').matches ? 18 : 10;
  for (const n of new Set([...Object.keys(P), ...Object.keys(PROP)])) {
    const p = posOf(n); if (!p) continue; const [a, b] = toMap(p, w, h), d = Math.hypot(a - x, b - y); if (d < bd) { bd = d; best = n; }
  }
  return best;
}
MC.addEventListener('pointermove', e => { mapHover = nodeAtMap(e.offsetX, e.offsetY); });
MC.addEventListener('pointerleave', () => { mapHover = null; });
MC.addEventListener('click', e => { const n = nodeAtMap(e.offsetX, e.offsetY); if (n && byNum[+n]) go(byNum[+n]); });
function drawMap() {
  if (!mapOn) return;
  const dpr = Math.min(devicePixelRatio, 2), w = MC.clientWidth, h = MC.clientHeight;
  if (MC.width !== Math.round(w * dpr) || MC.height !== Math.round(h * dpr)) { MC.width = Math.round(w * dpr); MC.height = Math.round(h * dpr); }
