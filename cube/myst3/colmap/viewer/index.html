<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Myst III room reconstruction</title>
<!--
  Viewer for dense reconstructions packed by export_viewer_data.py. The data is not
  in this repository (it is made from the game's pictures); serve_viewer.py serves
  this page with each set at data/NAME/ and their list at data/sets.json; ?set=NAME
  picks one, as does the list at the bottom left.
  Orbit: drag to turn, pinch or wheel to zoom, two fingers or right drag to pan.
  At a node: the camera stands at the node's centre; drag to look round, and the
  markers of the nodes within four spacings stay, to tap.
  Getting about: tap a node's marker to fly there; double-tap the points to fly to
  that spot; hold the up and down arrows (or W/S, A/D sideways, Q/E down and up)
  to walk the way the view looks. The room list shortens the row of node buttons.
  ?debug shows what the device's graphics report.
-->
<style>
  html, body { margin: 0; height: 100%; background: #1d2026; color: #e8e8e8;
    font: 14px/1.3 system-ui, sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(20,22,26,.88);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  #bar .row { display: flex; gap: 6px; align-items: center; overflow-x: auto; white-space: nowrap;
    padding: 3px 0; }
  #bar .row > * { flex: none; }
  button { background: #333a44; color: #eee; border: 0; border-radius: 6px; padding: 8px 10px;
    font: inherit; min-width: 38px; }
  button.on { background: #4a7bd0; }
  input[type=range] { width: 110px; }
  select { background: #333a44; color: #eee; border: 0; border-radius: 6px; padding: 8px 6px; font: inherit; }
  #status { position: fixed; top: 0; left: 0; right: 0; padding: 6px 8px; font-size: 12px;
    background: rgba(20,22,26,.6); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="status">Loading…</div>
<div id="bar">
  <div class="row">
    <select id="set"></select>
    <button id="orbit" class="on">Overview</button>
    <button id="showPts" class="on">Points</button>
    <button id="showMesh">Mesh</button>
    <button id="showNodes" class="on">Nodes</button>
    <button id="showFill">Fill</button>
    <button id="showFloors">Floors</button>
    <button id="showBack" class="on">Backdrop</button>
    <span>size</span><input id="size" type="range" min="0.004" max="0.12" step="0.002" value="0.03">
  </div>
  <div class="row" id="nodeRow"><select id="room"><option value="">All rooms</option></select><button id="fwd" title="Hold to walk forward (W)">&#9650;</button><button id="back" title="Hold to walk back (S)">&#9660;</button><span>Stand at node:</span></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status = document.getElementById('status');
const say = (s) => { status.textContent = s; };
window.addEventListener('error', (e) => say('Error: ' + e.message));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
// A lost or refused graphics context only ever showed as an empty grey window.
renderer.domElement.addEventListener('webglcontextlost', (e) => { e.preventDefault(); say('The graphics context was lost (the phone ran short of graphics memory?). Close other 3D tabs and reload.'); });
// ?debug: what the phone's graphics say, once a second, under the status line
const debugOn = new URLSearchParams(location.search).has('debug');
if (debugOn) {
  const el = document.createElement('div');
  el.style.cssText = 'position:fixed;left:0;right:0;top:28px;padding:4px 8px;font:11px monospace;background:rgba(0,0,0,.6);color:#9f9;z-index:9;white-space:pre-wrap';
  document.body.appendChild(el);
  const gl = renderer.getContext();
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  setInterval(() => {
    const i = renderer.info;
    el.textContent = `GPU ${gpu}; WebGL ${renderer.capabilities.isWebGL2 ? 2 : 1}; point size up to ${gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1]}` +
      `\ncanvas ${renderer.domElement.width}x${renderer.domElement.height}; drawn: ${i.render.calls} calls, ${i.render.points} points, ${i.render.triangles} triangles; ` +
      `geometries ${i.memory.geometries}, textures ${i.memory.textures}; lost ${gl.isContextLost()}` +
      `\ncamera ${camera.position.toArray().map(v => v.toFixed(2))}, looking at ${controls.target.toArray().map(v => v.toFixed(2))}, near ${camera.near} far ${camera.far}`;
  }, 1000);
}
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1d2026);
const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

async function fetchBin(url, label) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(url + ': ' + res.status);
  const total = +res.headers.get('content-length') || 0;
  const reader = res.body.getReader();
  const parts = []; let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    say(`Loading ${label}: ${(got / 1e6).toFixed(1)}${total ? ' of ' + (total / 1e6).toFixed(1) : ''} MB`);
  }
  const buf = new Uint8Array(got); let o = 0;
  for (const p of parts) { buf.set(p, o); o += p.length; }
  return buf.buffer;
}

const ROOM_COLOURS = ['255,200,40', '90,200,255', '255,120,120', '140,230,120', '220,150,255', '255,170,90'];
const roomColour = {};
let labelSize = 0.35;
function label(text, room) {
  if (!(room in roomColour)) roomColour[room] = ROOM_COLOURS[Object.keys(roomColour).length % ROOM_COLOURS.length];
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = `rgba(${roomColour[room]},.9)`; g.beginPath(); g.arc(32, 32, 30, 0, 7); g.fill();
  g.fillStyle = '#000'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 32, 34);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(labelSize, labelSize, 1);
  return s;
}

const sets = await (await fetch('data/sets.json')).json();
const want = new URLSearchParams(location.search).get('set');
const set = sets.find((x) => x.name === want) || sets[0];
const picker = document.getElementById('set');
for (const x of sets) {
  const o = document.createElement('option'); o.value = x.name; o.textContent = x.title;
  if (x === set) o.selected = true;
  picker.appendChild(o);
}
picker.onchange = () => { location.search = '?set=' + encodeURIComponent(picker.value); };
const base = `data/${encodeURIComponent(set.name)}/`;
const info = await (await fetch(base + 'scene.json')).json();
const n = info.points;
const pbuf = await fetchBin(base + 'points.bin', 'points');
const pg = new THREE.BufferGeometry();
pg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pbuf, 0, n * 3), 3));
pg.setAttribute('color', new THREE.BufferAttribute(new Uint8Array(pbuf, n * 12, n * 3), 3, true));
const unit = info.nearest_node_median || 1.28;          // sizes follow the model's node spacing
const pmat = new THREE.PointsMaterial({ size: 0.023 * unit, vertexColors: true });
const sizeInput = document.getElementById('size');
sizeInput.min = 0.003 * unit; sizeInput.max = 0.1 * unit; sizeInput.step = 0.002 * unit; sizeInput.value = 0.023 * unit;
labelSize = 0.27 * unit;
const points = new THREE.Points(pg, pmat);
scene.add(points);

const nodeGroup = new THREE.Group(); scene.add(nodeGroup);
const nodeRow = document.getElementById('nodeRow');
const buttons = {}, sprites = {};
for (const [id, nd] of Object.entries(info.nodes)) {
  const name = nd.label || id;
  const [room, num] = name.includes(':') ? name.split(':') : ['', name];
  const s = label(num, room); s.position.fromArray(nd.centre); s.userData.id = id; nodeGroup.add(s); sprites[id] = s;
  const b = document.createElement('button'); b.textContent = room ? `${room} ${num}` : num; nodeRow.appendChild(b);
  b.style.borderBottom = room ? `3px solid rgb(${roomColour[room]})` : '';
  b.onclick = () => standAt(id); buttons[id] = b; b.dataset.room = room;
}
// the room picker shortens the row of node buttons to one room's
{
  const roomSel = document.getElementById('room');
  for (const r of Object.keys(roomColour).filter(Boolean).sort()) {
    const o = document.createElement('option'); o.value = r; o.textContent = r; roomSel.appendChild(o);
  }
  roomSel.onchange = () => { for (const b of Object.values(buttons)) b.style.display = !roomSel.value || b.dataset.room === roomSel.value ? '' : 'none'; };
}

let mesh = null;
async function loadMesh() {
  const m = info.mesh;
  const buf = await fetchBin(base + 'mesh.bin', 'mesh');
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(buf, 0, m.vertices * 3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Uint8Array(buf, m.vertices * 12, m.vertices * 3), 3, true));
  const off = m.vertices * 15, pad = (4 - off % 4) % 4;
  const idx = pad ? new Uint32Array(buf.slice(off, off + m.triangles * 12)) : new Uint32Array(buf, off, m.triangles * 3);
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  mesh = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  scene.add(mesh);
}

function setOn(id, on) { document.getElementById(id).classList.toggle('on', on); }
const lo = new THREE.Vector3().fromArray(info.extent_p2_p98[0]);
const hi = new THREE.Vector3().fromArray(info.extent_p2_p98[1]);

function overview() {
  standing = null; if (typeof setBackdrop === 'function') setBackdrop(null);
  camera.near = 0.01; nodeGroup.visible = document.getElementById('showNodes').classList.contains('on');
  for (const sp of Object.values(sprites)) sp.visible = true;
  for (const b of Object.values(buttons)) b.classList.remove('on');
  setOn('orbit', true);
  controls.enableZoom = controls.enablePan = true;
  controls.rotateSpeed = 1;
  const mid = lo.clone().add(hi).multiplyScalar(0.5);   // the middle of what is loaded
  controls.target.copy(mid);
  const r = hi.clone().sub(lo).length() * 0.45;
  camera.position.copy(mid).add(new THREE.Vector3(r * 0.3, r * 0.8, r * 0.6));
  camera.fov = 60; camera.updateProjectionMatrix();
  controls.update();
  say(`${n.toLocaleString()} points, ${Object.keys(info.nodes).length} nodes. Drag to turn, pinch to zoom.`);
}

function standAt(id, fly = true) {
  const nd = info.nodes[id];
  for (const [k, b] of Object.entries(buttons)) b.classList.toggle('on', k === id);
  setOn('orbit', false);
  const c = new THREE.Vector3().fromArray(nd.centre);
  // facing: the way the eye already looks when at or near a node, the way it travels
  // from the overview, the node's front face (node_from_world's -z) when it arrives
  // from nowhere
  const R = nd.node_from_world;
  let fwd = new THREE.Vector3(-R[2][0], -R[2][1], -R[2][2]);
  if (fly) {
    const d = new THREE.Vector3(); camera.getWorldDirection(d);
    if (standing === null && controls.rotateSpeed > 0) { d.copy(c).sub(camera.position); d.y *= 0.2; }
    if (d.lengthSq() > 1e-9) fwd = d.normalize();
  }
  const done = () => {
    controls.target.copy(c);
    camera.position.copy(c).addScaledVector(fwd, -0.001);
    controls.enableZoom = controls.enablePan = false;
    controls.rotateSpeed = -0.4;
    controls.update();
    standing = id; setBackdrop(id);
    camera.near = 0.15 * unit; camera.updateProjectionMatrix();   // points right at the eye only blot the view
    showNeighbours(id);
    say(`Node ${nd.label || id}. Drag to look round; tap a marker to walk there, double-tap a spot to go to it.`);
  };
  camera.fov = 75; camera.updateProjectionMatrix();
  if (fly) flyTo(c.clone().addScaledVector(fwd, -0.001), c, done);
  else done();
}

// Standing at a node, the markers of the nodes within four spacings stay, to tap.
function showNeighbours(id) {
  const c = new THREE.Vector3().fromArray(info.nodes[id].centre);
  nodeGroup.visible = true;
  for (const [k, sp] of Object.entries(sprites)) sp.visible = k !== id && sp.position.distanceTo(c) < 4 * unit;
}

// ── Getting about ──
// A move is a flight: camera and the point it turns round eased from where they
// are to where they go, in time with the distance.
let flight = null;
function flyTo(pos, target, then) {
  const dist = pos.distanceTo(camera.position);
  flight = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos.clone(), t1: target.clone(),
             at: performance.now(), ms: Math.min(2500, 500 + 400 * dist / unit), then };
  controls.enabled = false;
}
function stepFlight(now) {
  if (!flight) return;
  const u = Math.min((now - flight.at) / flight.ms, 1), e = u * u * (3 - 2 * u);
  camera.position.lerpVectors(flight.p0, flight.p1, e);
  controls.target.lerpVectors(flight.t0, flight.t1, e);
  if (u >= 1) { const f = flight; flight = null; controls.enabled = true; if (f.then) f.then(); }
}

// Walking: hold ▲ or ▼ (or W/S, A/D sideways, Q/E down and up). It leaves the
// node and looks round in place as it goes; the node's faces stay round the eye.
const held = new Set();
const WALK = () => 1.2 * unit;          // per second
function holdButton(id, key) {
  const b = document.getElementById(id);
  const on = (e) => { e.preventDefault(); held.add(key); };
  const off = () => held.delete(key);
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
}
holdButton('fwd', 'w'); holdButton('back', 's');
addEventListener('keydown', (e) => { if (e.target.tagName !== 'SELECT') held.add(e.key.toLowerCase()); });
addEventListener('keyup', (e) => held.delete(e.key.toLowerCase()));
let lastWalk = 0;
function stepWalk(now) {
  const dt = lastWalk ? Math.min((now - lastWalk) / 1000, 0.1) : 0; lastWalk = now;
  if (!held.size || flight) return;
  const f = new THREE.Vector3(); camera.getWorldDirection(f);
  const r = new THREE.Vector3().crossVectors(f, camera.up).normalize();
  const m = new THREE.Vector3();
  if (held.has('w') || held.has('arrowup')) m.add(f);
  if (held.has('s') || held.has('arrowdown')) m.sub(f);
  if (held.has('d') || held.has('arrowright')) m.add(r);
  if (held.has('a') || held.has('arrowleft')) m.sub(r);
  if (held.has('e')) m.add(camera.up);
  if (held.has('q')) m.sub(camera.up);
  if (m.lengthSq() === 0) return;
  m.normalize().multiplyScalar(WALK() * dt);
  if (standing !== null || controls.rotateSpeed < 0) {
    // looking round in place: the turning point stays just ahead of the eye
    if (standing !== null) { standing = null; for (const b of Object.values(buttons)) b.classList.remove('on'); }
    camera.position.add(m); controls.target.copy(camera.position).addScaledVector(f, 0.001);
    const near = nearestNode(camera.position);
    if (near && near !== shownNear) { shownNear = near; showNeighbours(near); }
  } else {
    camera.position.add(m); controls.target.add(m);
  }
}
let shownNear = null;
function nearestNode(p) {
  let best = null, bd = Infinity;
  for (const [k, sp] of Object.entries(sprites)) { const d = sp.position.distanceToSquared(p); if (d < bd) { bd = d; best = k; } }
  return best;
}

// Taps: a node's marker goes there; a double tap on the points flies to that spot
// (in the overview it becomes the point the view turns round; looking round, the
// eye goes to a spacing short of it).
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null, lastTap = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 8 || performance.now() - down.t > 350) { down = null; return; }
  down = null;
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (nodeGroup.visible) {
    const hit = ray.intersectObjects(nodeGroup.children.filter((sp) => sp.visible), false)[0];
    if (hit) { standAt(hit.object.userData.id); return; }
  }
  const now = performance.now();
  if (now - lastTap < 450) { goToSpot(e.clientX, e.clientY); lastTap = 0; } else lastTap = now;
});
// the browser's own double click too (a slow frame can stretch the gap between two taps)
renderer.domElement.addEventListener('dblclick', (e) => { lastTap = 0; goToSpot(e.clientX, e.clientY); });
let lastSpot = 0;
function goToSpot(x, y) {
  if (performance.now() - lastSpot < 600) return;          // the tap pair and dblclick are one gesture
  lastSpot = performance.now();
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set((x - rect.left) / rect.width * 2 - 1, -(y - rect.top) / rect.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  ray.params.Points.threshold = 0.03 * unit;
  const hit = points.visible ? ray.intersectObject(points, false)[0] : null;
  if (!hit) { say('Nothing there to go to: double-tap on the points.'); return; }
  if (standing !== null || controls.rotateSpeed < 0) {
    const f = hit.point.clone().sub(camera.position);
    const goal = hit.point.clone().addScaledVector(f.clone().normalize(), -Math.min(unit, f.length() * 0.5));
    standing = null; for (const b of Object.values(buttons)) b.classList.remove('on');
    flyTo(goal, goal.clone().addScaledVector(f.normalize(), 0.001), () => { const nn = nearestNode(camera.position); if (nn) showNeighbours(nn); });
  } else {
    const off = camera.position.clone().sub(controls.target);
    flyTo(hit.point.clone().add(off.multiplyScalar(Math.max(0.15, Math.min(1, (2 * unit) / off.length())))), hit.point);
  }
}

// a node's cube faces: face f looks along faceDir(f, s, t) in the node frame (s, t image
// fractions, t down), as in face_geometry.py; node frame to world is node_from_world transposed
function faceDir(f, s, t) {
  return [null, [2 * s - 1, 1 - 2 * t, -1], [1 - 2 * s, -1, 1 - 2 * t], [1 - 2 * s, 1 - 2 * t, 1],
    [1, 1 - 2 * t, 2 * s - 1], [-1, 1 - 2 * t, 1 - 2 * s], [1 - 2 * s, 1, 2 * t - 1]][f];
}
function toWorld(R, d) {
  return new THREE.Vector3(R[0][0] * d[0] + R[1][0] * d[1] + R[2][0] * d[2],
    R[0][1] * d[0] + R[1][1] * d[1] + R[2][1] * d[2], R[0][2] * d[0] + R[1][2] * d[1] + R[2][2] * d[2]);
}
const loader = new THREE.TextureLoader();
function faceTexture(id, f) {
  const tx = loader.load(base + `face-${id}-${f}.jpg`);
  tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}
// one face as a quad between image fractions lo..hi, at scale k from the node's centre
function faceQuad(nd, id, f, k, lo, hi, opts) {
  const pos = [], uv = [];
  for (const [s, t] of [[lo, lo], [hi, lo], [hi, hi], [lo, hi]]) {
    const v = toWorld(nd.node_from_world, faceDir(f, s, t)).multiplyScalar(k);
    pos.push(v.x, v.y, v.z); uv.push(s, 1 - t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex([0, 1, 2, 0, 2, 3]);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: faceTexture(id, f), side: THREE.DoubleSide, ...opts }));
  m.position.fromArray(nd.centre);
  return m;
}
// the backdrop: what a node sees with no parallax (sky, sea, far scenery) is its six faces at infinity
let backdrop = null, backdropOn = true, standing = null;
function setBackdrop(id) {
  if (backdrop) { scene.remove(backdrop); backdrop.traverse((o) => { if (o.material) { o.material.map.dispose(); o.material.dispose(); o.geometry.dispose(); } }); backdrop = null; }
  if (!id || !info.faces || !backdropOn) return;
  backdrop = new THREE.Group();
  for (let f = 1; f <= 6; f++) {
    const q = faceQuad(info.nodes[id], id, f, 200, 0, 1, { depthTest: false, depthWrite: false });
    q.renderOrder = -1; backdrop.add(q);
  }
  backdrop.userData.c = new THREE.Vector3().fromArray(info.nodes[id].centre);
  scene.add(backdrop);
}
// the floors: each node's bottom face laid flat at its floor height (the middle 60% of it,
// which is mostly the floor right under the node)
let floors = null;
document.getElementById('showFloors').onclick = () => {
  if (!info.faces) return say('No faces in this data.');
  if (!floors) {
    floors = new THREE.Group();
    // a node whose points were left out of the cloud is misplaced: its floor would float
    for (const [id, nd] of Object.entries(info.nodes)) if (nd.in_cloud !== false) floors.add(faceQuad(nd, id, 2, nd.floor, 0.2, 0.8, {}));
    scene.add(floors); setOn('showFloors', true); return;
  }
  floors.visible = !floors.visible; setOn('showFloors', floors.visible);
};
document.getElementById('showBack').onclick = () => {
  backdropOn = !backdropOn; setOn('showBack', backdropOn); setBackdrop(backdropOn ? standing : null);
};
// the fill: learned depth scaled to COLMAP's and kept where nodes agree (depth_fill.py)
let fill = null;
document.getElementById('showFill').onclick = async () => {
  if (!info.fill) return say('No fill in this data.');
  if (!fill) {
    const fb = await fetchBin(base + 'fill.bin', 'fill');
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(fb, 0, info.fill * 3), 3));
    g.setAttribute('color', new THREE.BufferAttribute(new Uint8Array(fb, info.fill * 12, info.fill * 3), 3, true));
    fill = new THREE.Points(g, pmat); scene.add(fill); setOn('showFill', true);
    say(`Fill: ${info.fill.toLocaleString()} points from learned depth.`); return;
  }
  fill.visible = !fill.visible; setOn('showFill', fill.visible);
};
document.getElementById('orbit').onclick = overview;
document.getElementById('showPts').onclick = () => { points.visible = !points.visible; setOn('showPts', points.visible); };
document.getElementById('showNodes').onclick = () => { nodeGroup.visible = !nodeGroup.visible; setOn('showNodes', nodeGroup.visible); };
document.getElementById('showMesh').onclick = async () => {
  if (!info.mesh) return say('No mesh in this data.');
  if (!mesh) { await loadMesh(); setOn('showMesh', true); say('Mesh loaded.'); return; }
  mesh.visible = !mesh.visible; setOn('showMesh', mesh.visible);
};
document.getElementById('size').oninput = (e) => { pmat.size = +e.target.value; };

overview();
const startNode = new URLSearchParams(location.search).get('node');
if (startNode && info.nodes[startNode]) standAt(startNode, false);
if (new URLSearchParams(location.search).get('floors')) document.getElementById('showFloors').onclick();
if (new URLSearchParams(location.search).get('fill')) document.getElementById('showFill').onclick();
renderer.setAnimationLoop((now) => {
  stepFlight(now); stepWalk(now);
  // the node's faces are at infinity: they go with the eye when it walks off
  if (backdrop && backdrop.userData.c) backdrop.position.copy(camera.position).sub(backdrop.userData.c);
  if (!flight) controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
