<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Myst III: Tomahna, walking</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; color: #eee; }
  canvas { display: block; touch-action: none; }
  #bar { position: fixed; top: 8px; left: 8px; display: flex; background: rgba(0,0,0,.55); border-radius: 6px; }
  #bar button, #bar select, #menubtn { font: inherit; background: none; color: #eee; border: 0; padding: 6px 10px; }
  #bar select { -webkit-appearance: none; appearance: none; cursor: pointer; padding-left: 4px; }
  #bar button:disabled { opacity: .35; }
  #menubtn { position: fixed; top: 8px; right: 8px; background: rgba(0,0,0,.55); border-radius: 6px; font-size: 18px; line-height: 1; padding: 6px 11px; cursor: pointer; }
  #menu { position: fixed; top: 46px; right: 8px; width: 250px; max-height: calc(100% - 60px); overflow-y: auto; background: rgba(12,12,12,.9); border-radius: 6px; padding: 6px 0; display: none; font-size: 13px; }
  #menu.open { display: block; }
  #menu h4 { margin: 8px 12px 2px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #888; }
  #menu button { display: block; width: 100%; text-align: left; font: inherit; background: none; color: #eee; border: 0; padding: 6px 12px; cursor: pointer; }
  #menu button:hover { background: rgba(255,255,255,.08); }
  #menu .info { margin: 4px 12px; font-size: 11px; color: #999; overflow-wrap: anywhere; }
  #status { position: fixed; left: 8px; bottom: 8px; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 6px; font-size: 12px; pointer-events: none; transition: opacity .4s; }
  #tip { position: fixed; pointer-events: none; background: rgba(0,0,0,.75); padding: 2px 6px; border-radius: 4px; font-size: 13px; display: none; }
  #map { position: fixed; right: 8px; bottom: 8px; width: 260px; height: 260px; background: rgba(0,0,0,.72); border: 1px solid #555; border-radius: 6px; touch-action: none; }
  #map.big { width: min(560px, 90vw); height: min(560px, 70vh); }
  #busy { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.7); padding: 6px 12px; border-radius: 4px; display: none; pointer-events: none; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="bar">
  <button id="back" title="Back" disabled>&#8249;</button>
  <select id="sel" title="Go to a node"></select>
</div>
<button id="menubtn" title="Settings">&#8943;</button>
<div id="menu">
  <h4>View</h4>
  <button id="lensbtn" title="Plain: a flat view up to 120 degrees, stretched toward the edges as it widens. Panini: from 60 degrees verticals and lines through the middle stay straight while the sides stop stretching (full at 120). Stereographic: from 60 degrees the view eases into a stereographic lens (full at 120), which keeps shapes near true out to the edges; past 120 the fisheye as before">Lens: plain</button>
  <button id="mapbtn" title="Map of the node layout; double-click it to enlarge">Map: off</button>
  <button id="show" title="Hotspots: off, areas, centres, both">Hotspots: off</button>
  <h4>Play</h4>
  <button id="walkbtn" title="Play the rendered walks and close-ups, or jump as the node traveler does">Walks: on</button>
  <button id="doorbtn" title="The door opening: the game's movie (the rest of the door fading open round it), or H3's whole-door renders">Door: game movie</button>
  <button id="sndbtn" title="The game's sounds: the door opening and closing">Sound: on</button>
  <h4>Checking</h4>
  <button id="facebtn" title="The cube's faces and seams">Faces: off</button>
  <button id="laybtn" title="The map's layout: the proposed places where there are any, or the model's">Layout: proposed</button>
  <button id="fpsbtn" title="Draw the view at the walks' 24 frames a second, or as fast as the screen goes">Frame rate: 24 fps</button>
  <div class="info" id="fovtxt"></div>
  <div class="info" id="load">loading…</div>
  <div class="info" id="moves"></div>
</div>
<div id="status">loading…</div>
<canvas id="map"></canvas>
<div id="tip"></div>
<div id="busy"></div>
<script type="module">
// Tomahna with its walks: the node traveler (node_walk.html) for TOHO and TOHB, where a move plays the walk rendered
// between the two nodes (MiniMax H3, walk_polar3.ps1: two 180-degree fisheyes side by side, 22 frames, the first and
// last frames the two nodes' own pictures) on a sphere round the eye, turned so the walk heads along its game heading,
// while the look stays where it is; and a close-up hotspot turns the view onto the hotspot, brings the bars in to the
// close-up's 16:9 box and narrows the view to 90 degrees across it, then plays the rendered move in (640x360, its first
// frame exactly that view); a click plays it back out. The door between the conservatory and the study follows the
// game's variable 401: shut on arrival at TOHO 4 or 5, opened by its hotspot (shown as node 104 or 105's faces;
// the game plays a movie, 11004 or 10005, not shown here), shut again by script 10004 on leaving for 2, 3, 6, 7 or 8.
// The rest as the node traveler:
// Myst III's nodes as the game shows them: a node's six faces as a cube round the eye, looked round by dragging,
// and its movement hotspots tested on a click as ScummVM tests them (engines/myst3/hotspot.cpp: each rectangle
// a quad facing the eye at its centre's pitch and heading, half its width and height w/90 and h/90 of its
// distance). A walk keeps the way you look, as the game does. Conditions on hotspots (doors open or shut) are
// not kept: every hotspot is live. Data: node_walk.py's walk.json and layout.json; faces in faces/<ROOM>/.
// F draws the cube's seams and names its faces. Zoom (wheel, pinch, + and -) runs from 20 to 360 degrees top to bottom: up to 120 an ordinary perspective view,
// beyond it the scene rendered into a cube map and drawn as a fisheye, r = tan(theta/s) / tan(fov/2s) with
// s = max(1, fov/120), so that at 360 the whole sphere fills a circle the height of the window.
import * as THREE from 'three';

const W = await (await fetch('walk.json', { cache: 'no-store' })).json();
const LAY = await fetch('layout.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : { nodes: {}, proposed: {} }).catch(() => ({ nodes: {}, proposed: {} }));
const NODES = W.nodes;
const V = { 401: 0, 399: 1 };                           // the game's variables these hotspots read (399: always set by now)
const holds = c => { if (c === 1 || c === -1) return c === 1; const a = Math.abs(c), v = a & 2047, val = (a >> 11) - 1;
  const t = val === -1 ? (V[v] || 0) !== 0 : (V[v] || 0) === val; return c < 0 ? !t : t; };   // GameState::evaluate
const woman = 2;                                         // always there (the maintainer, 25 November 2026; it was a switch): the game's frames of her drawn into TOHO 1 and 2's faces and H3's walk, her loops playing
// the door open (104, 105), and the woman drawn in where she is seen (1, 2, 3, 4 and 104: the first frame of her loops)
const WOMANFACES = ['TOHO-0001', 'TOHO-0002', 'TOHO-0003', 'TOHO-0004', 'TOHO-0104'];
const shown = n => { const f = (n === 'TOHO-0004' || n === 'TOHO-0005') && V[401] ? 'TOHO-0' + (100 + +n.slice(5)) : n; return WOMANFACES.includes(f) ? f + 'm' : f; };
// each rendered walk: its video, the game heading it walks along (the mean of the hotspot bearings A to B and back),
// its ends, and the door's state at its ends where it matters ("open" walks leave the open door: 104 or 105 is one end)
const WALKVIDS = [
  ['t0102mm', 1, 2, 183], ['t0203m', 2, 3, 269.5], ['t0204m', 2, 4, 175, 0], ['t02104m', 2, 4, 175, 1], ['t0304m', 3, 4, 138.5, 0],
  ['t03104m', 3, 4, 138.5, 1], ['t104105m', 4, 5, 184.5, 1], ['t0506', 5, 6, 130, 0], ['t10506', 5, 6, 130, 1],
  ['t0507', 5, 7, 233, 0], ['t10507', 5, 7, 233, 1], ['t0508', 5, 8, 181.5, 0], ['t10508', 5, 8, 181.5, 1], ['t0608', 6, 8, 255]];
// the walk for a move from node a to b (TOHO numbers) with the door as it is now: [video, heading, played backwards]
function walkFor(a, b) {
  for (const [id, x, y, h, door] of WALKVIDS) {
    if (door !== undefined) {                          // the door matters at 4 (with 2, 3) and 5 (with 6, 7, 8); 4-5 only when open
      if (door !== V[401]) continue;
    }
    const v = id;
    if (x === a && y === b) return [v, h, false, x, y];
    if (x === b && y === a) return [v, h, true, x, y];
  }
  return null;
}
// the numbers the mesh work uses: room x 1000 + node (Amateria: MACA 1, MAIS 2, MALL 3, MASS 4, MAWW 5, MATO 6)
const num = n => (W.rooms.indexOf(n.slice(0, 4)) + 1) * 1000 + +n.slice(5);
const label = n => `${num(n)} · ${n.slice(0, 4)} ${+n.slice(5)}`;
const byNum = Object.fromEntries(Object.keys(NODES).map(n => [num(n), n]));
const names = Object.keys(NODES).filter(n => !/-01\d\d$/.test(n)).sort((a, b) => num(a) - num(b));   // 104 and 105 are 4 and 5 with the door open
const what = s => s.to ? `${s.kind} to ${num(s.to)}` : s.frame ? `close-up ${s.frame.slice(0, -4)}` : `${s.kind} (${s.args.join(' ')})`;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.01, 100);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (typeof fov === 'number') fov = Math.min(fov, fovMax()); });

// the node frame: x right, y up, -z face 1; face k's pixel (s, t) looks along DIRS[k] (moge_depth.py's)
const DIRS = { 1: (s, t) => [2 * s - 1, 1 - 2 * t, -1], 2: (s, t) => [1 - 2 * s, -1, 1 - 2 * t], 3: (s, t) => [1 - 2 * s, 1 - 2 * t, 1],
  4: (s, t) => [1, 1 - 2 * t, 2 * s - 1], 5: (s, t) => [-1, 1 - 2 * t, 1 - 2 * s], 6: (s, t) => [1 - 2 * s, 1, 2 * t - 1] };
const loader = new THREE.TextureLoader(), cache = new Map();
function tex(url) {
  if (!cache.has(url)) cache.set(url, new Promise(res => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; res(t); }, undefined, () => res(null))));
  return cache.get(url);
}
const faceUrl = (n, k) => `faces/${n.slice(0, 4)}/${n}-f${k}.jpg`;
const loadNode = n => Promise.all([1, 2, 3, 4, 5, 6].map(k => tex(faceUrl(n, k))));
function cube(texs) {
  const g = new THREE.Group();
  for (let k = 1; k <= 6; k++) {
    const P = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([s, t]) => DIRS[k](s, t));
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(P.flat(), 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 1, 1, 1, 0, 0, 1, 0], 2));
    geo.setIndex([0, 2, 1, 1, 2, 3]);
    g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: texs[k - 1], side: THREE.DoubleSide, transparent: true, depthWrite: false })));
  }
  g.scale.setScalar(10);
  return g;
}

// ScummVM's direction (x = cos p sin h, y = sin p, z = cos p cos h) is the node frame's with x turned round
const sv = v => new THREE.Vector3(-v.x, v.y, v.z);
const dirOf = (p, h) => { const P = p * Math.PI / 180, H = h * Math.PI / 180; return new THREE.Vector3(Math.cos(P) * Math.sin(H), Math.sin(P), Math.cos(P) * Math.cos(H)); };
function rectCorners([p, h, w, hh]) {          // in ScummVM's frame, as polarRectTo3dRect
  const d = dirOf(p, h).multiplyScalar(50), u = new THREE.Vector3(d.z, 0, -d.x).normalize();
  const v = new THREE.Vector3().crossVectors(d, u).normalize();
  const U = u.multiplyScalar(w / 90 * 50), V = v.multiplyScalar(hh / 90 * 50);
  return [d.clone().add(V).sub(U), d.clone().add(V).add(U), d.clone().sub(V).add(U), d.clone().sub(V).sub(U)];   // TL TR BR BL
}
function hits(ray, rect) {                       // rayIntersectsRect, the ray from the origin
  const [tl, tr, br, bl] = rectCorners(rect), top = tr.clone().sub(tl), left = bl.clone().sub(tl);
  const n = new THREE.Vector3().crossVectors(top, left), nd = n.dot(ray);
  if (Math.abs(nd) < 1e-6) return false;
  const t = n.dot(tl) / nd; if (t < 0) return false;
  const q = ray.clone().multiplyScalar(t).sub(tl), a = q.dot(top), b = q.dot(left);
  return a >= 0 && a <= top.dot(top) && b >= 0 && b <= left.dot(left);
}
function spotAt(n, ray) {
  if (!ray) return null;
  const r = sv(ray);
  for (const s of NODES[n] || []) if (holds(s.cond)) for (const rect of s.rects) if (hits(r, rect)) return s;
  return null;
}

// the hotspots drawn: 0 off, 1 their areas (filled, labelled with the move), 2 their centres (marked, labelled with
// the heading and pitch), 3 both
let spotMode = 0, outlines = null;
const MODES = ['off', 'areas', 'centres', 'both'];
const colOf = s => s.to ? (s.kind.startsWith('zip') ? 0x40c0ff : 0x40ff60) : s.frame ? 0xffe040 : 0xff8040;
// a close-up the game draws as one flat frame (a node with no cube faces): shown over the scene; a tap, click or Escape closes it
const FR = document.createElement('div');
FR.style.cssText = 'position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:20;cursor:pointer';
FR.innerHTML = '<img style="max-width:96vw;max-height:90vh;box-shadow:0 0 24px #000;border:1px solid #666"><div style="position:absolute;bottom:10px;color:#ddd;font:13px system-ui">close-up · tap to go back</div>';
document.body.appendChild(FR);
let frOpened = 0;   // the tap that opens a close-up ends in a click that lands on it: ignored for a moment
FR.onclick = () => { if (performance.now() - frOpened > 450) FR.style.display = 'none'; };
function showFrame(f) { FR.querySelector('img').src = `frames/${f}`; FR.style.display = 'flex'; frOpened = performance.now(); }
addEventListener('keydown', e => { if (e.key === 'Escape' && FR.style.display !== 'none') FR.style.display = 'none'; });
function labelSprite(text, col, w = 0.7) {
  const cv = document.createElement('canvas'), cx = cv.getContext('2d'); cx.font = 'bold 40px system-ui, sans-serif';
  cv.width = Math.ceil(cx.measureText(text).width + 24); cv.height = 56;
  cx.fillStyle = 'rgba(0,0,0,.7)'; cx.fillRect(0, 0, cv.width, cv.height); cx.fillStyle = '#' + col.toString(16).padStart(6, '0');
  cx.font = 'bold 40px system-ui, sans-serif'; cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.fillText(text, cv.width / 2, 30);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  sp.userData.size = [w * cv.width / 256 * 1.6, w * 0.3]; sp.renderOrder = 12;
  return sp;
}
function drawSpots(n) {
  if (outlines) { scene.remove(outlines); outlines.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { o.material.map && o.material.map.dispose(); o.material.dispose(); } }); outlines = null; }
  document.getElementById('show').textContent = 'Hotspots: ' + MODES[spotMode];
  if (!spotMode) return;
  outlines = new THREE.Group();
  for (const s of NODES[n] || []) if (holds(s.cond)) for (const rect of s.rects) {
    const col = colOf(s), pts = rectCorners(rect).map(c => sv(c).multiplyScalar(0.1));
    const target = s.to ? `${s.kind} → ${num(s.to)}` : `${s.kind} ${s.args.join(' ')}`;
    if (spotMode & 1) {
      outlines.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: col, depthTest: false })));
      const fill = new THREE.BufferGeometry().setFromPoints([pts[0], pts[1], pts[2], pts[0], pts[2], pts[3]]);
      const m = new THREE.Mesh(fill, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.16, depthTest: false, depthWrite: false, side: THREE.DoubleSide }));
      m.renderOrder = 9; outlines.add(m);
      const sp = labelSprite(target, col);                     // at the area's top edge, inside it
      const top = pts[0].clone().add(pts[1]).multiplyScalar(0.5), mid = pts[0].clone().add(pts[2]).multiplyScalar(0.5);
      sp.position.copy(top.lerp(mid, 0.18)); outlines.add(sp);
    }
    if (spotMode & 2) {
      const c = sv(dirOf(rect[0], rect[1])).multiplyScalar(5);
      const dot = labelSprite('+', col, 0.4); dot.position.copy(c); outlines.add(dot);
      const sp = labelSprite(`${s.to ? num(s.to) : s.kind} · ${rect[1]}° ${rect[0] >= 0 ? '+' : '−'}${Math.abs(rect[0])}°`, col, 0.55);
      sp.position.copy(c).add(new THREE.Vector3(0, -0.2, 0)); sp.userData.below = true; outlines.add(sp);
    }
  }
  outlines.renderOrder = 10; scene.add(outlines);
}
function sizeLabels() {                         // the labels' size kept about the same on screen as the view widens
  const k = Math.max(fov, 20) / 65;
  for (const g of [outlines, seams]) if (g) g.traverse(o => { if (o.isSprite) { o.scale.set(o.userData.size[0] * k, o.userData.size[1] * k, 1); } });
}
// the cube's seams (its twelve edges, straight lines between the corners' directions, so they fall on the seams at
// any zoom and in the fisheye) and each face's number and side at its centre
let seams = null;
const FACE = { 1: 'front', 2: 'bottom', 3: 'back', 4: 'right', 5: 'left', 6: 'top' };
function toggleSeams() {
  document.getElementById('facebtn').textContent = 'Faces: ' + (seams ? 'off' : 'on');
  if (seams) { scene.remove(seams); seams.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { o.material.map && o.material.map.dispose(); o.material.dispose(); } }); seams = null; }
  else {
    seams = new THREE.Group();
    const mat = new THREE.LineBasicMaterial({ color: 0xffe040, depthTest: false, transparent: true, opacity: 0.85 });
    for (let k = 1; k <= 6; k++) {
      const P = [[0, 0], [1, 0], [1, 1], [0, 1]].map(([u, t]) => new THREE.Vector3(...DIRS[k](u, t)).multiplyScalar(4));
      const l = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(P), mat); l.renderOrder = 8; seams.add(l);
      const sp = labelSprite(`f${k} ${FACE[k]}`, 0xffe040, 0.6);
      sp.position.copy(new THREE.Vector3(...DIRS[k](0.5, 0.5)).multiplyScalar(4)); seams.add(sp);
    }
    scene.add(seams);
  }
  document.getElementById('facebtn').style.borderColor = seams ? '#ffe040' : '#666';
}
document.getElementById('facebtn').onclick = toggleSeams;

// looking round: yaw about the node's up, pitch; the game's heading 0 looks along +z (face 3)
let yaw = 0, pitch = 0, fov = 65, forceFish = false;
const FOV_MIN = 20;
// the widest zoom: the fisheye's whole circle (theta = 180 degrees, the view straight behind) inside the screen's
// shorter side with a small border (the maintainer: zoom fully out to the whole circle, phone and desktop). Past 240
// both fisheye lenses have s = fov / 120, so the circle's radius in half-heights is tan(120 pi / fov) / tan(60); at
// 360 it touches the top and bottom, and an upright screen, narrower than tall, needs more (about 560 at 9:19.5)
const fovMax = () => 120 * 180 / (Math.atan(Math.sqrt(3) * 0.96 * Math.min(1, innerWidth / innerHeight)) * 180 / Math.PI);
const fish = () => !(inClose || (closing && !closing.fishPhase)) && (forceFish || fov > lensFrom());   // a close-up's box is a plain perspective; the 360 close-up starts in the fisheye
// the lens: theta = s atan(r tan(fov / 2s)), s = 1 a plain view, s = 2 stereographic. Plain: s = 1 up to 120 degrees,
// then fov / 120. Stereographic (the maintainer: less distortion at about 120): s eases from 1 at 60 to 2 at 120, then
// max(2, fov / 120), so it meets the plain view at 60 and the fisheye's own s at 240, with no jump anywhere
let lens = 'plain';
// Panini (the maintainer: straight lines curve too much in stereographic): verticals and lines through the middle stay
// straight; d eases from 0 (a plain view exactly) at 60 to 1 at 120 and stays 1; the vertical as the plain lens (s = 1 up
// to 120, then fov / 120), so it widens past 120 with no switch
const sm = f => (t => t * t * (3 - 2 * t))(Math.min(1, Math.max(0, (f - 60) / 60)));
const panOf = f => lens === 'panini' ? sm(f) : -1;
const sOf = f => lens === 'stereo' ? (f <= 120 ? 1 + (t => t * t * (3 - 2 * t))(Math.min(1, Math.max(0, (f - 60) / 60))) : Math.max(2, f / 120)) : Math.max(1, f / 120);
const lensFrom = () => lens === 'plain' ? 120 : 60;      // the width above which the view is drawn through the lens
function look() {
  camera.aspect = innerWidth / innerHeight;
  const d = new THREE.Vector3(...dirOf(pitch, yaw).toArray()); d.x = -d.x;
  camera.lookAt(d); camera.fov = (closing || inClose) ? Math.min(fov, 170) : Math.min(fov, 120); camera.updateProjectionMatrix();
  const ft = `${Math.round(fov)}°` + (fish() ? (lens === 'panini' ? ' Panini' : fov > 120 ? ' fisheye' : ' stereographic') : '');
  if (ft !== fovShown) { if (fovShown !== null) status(ft, 1500); fovShown = ft; document.getElementById('fovtxt').textContent = 'view ' + ft; }
}
// the one line at the bottom left: the loading while it lasts, the view's width for a moment as it changes
let fovShown = null, statusUntil = 0, statusTimer = 0;
function status(text, ms) {
  const e = document.getElementById('status'); e.textContent = text; e.style.opacity = 1;
  clearTimeout(statusTimer); statusUntil = ms ? performance.now() + ms : 0;
  if (ms) statusTimer = setTimeout(() => { e.style.opacity = 0; if (loadingText) setTimeout(() => status(loadingText), 400); }, ms);
}
let loadingText = 'loading…';
// a window point's direction, as either view draws it (null outside the fisheye's circle)
function rayAt(x, y) {
  const X = (x / innerWidth * 2 - 1) * innerWidth / innerHeight, Y = 1 - y / innerHeight * 2, r = Math.hypot(X, Y);
  const T = fov / 2 * Math.PI / 180, s = sOf(fov), pan = panOf(fov);
  if (fish() && pan >= 0) {                              // Panini, as the shader
    const tT = Math.tan(T / s), xx = X * tT * s, k = xx * xx / (pan + 1) ** 2, ds = k * k * pan * pan - (k + 1) * (k * pan * pan - 1);
