  <style>

    }
    #viewer-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .ui-container {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      z-index: 10000; 
      width: 96%;
      pointer-events: none;
    }
    
    .controls-row {
      display: flex; gap: 6px; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 6px; padding: 6px 10px;
      pointer-events: auto; white-space: nowrap;
      max-width: 100%; box-sizing: border-box;
      flex-wrap: wrap;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .controls-row::-webkit-scrollbar { display: none; }
    .controls-row { -ms-overflow-style: none; scrollbar-width: none; }
    
    button, select {
      background: transparent; 
      color: rgba(255, 255, 255, 0.9);
      border: none; border-radius: 4px;
      font-size: 13px; font-weight: 500;
      padding: 6px 12px; cursor: pointer;
      outline: none; transition: background 0.2s, color 0.2s, transform 0.1s;
    }
    button:hover, select:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    button:active { transform: scale(0.95); }
    button.active { background: rgba(255, 255, 255, 0.25); color: #fff; }
    
    select {
      appearance: none; padding-right: 28px;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22rgba(255,255,255,0.8)%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat; background-position: right 8px top 50%; background-size: 10px auto;
    }

    .upload-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px; padding: 4px 10px; font-size: 11px; cursor: pointer;

      flex: 1; text-align: center;
    }
    .upload-btn:hover { background: rgba(255,255,255,0.25); }
    .upload-btn.active { border-color: #4ade80; color: #4ade80; }

    input[type=range] { 
      -webkit-appearance: none; background: transparent; 
      width: 100px; max-width: 25vw; height: 32px;

    input[type=range]::-webkit-slider-runnable-track {

    input[type=range]::-webkit-slider-thumb:hover { background: #fff; transform: scale(1.15); transition: transform 0.1s ease; }
    
    .depth-label { color:rgba(255,255,255,0.8); font-size:11px; text-transform:uppercase; margin-left: 8px; font-weight: bold; letter-spacing: 0.5px; }

    #caption {
      position: absolute; left: 50%; transform: translateX(-50%);

    #dni-trigger { width: 20px; height: 20px; margin-left: 6px; cursor: pointer; border-radius: 4px; transition: background 0.2s; padding: 2px; }

    #dni-zoom-overlay {

      display: flex; flex-direction: column; justify-content: center; align-items: center;

  <script type="module">
    import * as THREE from 'three';
    import { sampleAtlasGlsl, detectLayout, layoutUsesGutter, GUTTER_PX, LAYOUTS } from './atlas-layout.js';

    // Assets live next to this page. Loading them relatively (rather than from
    // raw.githubusercontent.com) keeps them on the Pages CDN, drops a cross-origin
    // handshake, avoids raw's throttling, and lets the viewer run from a local server.
    const rawUrl = './';

    const locations = [
      {
        name: 'Amateria',
        baseUrl: rawUrl + 'amateria/',
        type: 'side-numbered',
        audio: rawUrl + 'amateria/audio_amateria.mp3',
        hasDepth: false,
        versions: [
          { label: 'Original', suffix: '_orig.jpeg' },
          { label: '4K',       suffix: '_seamless.webp' }
        ]
      },
      {
        name: 'Voltaic',
        baseUrl: rawUrl + 'voltaic/',
        type: 'voltaic',
        audio: rawUrl + 'amateria/audio_amateria.mp3',
        hasDepth: true,
        depthSuffix: '-depth.jpeg',
        versions: [
          { label: 'Original', suffix: '_orig.jpeg' }
        ]
      },
      {
        name: "J'nanin",
        baseUrl: rawUrl + 'jnanin/',
        type: 'classic-leis',
        audio: null,
        hasDepth: false,
        versions: [
          { label: 'Original',    suffix: '-orig.jpg' },
          { label: '2K (HD)',     suffix: '-hdmod.webp' },
          { label: '6K',          suffix: '-seamless.webp' }
        ]
      },
      {
        name: 'Custom (LDI Upload)',
        type: 'custom',
        audio: null,
        hasDepth: false,
        versions: [{ label: 'Local Files', type: 'custom' }]
      }
    ];
    
    let currentLocation = locations[1];
    let currentVersionIndex = 0;
    let hasActiveDepth = false; 
    let isTransitioning = false;
    let currentLoadId = 0;
    
    const customMaps = { fgColor: null, fgDepth: null, bgColor: null, bgDepth: null };

    const defaultCustomData = new Uint8Array([20, 20, 20, 255]);
    const defaultCustomTex = new THREE.DataTexture(defaultCustomData, 1, 1, THREE.RGBAFormat);
    defaultCustomTex.colorSpace = THREE.SRGBColorSpace;
    defaultCustomTex.needsUpdate = true;
    
    const forceCustomSelection = () => {
      const locSelect = document.getElementById('location-selector');
      const customIdx = locations.findIndex(l => l.type === 'custom');
      if (locSelect.value != customIdx) {
          locSelect.value = customIdx;
          currentLocation = locations[customIdx];
          currentVersionIndex = 0;
          updateUI();
      }
    };

    const setupUploader = (id, mapKey) => {
        document.getElementById(`upload-${id}`).addEventListener('change', e => {
            if(e.target.files[0]) {
                if(customMaps[mapKey]) URL.revokeObjectURL(customMaps[mapKey]);
                customMaps[mapKey] = URL.createObjectURL(e.target.files[0]);
                document.getElementById(`lbl-upload-${id}`).classList.add('active');
                forceCustomSelection();
                isTransitioning = false;
                loadPanorama('fade');
            }
            e.target.value = '';
        });
    };

    setupUploader('fg-color', 'fgColor');
    setupUploader('fg-depth', 'fgDepth');
    setupUploader('bg-color', 'bgColor');
    setupUploader('bg-depth', 'bgDepth');

    // --- Handoff from the stitcher ---
    // The stitcher stashes freshly built atlases in IndexedDB and sends the user
    // here, so an atlas doesn't have to be downloaded and re-uploaded by hand.
    const HANDOFF_DB = 'cubemap-handoff', HANDOFF_STORE = 'atlases';
    const HANDOFF_SLOTS = {
      'fg-color': 'fgColor', 'fg-depth': 'fgDepth',
      'bg-color': 'bgColor', 'bg-depth': 'bgDepth',
    };

    async function takeHandoffAtlases() {
      if (!window.indexedDB) return false;
      let db;
      try {
        db = await new Promise((resolve, reject) => {
          const req = indexedDB.open(HANDOFF_DB, 1);
          req.onupgradeneeded = () => req.result.createObjectStore(HANDOFF_STORE);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      } catch (e) { return false; }

      const found = await new Promise((resolve) => {
        const out = {};
        const tx = db.transaction(HANDOFF_STORE, 'readwrite');
        const store = tx.objectStore(HANDOFF_STORE);
        for (const slot of Object.keys(HANDOFF_SLOTS)) {
          const get = store.get(slot);
          get.onsuccess = () => { if (get.result) { out[slot] = get.result; store.delete(slot); } };
        }
        tx.oncomplete = () => resolve(out);
        tx.onerror = () => resolve(out);
      });
      db.close();

      let any = false;
      for (const [slot, blob] of Object.entries(found)) {
        const mapKey = HANDOFF_SLOTS[slot];
        if (customMaps[mapKey]) URL.revokeObjectURL(customMaps[mapKey]);
        customMaps[mapKey] = URL.createObjectURL(blob);
        document.getElementById(`lbl-upload-${slot}`).classList.add('active');
        any = true;
      }
      return any;
    }

    // --- Audio System ---
    const audioSystem = { active: new Audio(), fading: new Audio(), isMuted: true, masterVolume: 0, currentUrl: currentLocation.audio, fadeInterval: null };
    audioSystem.active.loop = true; audioSystem.fading.loop = true;

    const audioToggleBtn = document.getElementById('audio-toggle');
    const volumeSlider = document.getElementById('volume-slider');
    const largeVolumeSlider = document.getElementById('large-volume-slider');
    let savedVolume = 15; 

    function setVolume(rawVal) {
      const val = parseInt(rawVal, 10);
      audioSystem.masterVolume = val / 25;
      volumeSlider.value = val; largeVolumeSlider.value = val;

      if (val === 0) {
        audioSystem.isMuted = true; audioToggleBtn.classList.remove('active'); audioSystem.active.pause();
      } else {
        audioSystem.isMuted = false; audioToggleBtn.classList.add('active');
        if (audioSystem.currentUrl && (!audioSystem.active.src || audioSystem.active.src === '')) playOrCrossfadeAudio(audioSystem.currentUrl);
        else if (audioSystem.active.src && audioSystem.active.paused) audioSystem.active.play().catch(e => console.warn(e));
        audioSystem.active.volume = audioSystem.masterVolume;
      }
      targetDniState = dniStates[val];
      if (!isDniAnimating) { isDniAnimating = true; animateDni(); }
    }

    audioToggleBtn.addEventListener('click', () => { setVolume(audioSystem.masterVolume === 0 ? savedVolume : (savedVolume = Math.round(audioSystem.masterVolume * 25), 0)); });
    volumeSlider.addEventListener('input', (e) => setVolume(e.target.value));
    largeVolumeSlider.addEventListener('input', (e) => setVolume(e.target.value));

    // Ramp a media element's volume to a target over ~1s, then run onDone.
    function rampVolume(el, from, to, onDone) {
      if (audioSystem.fadeInterval) clearInterval(audioSystem.fadeInterval);
      let step = 0; const steps = 20;
      audioSystem.fadeInterval = setInterval(() => {
        step++; const progress = step / steps;
        el.volume = Math.max(0, Math.min(1, from + (to - from) * progress));
        if (step >= steps) { clearInterval(audioSystem.fadeInterval); if (onDone) onDone(); }
      }, 50);
    }

    // Locations with `audio: null` used to leave the previous track playing,
    // because playOrCrossfadeAudio bails on a falsy URL. Fade out instead.
    function fadeOutAudio() {
      audioSystem.currentUrl = null;
      if (!audioSystem.active.src) return;
      const el = audioSystem.active;
      rampVolume(el, el.volume, 0, () => { el.pause(); el.removeAttribute('src'); });
    }

    function playOrCrossfadeAudio(newUrl) {
      if (!newUrl) { fadeOutAudio(); return; }
      if (audioSystem.currentUrl === newUrl && audioSystem.active.src) {
        if (!audioSystem.isMuted && audioSystem.masterVolume > 0 && audioSystem.active.paused) audioSystem.active.play().catch(e=>console.warn(e));
        return;
      }
      audioSystem.currentUrl = newUrl;
      if (audioSystem.isMuted || audioSystem.masterVolume === 0) return;

      const temp = audioSystem.fading; audioSystem.fading = audioSystem.active; audioSystem.active = temp;
      audioSystem.active.src = newUrl; audioSystem.active.volume = 0;
      audioSystem.active.play().catch(e => console.warn(e));

      if (audioSystem.fadeInterval) clearInterval(audioSystem.fadeInterval);

      let step = 0; const steps = 20;
      audioSystem.fadeInterval = setInterval(() => {
        step++; const progress = step / steps;
        audioSystem.active.volume = progress * audioSystem.masterVolume;
        if (audioSystem.fading.src) audioSystem.fading.volume = Math.max(0, 1 - progress) * audioSystem.masterVolume;
        if (step >= steps) { 
            clearInterval(audioSystem.fadeInterval); 
            if (audioSystem.fading.src) { 
                audioSystem.fading.pause(); 
                audioSystem.fading.removeAttribute('src'); 
            } 
        }
      }, 50);
    }

    // --- D'ni SVG Morph Engine ---
    const emptyPath = [0,0, 0,0, 0,0];
    const onesMap = { 0: [emptyPath, emptyPath], 1: [[0,-10, 0,-5, 0,0], [0,0, 0,5, 0,10]], 2: [[-10,-10, -5,-5, -5,0], [-5,0, -5,5, -10,10]], 3: [[0,-10, -5,-5, -10,0], [-10,0, -5,5, 0,10]], 4: [[0,10, 0,2.5, 0,-5], [0,-5, 5,-5, 10,-5]] };
    const fivesMap = { 0: [emptyPath, emptyPath], 1: [[-10,0, -5,0, 0,0], [0,0, 5,0, 10,0]], 2: [[-10,10, -5,5, 0,5], [0,5, 5,5, 10,10]], 3: [[-10,0, -5,5, 0,10], [0,10, 5,5, 10,0]], 4: [[10,0, 2.5,0, -5,0], [-5,0, -5,-5, -5,-10]] };
    const dniStates = [];
    for (let i = 0; i <= 25; i++) {

    const vTemp = new THREE.Vector3();

    const bgGeometry = geometry.clone();

    // Face slots: 0=-X 1=+X 2=+Y 3=-Y 4=+Z 5=-Z.
    //
    // u must increase in the direction of increasing yaw on every wall, since
    // the render loop sweeps +X -> +Z -> -X -> -Z as lon increases. The ±Z
    // faces used to have u running the other way, which mirrored them relative
    // to ±X: the horizon still lined up (it is horizontal everywhere) but the
    // content across every vertical seam did not. The poles were mirrored the
    // same way. Verified by measuring seam mismatch against the source images:
    // the four wall seams drop from ~30 to 3-11 out of 255.
    const gnomonicUvGlsl = `
      vec2 gnomonicUV(vec3 p, int face) {
        vec2 uv;
        if (face == 0) {
          uv = vec2(-p.z / abs(p.x), p.y / abs(p.x));
        } else if (face == 1) {
          uv = vec2( p.z / abs(p.x), p.y / abs(p.x));
        } else if (face == 2) {
          uv = vec2(-p.x / abs(p.y), -p.z / abs(p.y));
        } else if (face == 3) {
          uv = vec2(-p.x / abs(p.y),  p.z / abs(p.y));
        } else if (face == 4) {
          uv = vec2(-p.x / abs(p.z), p.y / abs(p.z));
        } else {
          uv = vec2( p.x / abs(p.z), p.y / abs(p.z));
        }
        return uv * 0.5 + 0.5;

    `;

    // --- UNIFIED MATERIAL ENGINE ---

    // to the bg colour instead of showing black void.
    const createMaterials = (colorMode, depthMode, seamFill = false, layoutId = '5x3') => {
        const usesAtlas = colorMode === 'atlas' || depthMode === 'atlas';
        const atlasLogic = usesAtlas ? sampleAtlasGlsl(layoutId) : '';
        const gutterUniform = (usesAtlas && layoutUsesGutter(layoutId)) ? { uGutterFrac: { value: 0.0 } } : {};
        const mats = [];
        for (let i = 0; i < 6; i++) {
          const colorSample     = colorMode === 'atlas' ? `sampleAtlas(tColor, uFace, vUv)` : `texture2D(tColor, vUv)`;
          const depthSample     = depthMode === 'atlas' ? `sampleAtlas(tDepth, uFace, vUv)` : `texture2D(tDepth, vUv)`;
          const fragDepthSample = depthMode === 'atlas' ? `sampleAtlas(tDepth, uFace, vUv)` : `texture2D(tDepth, vUv)`;

          const extraUniforms = seamFill ? { tBgColor: { value: null } } : {};

          mats.push(new THREE.ShaderMaterial({
            uniforms: {
              tColor: { value: null },
              tDepth: { value: dummyDepthTex },
              uDisplacementScale: { value: 0.0 },
              uFace: { value: i },
              uIsForeground: { value: 0 },
              uTearThreshold: { value: 0.0 },
              ...gutterUniform,
              ...extraUniforms
            },
            transparent: true, 
            vertexShader: `
              uniform sampler2D tDepth;
              uniform float uDisplacementScale;
              uniform int uFace;
              varying vec2 vUv;
              ${gnomonicUvGlsl}
              ${atlasLogic}
              void main() {
                vec3 dir = normalize(position);
                vec2 rawUv = gnomonicUV(dir, uFace);
                vUv = clamp(rawUv, 0.001, 0.999);
                float vDepth = clamp(${depthSample}.r, 0.0, 1.0);
                vec3 newPos = position * (1.0 - (vDepth * uDisplacementScale));
                gl_Position = projectionMatrix * modelViewMatrix * vec4(newPos, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D tColor;
              uniform sampler2D tDepth;
              uniform int uFace;
              uniform int uIsForeground;
              uniform float uTearThreshold;
              ${seamFill ? 'uniform sampler2D tBgColor;' : ''}
              varying vec2 vUv;
              ${atlasLogic}
              void main() {
                float texDepth = clamp(${fragDepthSample}.r, 0.0, 1.0);
                float alpha = 1.0;
                
                if (uIsForeground == 1) {
                    if (texDepth < 0.03) alpha = 0.0; 
                    
                    if (uTearThreshold > 0.0) {
                        vec2 stepX = vec2(0.002, 0.0);
                        vec2 stepY = vec2(0.0, 0.002);
                        
                        vec2 uvR = clamp(vUv + stepX, 0.001, 0.999);
                        vec2 uvL = clamp(vUv - stepX, 0.001, 0.999);
                        vec2 uvU = clamp(vUv + stepY, 0.001, 0.999);
                        vec2 uvD = clamp(vUv - stepY, 0.001, 0.999);
                        
                        float dR = clamp(${depthMode === 'atlas' ? 'sampleAtlas(tDepth, uFace, uvR)' : 'texture2D(tDepth, uvR)'}.r, 0.0, 1.0);
                        float dL = clamp(${depthMode === 'atlas' ? 'sampleAtlas(tDepth, uFace, uvL)' : 'texture2D(tDepth, uvL)'}.r, 0.0, 1.0);
                        float dU = clamp(${depthMode === 'atlas' ? 'sampleAtlas(tDepth, uFace, uvU)' : 'texture2D(tDepth, uvU)'}.r, 0.0, 1.0);
                        float dD = clamp(${depthMode === 'atlas' ? 'sampleAtlas(tDepth, uFace, uvD)' : 'texture2D(tDepth, uvD)'}.r, 0.0, 1.0);
                        
                        float texGrad = length(vec2(dR - dL, dU - dD));
                        float thresh = mix(0.20, 0.01, uTearThreshold);
                        alpha *= 1.0 - smoothstep(thresh * 0.5, thresh, texGrad);
                    }

                    // Seam fill: instead of discarding torn/masked fg pixels to black,
                    // substitute the bg colour at the same UV so cracks are invisible.
                    ${seamFill ? `
                    if (alpha < 0.05) {
                      vec4 bgCol = sampleAtlas(tBgColor, uFace, vUv);
                      gl_FragColor = vec4(bgCol.rgb, 1.0);
                      #include <tonemapping_fragment>
                      #include <colorspace_fragment>

                    }
                    ` : `if (alpha < 0.05) discard;`}
                } else {
                  if (alpha < 0.05) discard;
                }
                
                vec4 texColor = ${colorSample};
                gl_FragColor = vec4(texColor.rgb, texColor.a * alpha);
                
                #include <tonemapping_fragment>
                #include <colorspace_fragment>
              }
            `,
            side: THREE.FrontSide, depthWrite: true 
          }));
        }
        return mats;
    };

    // Atlas material sets depend on the layout of the atlas being shown, and an
    // atlas layout is only known once an image has loaded. Build them on first
    // use for a given layout rather than compiling every combination up front.
    const MAT_KINDS = {
        standard:      ['standard', 'standard', false],
        atlasStandard: ['atlas',    'standard', false],
        atlasFg:       ['atlas',    'atlas',    true],   // seamFill enabled
        atlasBg:       ['atlas',    'atlas',    false],
    };
    const matSetCache = new Map();

    function getMatSet(kind, layoutId = '5x3') {
        const key = kind === 'standard' ? kind : `${kind}|${layoutId}`;

        if (!set) {

            set = createMaterials(colorMode, depthMode, seamFill, layoutId);
            set.forEach(m => { m.userData.isBg = kind === 'atlasBg'; });
            matSetCache.set(key, set);
        }
        return set;
    }

    const eachMaterial = (fn) => { for (const set of matSetCache.values()) set.forEach(fn); };

    // The bg sphere displaces at half the fg rate so it stays behind the fg.
    function setDisplacement(val) {
        const fgScale = val * 0.95;
        eachMaterial(m => {
            m.uniforms.uDisplacementScale.value = m.userData.isBg ? fgScale * 0.5 : fgScale;
        });
    }

    // Atlases written in a gutter layout reserve a border of GUTTER_PX per cell;
    // the shader insets its UVs by the matching fraction.
    function setGutterFrac(mats, atlasWidth, layoutId) {
        const l = LAYOUTS[layoutId];
        if (!l || !l.gutter || !atlasWidth) return;
        const frac = GUTTER_PX / (atlasWidth / l.cols);

    }

    scene.add(fgCubeMesh);

    // --- 3D DECAL VIDEO ENGINE ---
    document.getElementById('upload-decal').addEventListener('change', e => {

    document.getElementById('tear-slider').addEventListener('input', (e) => {

    const videoTexture = new THREE.VideoTexture(sourceVideo);

    videoTexture.magFilter = THREE.LinearFilter;
    videoTexture.generateMipmaps = false;

    // --- Custom Camera Controller & Pointer Tracking ---
    let lon = 225, lat = 0; 
    let phi = 0, theta = 0;
    
    let gyroActive = false;
    let panLon = 0, panLat = 0;
    const panOffset = new THREE.Quaternion();
    const panEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    let isDragging = false, startX, startY, startLon, startLat;
    const gyroEuler = new THREE.Euler(), gyroQ0 = new THREE.Quaternion(), gyroQ1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), zee = new THREE.Vector3(0, 0, 1);
    let deviceOrientation = null, screenOrientation = 0;

    let currentMouseX = 0, currentMouseY = 0;

    }, { passive: true });

    document.addEventListener('touchmove', e => {

        e.preventDefault(); 
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY, true);

    document.addEventListener('touchend', e => {
      if (e.touches.length === 0) { isDragging = false; initialPinchDistance = null; } 
      else if (e.touches.length === 1) { initialPinchDistance = null; onPointerDown(e.touches[0].clientX, e.touches[0].clientY); }
    });

    // --- TRANSITION SYSTEM ---
    const transitionScene = new THREE.Scene();
    const transitionCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    
    // Match the drawing buffer, not the CSS size — otherwise the transition
    // composites a low-res buffer onto a hi-dpi canvas and looks soft throughout.
    const rtWidth  = () => Math.floor(window.innerWidth  * pixelRatio);
    const rtHeight = () => Math.floor(window.innerHeight * pixelRatio);

    let rtOld = new THREE.WebGLRenderTarget(rtWidth(), rtHeight(), { type: THREE.HalfFloatType });
    let rtNew = new THREE.WebGLRenderTarget(rtWidth(), rtHeight(), { type: THREE.HalfFloatType });

    const FRAG_BLOCK = `
      uniform sampler2D tOld;
      uniform sampler2D tNew;
      uniform sampler2D tDepthNew;
      uniform float uProgress;
      uniform float uAspect;
      uniform float uDepthBias;
      varying vec2 vUv;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      void main() {
        float gridCols = 50.0;
        float gridRows = floor(gridCols / uAspect);
        vec2 blockId  = floor(vec2(vUv.x * gridCols, vUv.y * gridRows));

        float noise = hash(blockId);

        vec2 blockCenter = (blockId + 0.5) / vec2(gridCols, gridRows);
        float depthVal = texture2D(tDepthNew, blockCenter).r;

        // Blend the block's reveal threshold from pure noise toward depth-ordered.
        // (This used to apply uDepthBias twice, once inside depthWeighted and again
        // in the mix, which flattened the bias curve.)
        float threshold = mix(noise, noise * 0.5 + depthVal * 0.5, uDepthBias);

        if (uProgress > threshold) {
          gl_FragColor = texture2D(tNew, vUv);
        } else {
          gl_FragColor = texture2D(tOld, vUv);
        }
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;

    const FRAG_FADE = `
      uniform sampler2D tOld;
      uniform sampler2D tNew;
      uniform float uProgress;
      varying vec2 vUv;
      void main() {
        gl_FragColor = mix(texture2D(tOld, vUv), texture2D(tNew, vUv), smoothstep(0.0, 1.0, uProgress));
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `;

    // Two materials sharing one uniforms object, rather than swapping
    // fragmentShader + needsUpdate on a single material — that forced a shader
    // recompile at the start of every transition, which stalls on mobile.
    const transitionUniforms = {
      tOld:      { value: null },
      tNew:      { value: null },
      tDepthNew: { value: dummyDepthTex },
      uProgress: { value: 0 },
      uAspect:   { value: 1.0 },
      uDepthBias:{ value: 0.6 }
    };
    const makeTransitionMat = (fragmentShader) => {
      const m = new THREE.ShaderMaterial({
        uniforms: transitionUniforms,
        vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
        fragmentShader,
        depthTest: false,
        depthWrite: false
      });
      m.uniforms = transitionUniforms; // share, don't clone
      return m;
    };
    const transitionMats = { block: makeTransitionMat(FRAG_BLOCK), fade: makeTransitionMat(FRAG_FADE) };
    const setTransitionUniform = (name, value) => { transitionUniforms[name].value = value; };

    const transitionMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), transitionMats.block);
    transitionScene.add(transitionMesh);

    let pendingTransitionDepth = null;

    const textureLoader = new THREE.TextureLoader(); textureLoader.crossOrigin = 'anonymous';

    function safeDisposeTextures() {
        const toDispose = new Set();
        eachMaterial(mat => {
            const c = mat.uniforms.tColor.value; const d = mat.uniforms.tDepth.value;
            if (c && c !== videoTexture && c !== defaultCustomTex) toDispose.add(c);
            if (d && d !== dummyDepthTex) toDispose.add(d);
        });
        return toDispose;
    }

    // Downscale anything the GPU won't accept. J'nanin's "6K" faces are 6144px,
    // which exceeds the 4096 limit common on mobile parts — the upload then fails
    // silently (black faces) or drops the context. Downscaling is preferable to
    // either, and is a no-op on desktop GPUs that can take the full size.
    function fitToGpu(tex) {
        const img = tex && tex.image;
        if (!img || (img.width <= maxTextureSize && img.height <= maxTextureSize)) return tex;

        const scale = maxTextureSize / Math.max(img.width, img.height);
        const canvas = document.createElement('canvas');
        canvas.width  = Math.max(1, Math.floor(img.width  * scale));
        canvas.height = Math.max(1, Math.floor(img.height * scale));
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        console.info(`Downscaled ${img.width}x${img.height} texture to ${canvas.width}x${canvas.height} (GPU limit ${maxTextureSize}).`);

        const fitted = new THREE.CanvasTexture(canvas);
        fitted.colorSpace = tex.colorSpace;
        tex.dispose();
        return fitted;
    }

    // Depth is sampled with normalised UVs, so its resolution never had to match
    // the colour map. This used to resample every depth map onto a canvas at the
    // colour map's size — a full-size canvas plus a CanvasTexture per face, for
    // no visual difference. Now we just apply the sampling settings in place.
    function prepareDepthTex(dTex) {
        if (!dTex || dTex === dummyDepthTex || !dTex.image) return dTex;
        dTex.colorSpace = THREE.NoColorSpace;
        dTex.minFilter = THREE.LinearFilter;
        dTex.magFilter = THREE.LinearFilter;
        dTex.wrapS = THREE.ClampToEdgeWrapping;
        dTex.wrapT = THREE.ClampToEdgeWrapping;
        dTex.generateMipmaps = false;
        dTex.needsUpdate = true;
        return dTex;
    }

    function getCubemapUrls(loc, version, fetchDepth = false) {
      const s = fetchDepth ? loc.depthSuffix : (typeof version === 'string' ? version : (version.suffix || ''));
      const type = fetchDepth ? loc.type : ((typeof version === 'object' && version.type) ? version.type : loc.type);
      
      let p;
      if (type === 'side-numbered') { p = { front: loc.baseUrl+'MAWWnodes-8'+s, bottom: loc.baseUrl+'MAWWnodes-9'+s, back: loc.baseUrl+'MAWWnodes-10'+s, right: loc.baseUrl+'MAWWnodes-11'+s, left: loc.baseUrl+'MAWWnodes-12'+s, top: loc.baseUrl+'MAWWnodes-13'+s }; }
      else if (type === 'voltaic') { 
        p = { left: loc.baseUrl+'ENCHnodes-281'+s, front: loc.baseUrl+'ENCHnodes-277'+s, right: loc.baseUrl+'ENCHnodes-280'+s, back: loc.baseUrl+'ENCHnodes-279'+s, top: loc.baseUrl+'ENCHnodes-282'+s, bottom: loc.baseUrl+'ENCHnodes-278'+s }; 
      } 
      else { p = { left: loc.baseUrl+'LEIS665'+s, front: loc.baseUrl+'LEIS661'+s, right: loc.baseUrl+'LEIS664'+s, back: loc.baseUrl+'LEIS663'+s, top: loc.baseUrl+'LEIS666'+s, bottom: loc.baseUrl+'LEIS662'+s }; }
      
      return [p.left, p.right, p.top, p.bottom, p.back, p.front]; 
    }

    function buildTransitionDepthTex(depthTextures) {
      if (!depthTextures) return dummyDepthTex;
      const frontTex = depthTextures[4] || depthTextures[0];
      if (!frontTex || frontTex === dummyDepthTex || !frontTex.image) return dummyDepthTex;
      const SIZE = 64;
      const canvas = document.createElement('canvas');
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(frontTex.image, 0, 0, SIZE, SIZE);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.NoColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      return tex;
    }

    // --- Load error surfacing ---
    // Failures used to be console-only: the spinner vanished and the previous
    // scene just stayed put with no explanation.
    const loadErrorEl = document.getElementById('load-error');
    let pendingRetry = null;

    function showLoadError(locationName, retryFn, detail) {
      document.getElementById('load-error-msg').textContent = detail
        ? `${locationName}: ${detail}`
        : `Couldn't load ${locationName}. Check your connection and try again.`;
      pendingRetry = retryFn;
      loadErrorEl.classList.add('active');
    }
    function hideLoadError() {
      loadErrorEl.classList.remove('active');
      pendingRetry = null;
    }
    document.getElementById('load-error-retry').addEventListener('click', () => {
      const retry = pendingRetry;
      hideLoadError();
      if (retry) retry();
    });
    document.getElementById('load-error-dismiss').addEventListener('click', hideLoadError);

    async function loadPanorama(mode = 'block') {
      if (isTransitioning) return;
      const loadId = ++currentLoadId;
      isTransitioning = true;
      // Tracks whether we reached the tween, which then owns clearing isTransitioning.
      let handedOffToTween = false;
      document.getElementById('loader').style.display = 'block';
      hideLoadError();
      // Always call: a location with `audio: null` needs the previous track faded out.
      playOrCrossfadeAudio(currentLocation.audio);

      renderer.setRenderTarget(rtOld); renderer.render(scene, camera); renderer.setRenderTarget(null);
      setTransitionUniform('tOld', rtOld.texture);
      setTransitionUniform('tNew', rtNew.texture);
      setTransitionUniform('uProgress', 0);
      transitionMesh.material = mode === 'block' ? transitionMats.block : transitionMats.fade;

      const targetVersion = currentLocation.versions[currentVersionIndex];
      const isVideo = targetVersion.type === 'video-5x3';
      const isCustom = currentLocation.type === 'custom';
      
      try {
          const oldTextures = safeDisposeTextures();

          if (isVideo) {
            hasActiveDepth = currentLocation.hasDepth;
            depthControlsContainer.style.display = hasActiveDepth ? 'flex' : 'none';
            tearControls.style.display = 'none';
            videoToggleBtn.style.display = 'inline-block';
            sourceVideo.src = targetVersion.url; sourceVideo.load();
            await new Promise(r => { 
              if(sourceVideo.readyState >= 2) r(); else sourceVideo.onloadeddata = () => r(); 
            });
            
            let depthTextures = null;
            if (hasActiveDepth) {
                const dUrls = getCubemapUrls(currentLocation, targetVersion, true);
                const loadedDepths = await Promise.all(dUrls.map(async (url) => {
                    try { return await textureLoader.loadAsync(url); } 
                    catch(e) { console.warn("Missing depth map:", url); return dummyDepthTex; }
                }));
                depthTextures = loadedDepths.map(prepareDepthTex);
            }
            
            const currentSliderVal = hasActiveDepth ? (parseFloat(document.getElementById('displacement-slider').value) / 100.0) : 0.0;
            
            // Video atlases are 5x3 by definition of the version's type.
            fgCubeMesh.material = getMatSet(hasActiveDepth ? 'atlasStandard' : 'atlasFg', '5x3');
            bgCubeMesh.visible = false;
            
            fgCubeMesh.material.forEach((mat, i) => {
              mat.uniforms.tColor.value = videoTexture;
              mat.uniforms.tDepth.value = depthTextures ? depthTextures[i] : dummyDepthTex;
              mat.uniforms.uDisplacementScale.value = currentSliderVal * 0.95;
              mat.uniforms.uIsForeground.value = 0;
            });

            pendingTransitionDepth = buildTransitionDepthTex(depthTextures);
            
          } else if (isCustom) {
            videoToggleBtn.style.display = 'none';
            sourceVideo.pause();
            
            const isDualLayer = !!customMaps.bgColor;
            
            const loaded = await Promise.all([
                customMaps.fgColor ? textureLoader.loadAsync(customMaps.fgColor) : Promise.resolve(defaultCustomTex),
                customMaps.fgDepth ? textureLoader.loadAsync(customMaps.fgDepth) : Promise.resolve(dummyDepthTex),
                isDualLayer ? textureLoader.loadAsync(customMaps.bgColor) : Promise.resolve(defaultCustomTex),
                (isDualLayer && customMaps.bgDepth) ? textureLoader.loadAsync(customMaps.bgDepth) : Promise.resolve(dummyDepthTex)
            ]);
            
            const processAtlasTex = (tex, isColor) => {
                if (tex === defaultCustomTex || tex === dummyDepthTex) return tex;
                tex.colorSpace = isColor ? THREE.SRGBColorSpace : THREE.NoColorSpace;
                tex = fitToGpu(tex);
                tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter; tex.magFilter = THREE.LinearFilter;
                tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
                tex.needsUpdate = true;
                return tex;
            };

            const fgC = processAtlasTex(loaded[0], true);
            let fgD = loaded[1];
            const bgC = processAtlasTex(loaded[2], true);
            let bgD = loaded[3];

            fgD = prepareDepthTex(fgD);
            bgD = prepareDepthTex(bgD);

            if (loadId !== currentLoadId) return;

            // Which atlas layout is this? Read it off the aspect ratio of the
            // first real image we have; a mis-shaped upload used to render as
            // garbage with no explanation.
            const shapeSource = [fgC, bgC, fgD, bgD]
              .find(t => t !== defaultCustomTex && t !== dummyDepthTex && t.image);
            const atlasW = shapeSource ? shapeSource.image.width : 0;
            const atlasH = shapeSource ? shapeSource.image.height : 0;
            const detected = shapeSource ? detectLayout(atlasW, atlasH) : LAYOUTS['5x3'];
            if (!detected) {
              throw new Error(
                `Atlas is ${atlasW}x${atlasH} (${(atlasW / atlasH).toFixed(2)}:1). ` +
                `Expected 5:3 or 3:2 — stitch it with the face stitcher first.`);
            }
            const layoutId = detected.id;

            hasActiveDepth = !!customMaps.fgDepth || !!customMaps.bgDepth;
            depthControlsContainer.style.display = hasActiveDepth ? 'flex' : 'none';
            tearControls.style.display = isDualLayer ? 'flex' : 'none';
            
            const currentSliderVal = hasActiveDepth ? (parseFloat(document.getElementById('displacement-slider').value) / 100.0) : 0.0;
            const currentTearVal = isDualLayer ? (parseFloat(document.getElementById('tear-slider').value) / 100.0) : 0.0;
            const fgScale = currentSliderVal * 0.95;
            const bgScale = currentSliderVal * 0.95 * 0.5;
            
            fgCubeMesh.material = getMatSet('atlasFg', layoutId);
            bgCubeMesh.material = getMatSet('atlasBg', layoutId);
            bgCubeMesh.visible = isDualLayer;
            setGutterFrac(fgCubeMesh.material, atlasW, layoutId);
            setGutterFrac(bgCubeMesh.material, atlasW, layoutId);
            
            fgCubeMesh.material.forEach((mat) => {
              mat.uniforms.tColor.value = fgC;
              mat.uniforms.tDepth.value = fgD;
              mat.uniforms.uDisplacementScale.value = fgScale;
              mat.uniforms.uIsForeground.value = isDualLayer ? 1 : 0;
              mat.uniforms.uTearThreshold.value = currentTearVal;
              // Wire bg colour into the seam-fill sampler
              if (isDualLayer && mat.uniforms.tBgColor) mat.uniforms.tBgColor.value = bgC;
            });
            
            if (isDualLayer) {
                bgCubeMesh.material.forEach((mat) => {
                  mat.uniforms.tColor.value = bgC;
                  mat.uniforms.tDepth.value = bgD;
                  mat.uniforms.uDisplacementScale.value = bgScale;
                  mat.uniforms.uIsForeground.value = 0;
                });
            }
            
            [fgC, fgD, bgC, bgD].forEach(t => oldTextures.delete(t));

            const fakeDepthArr = fgD !== dummyDepthTex ? [fgD, fgD, fgD, fgD, fgD, fgD] : null;
            pendingTransitionDepth = buildTransitionDepthTex(fakeDepthArr);
            
          } else {
            videoToggleBtn.style.display = 'none';
            sourceVideo.pause();
            
            const urls = getCubemapUrls(currentLocation, targetVersion, false);
            const loadedColors = await Promise.all(urls.map(url => textureLoader.loadAsync(url)));
            
            if (loadId !== currentLoadId) return; 
            
            let depthTextures = null;
            if (currentLocation.hasDepth) {
                depthControlsContainer.style.display = 'flex';
                tearControls.style.display = 'none';
                const dUrls = getCubemapUrls(currentLocation, targetVersion, true);
                const loadedDepths = await Promise.all(dUrls.map(async (url) => {
                    try { return await textureLoader.loadAsync(url); } 
                    catch(e) { console.warn("Missing depth map:", url); return dummyDepthTex; }
                }));
                
                depthTextures = loadedDepths.map(prepareDepthTex);
            } else {
                depthControlsContainer.style.display = 'none';
            }

            hasActiveDepth = currentLocation.hasDepth;
            const currentSliderVal = hasActiveDepth ? (parseFloat(document.getElementById('displacement-slider').value) / 100.0) : 0.0;
            
            fgCubeMesh.material = getMatSet('standard');
            bgCubeMesh.visible = false;
            
            fgCubeMesh.material.forEach((mat, i) => {
              loadedColors[i].colorSpace = THREE.SRGBColorSpace;
              const tex = loadedColors[i] = fitToGpu(loadedColors[i]);
              tex.minFilter = THREE.LinearMipmapLinearFilter;
              tex.magFilter = THREE.LinearFilter;
              tex.generateMipmaps = true;
              mat.uniforms.tColor.value = tex;
              
              if (depthTextures && depthTextures[i] && depthTextures[i] !== dummyDepthTex) {
                  mat.uniforms.tDepth.value = depthTextures[i];
              } else {
                  mat.uniforms.tDepth.value = dummyDepthTex; 
              }
              
              mat.uniforms.uDisplacementScale.value = currentSliderVal * 0.95;
              mat.uniforms.uIsForeground.value = 0;
            });
            
            loadedColors.forEach(t => oldTextures.delete(t));
            if(depthTextures) depthTextures.forEach(t => oldTextures.delete(t));

            pendingTransitionDepth = buildTransitionDepthTex(depthTextures);
          }
          
          oldTextures.forEach(t => t.dispose());
          // Load body completed; the tween below now owns isTransitioning.
          handedOffToTween = true;

      } catch (err) {
          console.error("Failed to load panorama:", err);
          // Our own validation errors carry a message worth showing verbatim.
          showLoadError(currentLocation.name, () => loadPanorama(mode),
                        err instanceof Error && err.message ? err.message : null);
          return;
      } finally {
          // Every exit path clears the spinner. isTransitioning is only left set
          // when the tween below has taken ownership of it — previously a stale-load
          // return skipped both and locked the viewer permanently.
          document.getElementById('loader').style.display = 'none';
          if (!handedOffToTween) isTransitioning = false;
      }

      if (mode === 'block' && pendingTransitionDepth) {
        setTransitionUniform('tDepthNew', pendingTransitionDepth);
      } else {
        setTransitionUniform('tDepthNew', dummyDepthTex);
      }

      const duration = mode === 'block' ? 1400 : 600;
      const startTime = performance.now();
      function animateTween(now) {
        if (loadId !== currentLoadId) return;
        const p = Math.min((now - startTime) / duration, 1);
        setTransitionUniform('uProgress', p);
        if (p < 1) requestAnimationFrame(animateTween);
        else {
          isTransitioning = false;
          if (pendingTransitionDepth && pendingTransitionDepth !== dummyDepthTex) {
            pendingTransitionDepth.dispose();
            pendingTransitionDepth = null;
          }
          setTransitionUniform('tDepthNew', dummyDepthTex);
        }
      }
      requestAnimationFrame(animateTween);
    }

    // --- Main Render Loop ---
    function render() {
      requestAnimationFrame(render);

      currentMouseX += (targetMouseX - currentMouseX) * 0.1;
      currentMouseY += (targetMouseY - currentMouseY) * 0.1;

      camera.position.set(0, 0, 0);

      if (deviceOrientation && !isDragging) {
        if (baseGamma === null) { 
           baseGamma = deviceOrientation.gamma || 0; 
           baseBeta = deviceOrientation.beta || 0; 
        } else {
           baseGamma += ((deviceOrientation.gamma || 0) - baseGamma) * 0.05;
           baseBeta += ((deviceOrientation.beta || 0) - baseBeta) * 0.05;
        }
        
        let dGamma = (deviceOrientation.gamma || 0) - baseGamma;
        let dBeta = (deviceOrientation.beta || 0) - baseBeta;

        if (dGamma > 180) dGamma -= 360; else if (dGamma < -180) dGamma += 360;
        if (dBeta > 180) dBeta -= 360; else if (dBeta < -180) dBeta += 360;

        tiltX = THREE.MathUtils.lerp(tiltX, THREE.MathUtils.clamp(dGamma * 0.05, -1, 1), 0.1);
        tiltY = THREE.MathUtils.lerp(tiltY, THREE.MathUtils.clamp(dBeta * 0.05, -1, 1), 0.1);
      } else {
        tiltX = THREE.MathUtils.lerp(tiltX, 0, 0.1);
        tiltY = THREE.MathUtils.lerp(tiltY, 0, 0.1);
      }

      if (gyroActive && deviceOrientation) {
        const alpha = deviceOrientation.alpha ? THREE.MathUtils.degToRad(deviceOrientation.alpha) : 0;
        const beta = deviceOrientation.beta ? THREE.MathUtils.degToRad(deviceOrientation.beta) : 0;
        const gamma = deviceOrientation.gamma ? THREE.MathUtils.degToRad(deviceOrientation.gamma) : 0;
        const orient = screenOrientation ? THREE.MathUtils.degToRad(screenOrientation) : 0;
        gyroEuler.set(beta, alpha, -gamma, 'YXZ');
        
        const qGyro = new THREE.Quaternion().setFromEuler(gyroEuler).multiply(gyroQ1).multiply(gyroQ0.setFromAxisAngle(zee, -orient));
        
        panEuler.set(THREE.MathUtils.degToRad(panLat), THREE.MathUtils.degToRad(panLon), 0, 'YXZ');
        panOffset.setFromEuler(panEuler);
        
        camera.quaternion.copy(panOffset).multiply(qGyro);
      } else {
        phi = THREE.MathUtils.degToRad(90 - lat); 
        theta = THREE.MathUtils.degToRad(lon);
        camera.lookAt(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta));
      }

      let orbitRadius = 0.0;
      let swayX = 0, swayY = 0;
      let parallaxStrength = 0.0;

      if (hasActiveDepth) {
          orbitRadius = -3.5; 
          
          const floatTime = performance.now() * 0.0006;
          swayX = Math.sin(floatTime) * 1.5 + Math.cos(floatTime * 0.7) * 0.5;
          swayY = Math.cos(floatTime * 1.1) * 1.0 + Math.sin(floatTime * 0.8) * 0.5;
          
          parallaxStrength = gyroActive ? 1.0 : 2.5;
      } 

      camera.translateZ(orbitRadius); 
      camera.translateX(swayX + (currentMouseX + tiltX) * parallaxStrength);
      camera.translateY(swayY + (currentMouseY + tiltY) * parallaxStrength);

      if (isTransitioning) {
        renderer.setRenderTarget(rtNew);
        renderer.render(scene, camera);
        renderer.setRenderTarget(null);
        renderer.render(transitionScene, transitionCamera);
      } else {
        renderer.render(scene, camera);
      }
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      rtOld.setSize(rtWidth(), rtHeight()); rtNew.setSize(rtWidth(), rtHeight());
      setTransitionUniform('uAspect', window.innerWidth / window.innerHeight);
    });

    function updateUI() {
      const locSelect = document.getElementById('location-selector');
      if (locSelect.options.length === 0) {
        locations.forEach((loc, i) => { const opt = document.createElement('option'); opt.value = i; opt.textContent = loc.name; if (loc === currentLocation) opt.selected = true; locSelect.appendChild(opt); });
        locSelect.onchange = (e) => {
          // loadPanorama refuses to start mid-transition. Without this guard the
          // select and the rebuilt controls moved on while the scene did not.
          if (isTransitioning) {
            e.target.value = locations.indexOf(currentLocation);
            return;
          }
          const isLocChange = locations[e.target.value] !== currentLocation;
          currentLocation = locations[e.target.value]; currentVersionIndex = 0;
          updateUI(); loadPanorama(isLocChange ? 'block' : 'fade');
        };
      }
      
      const qBar = document.getElementById('quality-buttons');
      const uploadUI = document.getElementById('custom-upload-controls');
      
      if (currentLocation.type === 'custom') {
          qBar.style.display = 'none';
          uploadUI.style.display = 'flex';
      } else {
          qBar.style.display = 'flex';
          uploadUI.style.display = 'none';
          qBar.innerHTML = '';
          currentLocation.versions.forEach((v, idx) => {
            const btn = document.createElement('button'); btn.textContent = v.label;
            if (idx === currentVersionIndex) btn.classList.add('active');
            btn.onclick = () => { if (currentVersionIndex !== idx && !isTransitioning) { currentVersionIndex = idx; updateUI(); loadPanorama('fade'); } };
            qBar.appendChild(btn);
          });
      }
    }

    setTransitionUniform('uAspect', window.innerWidth / window.innerHeight);
    updateUI();
    // Compile the currently bound programs up front so the shader build doesn't
    // land inside the first rendered frame.
    renderer.compile(scene, camera);
    renderer.compile(transitionScene, transitionCamera);
    render();

    // Arriving from the stitcher (or with #custom) opens straight into the
    // custom slot, with any handed-off atlases already filled in.
    (async () => {
      const handedOff = await takeHandoffAtlases();
      if (handedOff || location.hash === '#custom') forceCustomSelection();
      loadPanorama('block');
    })();

  </script>
</body>
</html>
