<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zoomfleeni Maker</title>
<!--
  Zoomfleeni Maker - build a Zoombini (or a Fleen) the way the 1996 game's
  Zoombini Isle screen does: a tile for each choice of each feature, and a
  dice for a random one - here one feature at a time, under tabs. It then
  stands there idling, as the game's characters do.

  Where the pieces come from. Everything drawn here is the game's own art,
  pulled out of its Mohawk archives by tools/export_web.py in the separate
  zoombinis extraction project, which writes sprites.js next to this file.
  Do not hand-edit sprites.js; re-run that.

  - The characters are assembled from the in-game atlases (ZOOMBINI tBMP
    3000, FLEENS tBMP 4000), one rest pose per part variant, each with its
    REGS anchor. Every part is drawn at (origin - anchor), which is how the
    game lines them up. The maker screen has its own large parts (PICKER
    tBMP 4300) but no anchors for them - where the game puts those is in the
    EXE - so they are not used: guessing offsets would put noses on cheeks.
  - The Zoombini tiles are the maker screen's real buttons (PICKER tBMP
    4400), in the same variant order as the atlas. The game has no Fleen
    maker; the Fleen tiles are made by the exporter in the same style, and
    so are the two body tiles, which the game has no need of. The dice and
    the go arrow are PICKER tBMP 4200.

  The character is drawn with its origin fixed in the preview, not centred
  on its own outline, so the body stays put and only the feature you change
  moves - hair and feet are lopsided, and re-centring on every click makes
  the whole figure jump.

  Which body it is - Zoombini or Fleen - is picked like any feature, from
  the first row of tiles, and either can wear the other's parts: each
  feature row offers the Zoombini's five, then the Fleen's five. The fitting is done by the
  exporter, not here - the part's skin recoloured to the host's (a Fleen's
  legs belong to its feet, a Zoombini's eyelids to its eyes), mirrored
  because a Zoombini faces right and a Fleen left, and re-anchored to the
  host's head top, body bottom, or its own eye and nose spots (and Fleen hair
  goes under a Zoombini's eyes, which sit too high to clear it). Borrowed feet
  get more: a Zoombini's far foot goes behind the egg and its near foot in
  front, and a Fleen keeps its own legs for Zoombini shoes and stands its
  stalk on a Zoombini spring, wheels or propeller.
  The page only paints the result (see variantsFor).

  Every so often it walks on the spot, in one of the game's directions - a
  Zoombini has five per pair of feet, from towards the viewer round to away
  from them - to the right or, mirrored, to the left, and stays turned that
  way afterwards. A Fleen hop-steps (its hop frames face right, though it
  stands facing left) or runs away from the viewer, in its own feet or in
  Zoombini sneakers or skates. Borrowed Fleen wheels, treads and rockets use the
  Fleen's own spinning, rolling and firing frames; see
  walk_clip() and FLEEN_RIDES in the exporter for how borrowed feet walk.

  The idling is the game's own: its idle scripts for each character, which
  change nothing but the eyes, the head's facing, the feet and where the
  whole figure stands - glances and blinks, a Zoombini turning its head and
  showing off its feet (tapping sneakers, a bouncing spring, a propeller
  spinning up), a Fleen's glances. The exporter writes them in terms of what
  the parts do - rest, blink, glance, facing - rather than frame numbers, so
  borrowed eyes blink and glance with their own frames, and borrowed parts,
  having no turned frames, ride along with the turning head. A Fleen on a
  Zoombini spring, wheels or propeller plays that device's special too.
  Fleen idles never blink, so the page adds a blink of its own. Motion stops for prefers-reduced-motion, and
  the Pause button stops it anywhere. Save's picture always takes the rest
  pose; its GIFs play one animation each (see animationsFor), looping in the
  window first, to be saved from there (previewGIF).

  Names come from the game's own generator (ZOOMBINI.EXE seg26:1f26, run for
  every Zoombini it makes), ported letter for letter - see makeName(). A new
  name comes with the dice or a click on the name; picking one feature keeps
  it. The game writes names lowercase; the page capitalises them to show.

  Why the sprite sheet is a data: URI inside sprites.js rather than a PNG:
  so "Save picture" works when the page is opened from file://. A canvas that has
  drawn a file:// image is tainted and toBlob() throws.

  Pixel art is only ever scaled by whole numbers - the preview picks the
  largest integer CSS scale that fits, and image-rendering: pixelated does
  the rest - so every source pixel stays square.
-->
<!-- The game's own fonts, WordLa's bitmap sizes as pixel TrueType:
     fonts.js, from tools/export_fonts.py --wordla, embeds them so the page works from
     file:// too. -->
<script src="fonts.js"></script>
<style>
  /* The look is the game's Zoombini Isle builder, made of its own parts
     rather than drawn from it (the scene itself stays out, as a backdrop
     behind the character was tried and taken out): the night sky's blues,
     the dark rock the builder's tiles sit in, the dice and green go arrow
     that are its own buttons, and, for everything with words on, the flat
     grey stone of its name bar - a bevel lit from the top right, a black
     outline - pressed in, as a picked tile is, to the same tan. (The
     tiles' speckled face was tried on those first; words on it were hard to
     read.) Every edge is square and in whole source pixels at 2x, like the
     tiles beside them. */
  :root {
    color-scheme: dark;
    --night: #1c185a;                    /* the builder's sky, darkest to lightest */
    --night-deep: #101042;
    --night-hi: #212173;
    --cloud: #7384ce;
    --rock: #312929;                     /* the rock round the builder's tiles */
    --rock-lo: #211818;
    --rock-hi: #423942;
    --stone: #828282;                    /* a tile: face, bevel, pressed */
    --stone-hi: #c0c0c0;
    --stone-lo: #414141;
    --stone-deep: #202020;
    --tan: #e7b55a;
    --tan-hi: #f1dfb2;
    --tan-lo: #ce8431;
    --tan-deep: #844a39;
    --window: #828282;                   /* behind the character: the tiles' grey stone, so dark hair shows */
    --zoombini: #9ebfff;                 /* the two skins, for the title */
    --fleen: #c9ee31;
    --text: #f1dfb2;
    --rock-img: none;
    /* the game's own pixel serif, WordLa, each size drawn by hand and set
       at its own height in px or twice it (fonts.js) - Sam's pick over
       Cornerstone drawn in pixels, whose strokes came out uneven */
    --display: 'WordLa 24', serif;
    --ui: 'WordLa 14', serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: var(--ui);
    font-weight: 500;
    line-height: 1.35;
    font-size: 15px;
  }
  button { touch-action: manipulation; font: inherit; -webkit-tap-highlight-color: transparent; }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 16px 36px;
  }

  /* ---- materials ---- */

  /* A stone plaque: the name bar's flat face, a tile's two-step bevel
     (light on the top and right, dark on the left and bottom), a black
     outline, and its words cut in. */
  .stone {
    color: #111;
    background: var(--stone);
    border: 2px solid #000;
    border-radius: 0;
    box-shadow:
      inset 0 2px 0 var(--stone-hi), inset -2px 0 0 var(--stone-hi),
      inset 2px 0 0 var(--stone-deep), inset 0 -2px 0 var(--stone-deep),
      inset 0 4px 0 var(--stone), inset -4px 0 0 var(--stone),
      inset 4px 0 0 var(--stone-lo), inset 0 -4px 0 var(--stone-lo);
    text-shadow: 1px 1px 0 var(--stone-hi);               /* cut in */
    cursor: pointer;
  }
  .stone:hover { filter: brightness(1.08); }
  /* pressed, or picked: the tan face, the bevel turned round */
  .stone:active, .stone[aria-selected="true"], .stone[aria-pressed="true"] {
    background: var(--tan);
    box-shadow:
      inset 0 2px 0 var(--tan-deep), inset -2px 0 0 var(--tan-deep),
      inset 2px 0 0 var(--tan-hi), inset 0 -2px 0 var(--tan-hi),
      inset 0 4px 0 var(--tan-lo), inset -4px 0 0 var(--tan-lo),
      inset 4px 0 0 #fefefe, inset 0 -4px 0 #fefefe;
    color: #4a1d08;
    text-shadow: 1px 1px 0 var(--tan-hi);
    filter: none;
  }
  /* The rock the tiles and the window are set in. */
  .rock {
    background: var(--rock) var(--rock-img) 0 0 / 64px 64px;
    image-rendering: pixelated;
    border: 2px solid #000;
    box-shadow: inset 2px 2px 0 var(--rock-hi), inset -2px -2px 0 var(--rock-lo);
  }
  :focus-visible { outline: 3px solid var(--tan); outline-offset: 2px; }

  /* ---- header ---- */

  header { margin-bottom: 16px; }
  /* Cartoon lettering: the skin of whichever character is being made, in
     the art's own black outline. */
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 52px;
    line-height: 1;
    margin: 0;
    color: var(--zoombini);
    text-shadow:
      2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000,
      2px 2px #000, -2px 2px #000, 2px -2px #000, -2px -2px #000,
      4px 5px 0 #000;
  }
  body[data-kind="fleen"] h1 { color: var(--fleen); }

  /* ---- the character and its controls ---- */

  /* The buttons were in two places - saving and sharing in the header, the
     name, dice and Pause under the window - and read as a scatter.
     Now each sits with what it acts on: the name bar under the character,
     as the game's builder has it; Pause in the window's corner, as it stops
     the window; and one bar for the rest, rolling at one end and saving and
     sharing at the other. */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }
  .stage { display: flex; flex-direction: column; gap: 12px; }
  .window {
    padding: 10px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  /* what saving or copying did, over the foot of the window, clear of the
     Pause button in its corner */
  .status {
    position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; padding: 0 8px;
    text-align: center; pointer-events: none;
    text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000;
  }
  .preview {
    align-self: stretch;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: var(--window);
    border: 2px solid #000;
    box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  #preview { display: block; image-rendering: pixelated; }
  .corner {
    position: absolute; top: 8px; right: 8px;
    width: 44px; height: 44px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .corner canvas { display: block; width: 18px; height: 18px; image-rendering: pixelated; }
  /* sound, in the other top corner: off to begin with, so a plaque that
     says so, beside its speaker */
  .corner.left { right: auto; left: 8px; width: auto; gap: 8px; padding: 0 12px 2px 10px; font-size: 15px; }
  .corner.left canvas { width: 24px; }
  /* Arrows in the window's other corner: the character walks that way, as
     far as its feet go (see waysOf). A Zoombini's four go along, towards us
     and away; a Fleen's hop and its run away are both on the slant, so it
     has the diagonals, and left and right where it walks along. */
  .pad {
    position: absolute; right: 8px; bottom: 8px; z-index: 2;
    display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 2px;
  }
  .pad button { padding: 0; display: flex; align-items: center; justify-content: center; }
  .pad button[hidden] { display: none; }
  .pad .up { grid-area: 1 / 2; } .pad .left { grid-area: 2 / 1; }
  .pad .right { grid-area: 2 / 3; } .pad .down { grid-area: 3 / 2; }
  /* a meal's ten layers: smaller tiles, so all ten fit on the options line */
  .tile.small { width: calc(var(--tile) * 0.56); }
  /* in the middle of the arrows, a tumble: the dazed stars */
  .pad .tumble { grid-area: 2 / 2; }
  .pad .tumble canvas { display: block; width: 18px; height: 18px; image-rendering: pixelated; }
  .pad .upleft { grid-area: 1 / 1; } .pad .upright { grid-area: 1 / 3; }
  .pad .downleft { grid-area: 3 / 1; } .pad .downright { grid-area: 3 / 3; }
  .pad .upleft .arrow, .pad .upright .arrow, .pad .downleft .arrow, .pad .downright .arrow {
    border-width: 5px 0 5px 11px; border-left-color: currentColor;
  }
  .pad .upright .arrow { transform: rotate(-45deg); } .pad .downright .arrow { transform: rotate(45deg); }
  .pad .downleft .arrow { transform: rotate(135deg); } .pad .upleft .arrow { transform: rotate(-135deg); }
  .pad .arrow { width: 0; height: 0; border: 7px solid transparent; }
  .pad .up .arrow { border-bottom-color: currentColor; border-top: 0; }
  .pad .down .arrow { border-top-color: currentColor; border-bottom: 0; }
  .pad .left .arrow { border-right-color: currentColor; border-left: 0; }
  .pad .right .arrow { border-left-color: currentColor; border-right: 0; }
  /* A GIF from the Save list plays here first, looping, over the character:
     the very file that Save GIF downloads, at the window's own scale. */
  .gif-preview {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 10px; background: var(--window);
  }
  .gif-preview[hidden] { display: none; }
  .gif-preview img { display: block; image-rendering: pixelated; }
  .gif-preview .title { margin: 0; text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000; }
  .gif-preview .buttons { display: flex; gap: 10px; }
  .status { z-index: 4; }

  .name-btn {
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
    padding: 6px 18px 8px;
    font-family: var(--display);
    font-size: 26px;
    line-height: 1.1;
    min-width: 7em;
    max-width: 100%;
  }
  .name-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name-btn .again { font-family: system-ui, sans-serif; font-size: 1.1rem; font-weight: 700; opacity: 0.6; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  /* Save opens a list, set in the rock like the tiles: the picture, then
     each animation the character has, as a GIF. */
  .save { position: relative; }
  .caret {
    display: inline-block; margin-left: 9px; vertical-align: 0.15em;
    border: 6px solid transparent; border-top-color: currentColor; border-bottom: 0;
  }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 20;
    display: flex; flex-direction: column; gap: 6px; padding: 10px; width: max-content;
  }
  .menu[hidden] { display: none; }
  .menu .item { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; text-align: left; }
  .menu .fmt { font-size: 0.8em; opacity: 0.6; }
  .toolbar .group { display: flex; align-items: center; gap: 10px; }
  .ctl {
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    line-height: 0;
  }
  .ctl canvas { display: block; image-rendering: pixelated; }
  #btn-random canvas { width: 108px; height: 78px; }
  .plate { padding: 8px 16px 10px; font-size: 15px; min-width: 6em; white-space: nowrap; }

  /* ---- the feature box: tabs, and the open one's tiles, in the builder's rock ---- */

  /* One feature at a time. All the rows at once - 42 tiles - had to shrink
     to fit a phone, with the character squeezed to a sliver above them and
     every colour and lock a 10-pixel plaque. With tabs, the open feature's
     tiles are shown bigger and its colours and lock are full-size plaques
     with words on, and on a phone the character has the room back. On a
     desktop the box is as wide as a line of tiles at 2x needs, and the
     window has the rest.
     --tile is set by layoutTiles(); the two gaps are read by it too. */
  .box {
    --tile: 80px; --set-gap: 6px; --none-gap: 14px;
    padding: 14px; width: 100%; max-width: 560px; justify-self: center;
    display: flex; flex-direction: column; gap: 14px;
  }
  /* seven tabs, each as wide as its word needs and the rest shared out */
  .tabs { display: flex; gap: 4px; }
  .tabs > .tab { flex: 1 1 auto; }
  .tab {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    padding: 8px 2px 10px; font-size: 15px; min-width: 0; white-space: nowrap;
  }
  .tab canvas { flex: none; width: 12px; height: 13px; image-rendering: pixelated; }
  .tab canvas[hidden] { display: none; }
  /* Every panel sits in the same grid cell, the closed ones invisible
     rather than gone, so the box is always as tall as the tallest - the
     features' two lines of tiles - and nothing moves when the tab changes:
     on a phone the character's height comes from what the box leaves. */
  .panels { display: grid; }
  .feature { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 14px; }
  .feature:not(.open) { visibility: hidden; }
  /* A feature: the Zoombini's five over the Fleen's five, whichever body is
     picked, so a tile is always where it was; none beside both. The body's
     two tiles make one line, in the middle; the hats are Pizza Pass's five
     over the ones from along the way. */
  .tiles { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: var(--none-gap); }
  .sets { display: flex; flex-direction: column; gap: var(--set-gap); }
  .feature.body .sets { flex-direction: row; gap: var(--none-gap); }
  .set { display: flex; gap: var(--set-gap); }
  /* the hats' pages, all in one place so turning one never resizes the box */
  .pages { display: grid; }
  .pages > .hat-page { grid-area: 1 / 1; }
  .pages > .hat-page:not(.shown) { visibility: hidden; }
  .pager { display: flex; align-items: center; gap: 6px; }
  .pager .ctrl { padding-left: 12px; padding-right: 12px; }
  .pager .count { min-width: 4.5em; text-align: center; }
  .pager .ctrl { min-width: 52px; justify-content: center; }
  /* the pages' dots: the one shown filled */
  .dots { display: flex; justify-content: center; gap: 10px; }
  .dot { width: 14px; height: 14px; padding: 0; border: 2px solid #000; background: var(--stone-lo); cursor: pointer; }
  .dot[aria-current="true"] { background: var(--tan); }
  .pages { touch-action: pan-y; }
  .pager .arrow { width: 0; height: 0; border: 10px solid transparent; }
  .pager .arrow.left { border-right-color: currentColor; border-left: 0; }
  .pager .arrow.right { border-left-color: currentColor; border-right: 0; }
  /* a hat's options: a meal's toppings, or the game's other colours for it */
  /* the hats' panel: its pages, then a line of a hat's options (a meal's
     toppings, the game's colourings of it), as tall as a line of tiles
     whether or not the hat has any, so picking one never resizes the box */
  .tiles.stacked { flex-direction: column; gap: var(--set-gap); }
  .set.options { justify-content: center; min-height: calc(var(--tile) * 43 / 40); }
  .tile {
    flex: none;
    width: var(--tile);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }
  #btn-mix { display: block; margin: 10px auto 2px; }
  .tile:disabled { filter: grayscale(1); opacity: 0.4; cursor: default; }
  .tile canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 40 / 43;
    image-rendering: pixelated;
  }
  /* Under the tiles, the open part's plaques: a colour for each of its own
     colours - two for a ponytail or a propeller - and the lock that keeps
     it when the dice rolls. The icons are at 2x, a whole number of the
     tiles' pixels, like everything else here. */
  .controls { display: flex; gap: 8px; min-height: 44px; }
  .controls .spacer { flex: 1; }
  .ctrl {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px 8px; position: relative; font-size: 15px; white-space: nowrap;
  }
  .ctrl[hidden] { display: none; }
  .ctrl canvas { display: block; flex: none; image-rendering: pixelated; }
  /* a colour: the plaque is the button, the browser's own colour picker
     under it, invisible, so a tap anywhere on it opens the picker */
  .ctrl input[type="color"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; padding: 0; cursor: pointer;
  }
  .ctrl:has(input:focus-visible) { outline: 3px solid var(--tan); outline-offset: 2px; }


  /* A desktop: the character in its window on the left, as tall as the
     screen allows; the buttons, then the tiles, down the right. */
  @media (min-width: 901px) {
    main {
      grid-template-columns: minmax(0, 1fr) minmax(0, 560px);
      grid-template-areas: "window tools" "window box" "window .";
      grid-template-rows: auto auto 1fr;
      gap: 16px 22px;
    }
    .stage { display: contents; }
    .window { grid-area: window; }
    .box { grid-area: box; }
    .toolbar { grid-area: tools; }
  }

  /* A phone: everything on one screen - the window takes whatever height
     the header, buttons and the open tab leave (see layoutPreview). The
     game's buttons at 1x. */
  @media (max-width: 900px) {
    .pad { grid-template-columns: repeat(3, 28px); grid-template-rows: repeat(3, 28px); }
    :root { --ui: 'WordLa 12', serif; }
    body { font-size: 13px; }
    .page { padding: 8px 10px 24px; }
    header { margin-bottom: 8px; }
    /* the title at WordLa 24's own height, so it keeps to one line */
    h1 { font-size: 26px; white-space: nowrap;
         text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000,
                      1px 1px #000, -1px 1px #000, 1px -1px #000, -1px -1px #000, 2px 3px 0 #000; }
    main { gap: 8px; }
    .stage { gap: 8px; }
    .window { padding: 5px; gap: 5px; }
    .preview { padding: 4px; }
    .corner { top: 4px; right: 4px; width: 36px; height: 36px; }
    .corner.left { right: auto; left: 4px; padding: 0 8px 2px 6px; gap: 5px; font-size: 13px; }
    .pager .count { min-width: 0; font-size: 13px; }
    .controls .keep span { display: none; }
    .pager .ctrl { padding-left: 8px; padding-right: 8px; min-width: 40px; }
    .status { bottom: 6px; font-size: 13px; }
    .name-btn { font-size: 26px; padding: 3px 12px 5px; min-width: 6em; }
    .toolbar { gap: 8px; }
    .toolbar .group { gap: 6px; }
    #btn-random canvas { width: 54px; height: 39px; }
    .plate { min-width: 0; font-size: 13px; padding: 6px 10px 8px; }
    .caret { margin-left: 6px; border-width: 5px; }
    .box { --set-gap: 3px; --none-gap: 8px; padding: 6px; gap: 6px; }
    .tabs { gap: 3px; }
    .tab { font-size: 13px; padding: 7px 1px 9px; gap: 1px; }
    .tab canvas { width: 9px; height: 10px; }
    .feature { gap: 6px; }
    .controls { gap: 4px; min-height: 0; }
    .ctrl { font-size: 13px; padding: 4px 10px 6px; gap: 6px; }
  }

  footer { margin-top: 30px; font-size: 13px; opacity: 0.75; }
  footer a { color: var(--zoombini); }
  /* WordLa is in pixels (fonts.js, Sam: "a bit pixelated like the game"):
     every size here is a size's own height or twice it, so its pixels land
     on whole device pixels. It has one weight: shown as it is, never made bold */
  html { font-synthesis: none; }

<script src="sprites.js"></script>
<script>
'use strict';

const S = window.ZOOMBINI_SPRITES;
const FEATURES = S.features;                 // ['hair', 'eyes', 'nose', 'feet']
// A hat's family (a meal with fewer toppings, a hat in its other colours)
// is reached from its first (`family`); hatRoot is that first, HAT_ROOTS the
// firsts.
const hatRoot = k => k === undefined || S.hats[k].family === undefined ? k : S.hats[k].family;
const HAT_ROOTS = [...S.hats.keys()].filter(k => S.hats[k].family === undefined);
// a hat's family: its first, then the hats that are it otherwise - or as
// its first's `forms` orders them (the mud's), the rest after
const familyOf = k => {
  const all = [k].concat([...S.hats.keys()].filter(j => S.hats[j].family === k)), order = S.hats[k]?.forms;
  return order ? order.concat(all.filter(j => !order.includes(j))) : all;
};
const COMPACT_HATS = 11;                     // the hats before 1 October's (see boxes)
// the hats the window's boxes are worked out for: the firsts, and the first
// eleven (some since in a family: the meals, the mudball)
const BOX_HATS = [...new Set([...S.hats.keys()].filter(k => k < COMPACT_HATS).concat(HAT_ROOTS))].sort((a, b) => a - b);
const LABEL = { zoombini: 'Zoombini', fleen: 'Fleen' };
const OTHER = { zoombini: 'fleen', fleen: 'zoombini' };
const PAD = 3;                               // source pixels around the figure
const TICK_MS = 100;                         // one script section per tick
// A Fleen running away (its walk's second direction) goes at twice that, as
// Sam asked (30 September 2026). The timer runs at half ticks, and every
// other clip takes every other one.
const isFast = (kind, walk, d) => kind === 'fleen' && walk.dirs.length > 1 && d === 1;
// which way a walk's frames face: one for a set of walks, or one a direction
const facesAt = (faces, d) => Array.isArray(faces) ? faces[d] : faces;
const walkClip = (kind, walk, d) => ({ ticks: walk.dirs[d], walk: true, faces: facesAt(walk.faces, d), fast: isFast(kind, walk, d) });
let half = 0;
function halfTick() {
  if ((clip && clip.fast) || ++half % 2 === 0) tick();
}
const REST = { eyes: 0, dx: 0, dy: 0, facing: 0, feet: -1, walk: null, faces: null, hat: null, n: 0, tumble: null };
// A walk tick: [dx, dy, feet, body, nose, eyes, hair, liftNear, liftFar,
// device, away] - each part's pose (-1 rest), how far each borrowed foot
// is lifted, the frame of a borrowed device (-1 none), and 1 when the head is
// turned away from the viewer. See walk_clip() in the exporter.
const WALK_PARTS = ['feet', 'body', 'nose', 'eyes', 'hair'];

// ---- names -------------------------------------------------------------

// The game's name generator (ZOOMBINI.EXE seg26:1f26), with its tables
// (far-data segments 89-92). Vowels and consonants alternate up to a length
// of 4-8, starting with a vowel 39% of the time. A vowel is drawn from
// VOWEL_UNITS, which weights the single letters and adds pairs. A consonant
// is a single letter (from the weighted CONSONANTS) only as the first or
// second letter, and then two times in three; otherwise, and always later
// in the name, it is a cluster. A cluster that reaches the length has its
// second letter redrawn from VOWELS, so every name ends in a vowel, and a
// doubled start ("ee", "oo", "nn") is cut to one letter. The game's random
// numbers are inclusive at both ends, as between() is.
const VOWEL_UNITS = ['a', 'a', 'a', 'e', 'e', 'e', 'e', 'i', 'i', 'i', 'o', 'o', 'o', 'u', 'u', 'y',
  'ee', 'oo', 'yo', 'ya', 'ye', 'ei', 'ie', 'ai', 'ia', 'au', 'ua', 'uo', 'ou', 'ae', 'ea'];
const CONSONANTS = 'bbccdddfghjkkllmmnnprrssssttvwxz';
const VOWELS = 'aeiouy';
const CLUSTERS = ['bl', 'br', 'ch', 'cl', 'cr', 'dr', 'dw', 'fl', 'fr', 'gh', 'gl', 'gr', 'kl', 'kn',
  'kr', 'kw', 'ld', 'mp', 'nd', 'nh', 'nn', 'ph', 'pl', 'pr', 'qu', 'qu', 'rh', 'rn', 'sc', 'sl',
  'sm', 'sn', 'sp', 'sr', 'st', 'sw', 'th', 'tr', 'tw', 'wr'];
const between = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const drawFrom = list => list[between(1, list.length) - 1];
function makeName() {
  const length = between(4, 8);
  let vowel = between(1, 100) < 40;
  let name = '';
  while (name.length < length) {
    let cluster = false;
    if (vowel) name += drawFrom(VOWEL_UNITS);
    else if (name.length > 1 || between(1, 100) <= 33) { name += drawFrom(CLUSTERS); cluster = true; }
    else name += drawFrom(CONSONANTS);
    vowel = !vowel;
    if (cluster && name.length >= length) name = name.slice(0, -1) + drawFrom(VOWELS);
    if (name.length === 2 && name[0] === name[1]) name = name[0];
  }
  return name;
}
const shownName = name => name[0].toUpperCase() + name.slice(1);

// ---- state -------------------------------------------------------------

// A pick is {v, borrowed}: variant v of this character's part, or of the
// other character's if borrowed - or, bar the body, none of either. A build
// can also carry a skin colour (`skin`) and, for each part, a colour for each
// of its own colours (`colours[feature][k]`, as #rrggbb, k as in the part's
// `groups`), picked with the browser's colour picker; without them its own.
// The dice never picks none, keeps what is locked (`locks`) with its colours,
// gives the rest their own colours back, and borrows only with Mix Traits! on. It
// leaves the hat alone. Mix Traits! starts off (Sam, 4 October 2026: "have it off
// by default"): a Zoombini through and through, or a Fleen - the other's
// parts greyed out, and a new body turning each part into its own
// equivalent (see setBody). A link with a mixed build turns it on.
const NONE = { v: 0, borrowed: false, none: true };
let mix = false;
const mixed = pick => pick && pick.borrowed && !elsewhere(pick);
const randomBuild = () => Object.fromEntries(FEATURES.map(f =>
  [f, { v: Math.floor(Math.random() * 5), borrowed: mix && Math.random() < 0.5 }]));
// The extras start kept (on none, so the dice adds none), and roll too once
// their padlock is opened (Sam, 1 October 2026).
const locks = { body: false, hair: false, eyes: false, nose: false, feet: false, extras: true };
const plainBuild = () => Object.fromEntries(FEATURES.map(f => [f, { v: Math.floor(Math.random() * 5), borrowed: false }]));

const state = {
  kind: 'zoombini',
  build: { zoombini: plainBuild(), fleen: plainBuild() },
  name: { zoombini: makeName(), fleen: makeName() },
};

// The build lives in the address, so a link shows the same character:
// #zoombini-2031-oplie is hair 2, eyes 0, nose 3, feet 1, named Oplie, and a
// letter marks a feature borrowed from the other character - #zoombini-2d31
// has the other's eyes number 3 (a = 0) - or x none. After the name, -s and
// a colour is its skin, -h and a number its hat (see HATS below), and -c, a
// part's letter (COLOUR_LETTER), its colour's number and a colour is one of a
// part's colours: -ch1ff0080 is the hair's second colour. -n and a colour, from
// when only the nose had one, is the nose's first. Links from before names
// keep working, with a new name.
const COLOUR_LETTER = { hair: 'h', eyes: 'e', nose: 'n', feet: 'f', hat: 't' };
// a borrowed part's letter: the other character's a-e, then the parts from
// elsewhere (f on; x is none)
const LETTERS = 'abcdefghijklmnopqrstuvw';
const elsewhere = pick => pick.borrowed && pick.v >= 5;
const codeOf = build => FEATURES.map(f =>
  build[f].none ? 'x' : build[f].borrowed ? LETTERS[build[f].v] : String(build[f].v)).join('');
// the last thing worn as another of its family (o: which; m: a meal's layers)
function wornOption(worn, o, m) {
  const k = worn.pop(), root = hatRoot(k);
  worn.push(m ? mealHat(mealLayers(+m), root) : familyOf(root)[+o] ?? k);
}
function readHash() {
  const m = /^#(zoombini|fleen)(?:-([0-4a-x]{4})x?)?(?:-([a-z]{1,12}))?((?:-[0-9a-z]+)*)$/.exec(location.hash);
  if (!m) return;
  state.kind = m[1];
  if (m[3]) state.name[m[1]] = m[3];
  if (!m[2]) return;
  FEATURES.forEach((f, i) => {
    const c = m[2][i], letter = c >= 'a';
    state.build[m[1]][f] = c === 'x' ? { ...NONE } : { v: letter ? c.charCodeAt(0) - 97 : +c, borrowed: letter };
  });
  if (FEATURES.some(f => mixed(state.build[m[1]][f]))) mix = true;
  const build = state.build[m[1]];
  Object.assign(build, { skin: undefined, colours: {}, hat: undefined, extras: [] });
  const worn = build.extras;
  let hatColour = null;
  for (const x of m[4].split('-').slice(1)) {
    let c;
    if ((c = /^s([0-9a-f]{6})$/.exec(x))) build.skin = '#' + c[1];
    // what is worn, in order: -a and its number, then o and which of its
    // family, or m and a meal's layers (and, from older links, -h, -o, -m)
    else if ((c = /^[ah]([0-9]{1,3})(?:o([0-9]{1,2})|m([0-9]{1,4}))?$/.exec(x)) && S.hats[+c[1]]) {
      worn.push(+c[1]);
      if (c[2] || c[3]) wornOption(worn, c[2], c[3]);
    }
    else if ((c = /^([om])([0-9]{1,4})$/.exec(x)) && worn.length) wornOption(worn, c[1] === 'o' ? c[2] : null, c[1] === 'm' ? c[2] : null);
    else if ((c = /^q([0-9]{1,3})_([01])([0-9a-f]{6})$/.exec(x))) (build.colours['hat:' + c[1]] = build.colours['hat:' + c[1]] || [])[+c[2]] = '#' + c[3];
    else if ((c = /^n([0-9a-f]{6})$/.exec(x))) (build.colours.nose = build.colours.nose || [])[0] = '#' + c[1];
    else if ((c = /^c([a-z])([01])([0-9a-f]{6})$/.exec(x))) {
      const f = Object.keys(COLOUR_LETTER).find(k => COLOUR_LETTER[k] === c[1]);
      if (f === 'hat') hatColour = [+c[2], '#' + c[3]];
      else if (f) (build.colours[f] = build.colours[f] || [])[+c[2]] = '#' + c[3];

}
function writeHash() {
  const build = state.build[state.kind];
  const hash = '#' + state.kind + '-' + codeOf(build) + '-' + state.name[state.kind]
    + (build.skin ? '-s' + build.skin.slice(1) : '')
    // a hat by its first's number, and which of its family (-o) if not the first:
    // the family's numbers move as hats are added, the firsts' do not
    // what is worn, in order: a meal by its layers, another of a family by which
    + (build.extras || []).map(k => {
      const root = hatRoot(k);
      return '-a' + root + (k === root ? '' : S.hats[k].option.layers ? 'm' + mealBits(S.hats[k].option.layers)
        : 'o' + familyOf(root).indexOf(k));
    }).join('')
    + Object.entries(build.colours || {}).filter(([f]) => f.startsWith('hat:'))
      .map(([f, picks]) => picks.map((hex, g) => hex ? '-q' + f.slice(4) + '_' + g + hex.slice(1) : '').join('')).join('')
    + Object.entries(COLOUR_LETTER).filter(([f]) => f !== 'hat').map(([f, l]) => ((build.colours || {})[f] || [])
      .map((hex, k) => hex ? '-c' + l + k + hex.slice(1) : '').join('')).join('');
  if (location.hash !== hash) history.replaceState(null, '', hash);
}

// ---- drawing -----------------------------------------------------------

const sheet = new Image();
const rect = i => S.rects[i];

// With `axis` set, the sprite is drawn mirrored about that vertical line.
// `src`, if given, is a recoloured copy of the sprite (see recoloured).
function drawSprite(ctx, index, x, y, scale = 1, axis = null, src = null) {
  let [sx, sy, w, h] = rect(index);
  const img = src || sheet;
  if (src) sx = sy = 0;
  if (axis === null) {
    ctx.drawImage(img, sx, sy, w, h, x, y, w * scale, h * scale);
    return;
  }
  ctx.save();
  ctx.translate(2 * axis - x, y);
  ctx.scale(-1, 1);
  ctx.drawImage(img, sx, sy, w, h, 0, 0, w * scale, h * scale);
  ctx.restore();
}

// ---- colours ------------------------------------------------------------

// Skin is the host's own shades wherever they are - the body, and the skin
// every part carries (eyelids, legs, the head under hair), which the
// exporter has already recoloured to the host's - so it is found by colour:
// the Zoombini's blues (palette 15-20) and the Fleen's limes (85-89), each
// a step on one ladder of seven, darkest to highlight.
const SKIN_STEPS = {
  zoombini: { '112135': 0, '2e4f7f': 1, '4677bf': 2, '5e9eff': 3, '7daeff': 4, '9ebfff': 5 },
  fleen: { '697905': 1, '83a407': 2, 'afd609': 4, 'c9ee31': 5, 'ebff9e': 6 },

const NATURAL_SKIN = { zoombini: '#9ebfff', fleen: '#c9ee31' };
// The Zoombini's blues' lightness, step by step: a picked colour is step 5,
// the others its own hue and saturation at those lightnesses relative to it.
const STEP_LIGHT = [0.14, 0.34, 0.51, 0.68, 0.74, 0.81, 0.88];

const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function rgbToHsl([r, g, b]) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
  if (max === min) return [0, 0, l];
  const d = max - min, s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h / 6, s, l];

function hslToRgb([h, s, l]) {
  if (!s) return [l, l, l].map(v => Math.round(v * 255));
  const q = l < 0.5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
  const f = t => {
    t = (t + 1) % 1;
    return t < 1 / 6 ? p + (q - p) * 6 * t : t < 1 / 2 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p;

}
const clamp01 = v => Math.max(0, Math.min(1, v));
function skinLadder(hex) {
  const [h, s, l] = rgbToHsl(hexToRgb(hex));
  return STEP_LIGHT.map((sl, k) => hslToRgb([h, s, clamp01(k < 6 ? l * sl / STEP_LIGHT[5] : l + (1 - l) * 0.35)]));
}

// A sprite recoloured: its host's skin to the `skin` ladder; and each of its
// part's colours (`groups`, from the exporter) that has a pick, to the picked
// hue and saturation, every shade's lightness moved by as much as the
// group's middle shade (`ref`) moves to the picked one, keeping the shading.
// A picked colour wins over the skin's (sleepy eyes' lids are skin, and have
// a picker). The outline and anything else outside the groups stay as they are, and a
// hat's pixels are never skin (the cream has the Zoombini's lightest blue).
// With nothing picked, or only a part's own colours, the sprite is the
// sheet's own, untouched.
const recolourCache = new Map();
function recoloured(index, kind, skin, groups = [], picks = [], part = null) {
  picks = picks || [];
  if (skin && skin.toLowerCase() === NATURAL_SKIN[kind]) skin = undefined;
  const active = groups.map((g, k) => picks[k] && picks[k].toLowerCase() !== '#' + g.ref ? [g, picks[k]] : null)
    .filter(Boolean);
  if (!skin && !active.length) return null;
  const worn = !!part && part.startsWith('hat');
  if (worn || part === 'effect') skin = undefined;
  if (!skin && !active.length) return null;
  const key = [index, kind, skin, worn, active.map(([g, p]) => g.ref + p).join('/')].join();
  if (recolourCache.has(key)) return recolourCache.get(key);
  const [sx, sy, w, h] = rect(index);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(sheet, sx, sy, w, h, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  const ladder = skin && skinLadder(skin), steps = worn ? {} : SKIN_STEPS[kind];
  const hexAt = i => ((d[i] << 16) | (d[i + 1] << 8) | d[i + 2]).toString(16).padStart(6, '0');
  const byHex = new Map();
  for (const [g, pick] of active) {
    const to = rgbToHsl(hexToRgb(pick)), ref = rgbToHsl(hexToRgb('#' + g.ref))[2];
    for (const hex of g.colours) byHex.set(hex, [to, ref]);
  }
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const hex = hexAt(i), step = steps[hex];
    let rgb = null;
    // a picked colour first: sleepy eyes' lids are skin, and can be picked
    if (byHex.has(hex)) {
      const [to, ref] = byHex.get(hex), [, , l] = rgbToHsl([d[i], d[i + 1], d[i + 2]]);
      rgb = hslToRgb([to[0], to[1], clamp01(to[2] + l - ref)]);
    } else if (step !== undefined) {
      if (ladder) rgb = ladder[step];
    }
    if (rgb) [d[i], d[i + 1], d[i + 2]] = rgb;
  }
  ctx.putImageData(img, 0, 0);
  recolourCache.set(key, c);
  return c;
}

// The eyes as the idle wants them: 0 rest, 1 blink, 2 + k glance k. Each
// eye variant carries its own blink and glances; a character with fewer
// glances than asked for wraps round them.
function eyeFrame(entry, eyes) {
  if (!eyes || !entry.frames) return entry;
  if (eyes === 1) return entry.frames.blink;
  const g = entry.frames.glance;
  return g[(eyes - 2) % g.length];
}

// The sprites to paint, in order. A borrowed part comes ready-fitted from the
// exporter (recoloured, mirrored, re-anchored) and takes its feature's place.
// Borrowed feet are placed around the body instead: a Zoombini in Fleen feet
// has its far foot behind the egg (`back`) and its near foot in front, so it
// stands between its treads rather than on them; a Fleen in Zoombini shoes
// gets straight legs down into a shoe each, and a Fleen on a Zoombini spring,
// wheels or propeller rests on it - both `behind` the stalk (running away in
// shoes, its own run frames are in front, as its own feet are).
//
// `pose` is the idle's current tick: the head's facing (0 for the rest one)
// swaps in a part's turned frame - a borrowed part, having none, its frame
// moved to where the host's own part sits at that angle - and `feet` >= 0
// swaps in a special frame, keeping the feet's place around the body.
//
// Walking (`pose.walk`) picks each part's walk pose; a borrowed part follows
// the host's own part it sits on - hair the body. Borrowed feet do not use
// the other character's walk frames: a Zoombini's near and far borrowed foot
// lift in turn, a Fleen's legs-and-shoes lift in turn, and a device plays its
// own walk frames.
const lifted = (v, up) => up ? Object.assign({}, v, { oy: -up }) : v;
const FLEEN_BOB = [0, 2, 3, 1];               // px down, a tick each (see variantsFor)
function variantsFor(kind, build, pose = REST, seat = null) {
  if (pose.tumble) return tumbleVariants(kind, build, pose);
  const ch = S.characters[kind];
  const w = pose.walk;
  const at = n => w[2 + WALK_PARTS.indexOf(n)];
  const out = ch.parts.map(part => {

    // the sundae's glass and its three
    const has = new Set(now.option.layers), whole = S.hats[WHOLE_MEAL];
    for (const [layer, name] of Object.entries(first.options.toppings)) {
      add('t' + layer, titled(name.replace(/^a /, '')), whole.tiles[layer], has.has(+layer), () => {
        const want = new Set(has), on = !want.has(+layer);
        if (on) want.add(+layer); else want.delete(+layer);
        if (![...want].some(n => !first.options.fixed.includes(n)) && !first.options.fixed.length) return;
        // a topping goes on with its own sound, as the game's machine adds it
        put(mealHat(want, root), on ? first.options.sounds[layer] || 'put' : 'off');
      });
    }
  } else if (first.options === 'colours') {
    for (const j of family) {
      add('c' + j, titled(S.hats[j].option.colours), S.hats[j].tile, j === k,
          () => put(j, S.hats[j].variantPick || 'put'));
    }
  } else if (first.options === 'forms') {
    const forms = [...new Set(family.map(j => S.hats[j].option.form))];
    for (const form of forms) {
      const members = family.filter(j => S.hats[j].option.form === form);
      const on = now.option.form === form;
      add('f' + form, titled(form), S.hats[on ? k : members[0]].tile, on, () => {
        if (!on) { put(members[0], 'put'); return; }
        const next = members[(members.indexOf(k) + 1) % members.length];
        if (next !== k) put(next, S.hats[next].variantPick || 'put');
      });
    }
  }
}

// An easter egg: Captain Cajun's big frog feet, which have no tile (Sam:
// "some kind of easter egg to save space on rows"). Tapping no feet three
// times quickly on a Zoombini puts them on, and the Captain speaks.
let eggTaps = [];
function eggTap() {
  const now = Date.now();
  eggTaps = eggTaps.filter(t => now - t < 900).concat([now]);
  if (eggTaps.length < 3 || state.kind !== 'zoombini') return;
  eggTaps = [];
  const v = S.characters.zoombini.borrowed.feet.findIndex(e => e.egg);
  if (v < 0) return;
  state.build.zoombini.feet = { v, borrowed: true };
  resetColours('feet');
  sounds.play(S.sounds.egg);
  endClip();
  update();
}

function buildTiles() {
  rowsEl.textContent = '';
  tabsEl.textContent = '';
  tiles = {};
  for (const feat of ROWS) {
    const tab = tabs[feat] = el('button', 'stone tab');
    tab.id = 'tab-' + feat;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-controls', 'panel-' + feat);
    const word = el('span');
    word.textContent = titled(feat);
    tab.kept = el('canvas');
    tab.kept.title = 'Kept when the dice rolls';
    paintIcon(tab.kept, 'keep', false);
    tab.append(word, tab.kept);
    tab.addEventListener('click', () => openTab(feat));
    tabsEl.appendChild(tab);

    const panel = el('div', 'feature' + (feat === 'body' ? ' body' : ''));
    panel.id = 'panel-' + feat;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', tab.id);
    const t = tiles[feat] = [];
    t.panel = panel;
    const worn = feat === 'extras';
    const tilesEl = el('div', 'tiles'), sets = el('div', worn ? 'pages' : 'sets');
    if (worn) {
      // the hats (or extras) in the exporter's order (hatOrder; v is the
      // hat's number), HAT_ROW to a line, the first ended by none -
      // HAT_LINES lines a page, turned with the arrows in the panel's foot
      const lines = [];
      S.hatOrder.forEach(v => {
        const line = lines[lines.length - 1];
        if (!line || line.length >= (lines.length === 1 ? HAT_ROW - 1 : HAT_ROW)) lines.push([v]);
        else line.push(v);
      });
      t.pages = [];
      t.page = 0;
      lines.forEach((line, n) => {
        if (n % HAT_LINES === 0) {
          const page = el('div', 'sets hat-page');
          t.pages.push(page);
          sets.appendChild(page);
        }
        const set = el('div', 'set');
        t.pages[t.pages.length - 1].appendChild(set);
        for (const v of line) {
          const b = tileButton(titled(S.hats[v].name) + ' (from ' + S.hats[v].place + ')',
                               () => toggleExtra(v));
          set.appendChild(b);
          t.push({ b, v, page: t.pages.length - 1 });
        }
      });
    } else {
      for (const kind of KINDS) {
        const set = el('div', 'set');
        // the character's own five (its buttons go on with the parts from elsewhere)
        const order = kind === 'fleen' && FLEEN_ORDER[feat] || S.characters[kind].buttons[feat].slice(0, 5).map((_, v) => v);
        order.forEach(v => {
          const name = feat === 'body' ? LABEL[kind] : S.characters[kind].names[feat][v] + ' (' + LABEL[kind] + ')';
          const b = tileButton(name, () => {
            sounds.builder('put');
            // a tile is that part as it comes, its own colours too
            if (feat === 'body') setBody(kind);
            else state.build[state.kind][feat] = { v, borrowed: kind !== state.kind };
            resetColours(feat);
            endClip();
            update();
          });
          set.appendChild(b);
          t.push({ b, v, kind });
        });
        sets.appendChild(set);
      }
      // then the parts from elsewhere (only feet have any), on whichever
      // body, in the column with none - but not an easter egg, which has no
      // tile (see eggTap)
      const names = S.characters.zoombini.names[feat] || [];
      if (names.length > 5) {
        const set = t.side = el('div', 'sets side');
        for (let v = 5; v < names.length; v++) {
          if (S.characters.zoombini.borrowed[feat][v].egg) continue;
          const b = tileButton(names[v], () => {
            sounds.builder('put');
            state.build[state.kind][feat] = { v, borrowed: true };
            resetColours(feat);
            endClip();
            update();
          });
          set.appendChild(b);
          t.push({ b, v, kind: 'elsewhere' });
        }
      }
    }
    tilesEl.appendChild(sets);
    if (worn && t.pages.length > 1) {
      // a dot a page under them, so there plainly are more (Sam), each one
      // a way to its page; and a swipe across the tiles turns the page
      t.dots = el('div', 'dots');
      t.pages.forEach((_, n) => {
        const d = el('button', 'dot');
        d.title = 'Page ' + (n + 1) + ' of ' + t.pages.length;
        d.setAttribute('aria-label', d.title);
        d.addEventListener('click', () => { t.page = n; sounds.builder('put'); paintTiles(); });
        t.dots.appendChild(d);
      });
      tilesEl.appendChild(t.dots);
      let x0 = null;
      sets.addEventListener('pointerdown', e => { x0 = e.clientX; });
      sets.addEventListener('pointerup', e => {
        const dx = x0 === null ? 0 : e.clientX - x0;
        x0 = null;
        if (Math.abs(dx) < 40) return;
        t.page = (t.page + (dx < 0 ? 1 : -1) + t.pages.length) % t.pages.length;
        paintTiles();
      });
    }
    if (worn) {
      // under the pages, what the one picked can change: a meal's layers,
      // a hat's shapes, the colours the game also has it in (paintHatOptions)
      t.options = el('div', 'set options');
      tilesEl.classList.add('stacked');
      tilesEl.appendChild(t.options);
    }
    // none, as a tile of its own (the body has none)
    if (feat !== 'body') t.none = tileButton(feat === 'extras' ? 'No extras' : 'No ' + feat, () => {
      sounds.builder('off');
      if (feat === 'extras') state.build[state.kind].extras = [];
      else state.build[state.kind][feat] = { ...NONE };
      resetColours(feat);
      endClip();
      update();
    });
    if (worn) (t.pages[0] ? t.pages[0].firstChild : sets).appendChild(t.none);
    else if (t.side) { t.side.prepend(t.none); tilesEl.appendChild(t.side); }
    else if (t.none) tilesEl.appendChild(t.none);
    if (feat === 'feet') t.none.addEventListener('click', eggTap);
    const controls = el('div', 'controls');
    t.colours = [0, 1].map(k => {
      const c = colourPlaque(value => { setColour(colourKey(feat), k, value); update(); });
      controls.appendChild(c);
      return c;
    });
    controls.appendChild(el('div', 'spacer'));
    if (worn && t.pages.length > 1) {
      t.pager = el('div', 'pager');
      const turn = d => () => { t.page = (t.page + d + t.pages.length) % t.pages.length; paintTiles(); };
      const back = el('button', 'stone ctrl'), on = el('button', 'stone ctrl'), count = el('span', 'count');
      back.innerHTML = '<span class="arrow left"></span>';
      on.innerHTML = '<span class="arrow right"></span>';
      back.title = 'The page before'; on.title = 'The next page';
      back.setAttribute('aria-label', back.title); on.setAttribute('aria-label', on.title);
      back.addEventListener('click', turn(-1));
      on.addEventListener('click', turn(1));
      t.pager.append(back, count, on);
      controls.appendChild(t.pager);
    }
    {
      t.lock = el('button', 'stone ctrl keep');
      t.lock.title = 'Keep this ' + feat + ' when the dice rolls';
      const keep = el('span');
      keep.textContent = 'Keep';
      t.lock.append(el('canvas'), keep);
      t.lock.addEventListener('click', () => {
        locks[feat] = !locks[feat];
        paintTiles();
      });
      controls.appendChild(t.lock);
    }
    panel.prepend(tilesEl);
    panel.append(controls);
    rowsEl.appendChild(panel);
  }
  openTab(openRow);
}

// The closed panels are only invisible (see .panels), which also takes
// their tiles out of the tab order; the tabs themselves are one stop, moved
// along with the arrow keys, as tabs are.
function openTab(feat, focus = false) {
  openRow = feat;
  const b = state.build[state.kind], t = tiles[feat];
  const worn = feat === 'extras' ? (b.extras || []).map(hatRoot) : [];
  const x = t && t.pages && t.find(x => worn.includes(x.v));
  if (x) { t.page = x.page; paintTiles(); }
  for (const f of ROWS) {
    const on = f === feat;
    tabs[f].setAttribute('aria-selected', on);
    tabs[f].tabIndex = on ? 0 : -1;
    tiles[f].panel.classList.toggle('open', on);
  }
  if (focus) tabs[feat].focus();
}
tabsEl.addEventListener('keydown', e => {
  const i = ROWS.indexOf(openRow);
  const to = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: ROWS.length - 1 }[e.key];
  if (to === undefined) return;
  e.preventDefault();
  openTab(ROWS[(to + ROWS.length) % ROWS.length], true);
});

// The whole character becomes the other one's body, every feature staying
// what it was - a Fleen's hair on a Zoombini is that Fleen's own hair on a
// Fleen - and so do its colours, its hat and its name.
function setBody(kind) {
  if (kind === state.kind) return;
  const old = state.kind;
  state.build[kind] = Object.fromEntries(FEATURES.map(f => {
    const pick = state.build[old][f];
    if (elsewhere(pick)) {
      const only = S.characters[kind].borrowed[f][pick.v].only;
      return [f, only && only !== kind ? { v: 0, borrowed: false } : pick];
    }
    // unmixed, the new body's own part in that place: its equivalent
    return [f, pick.none ? pick : { v: pick.v, borrowed: mix && (pick.borrowed ? OTHER[old] : old) !== kind }];
  }));
  state.build[kind].skin = state.build[old].skin;
  // a part turned into its equivalent has that one's colours
  state.build[kind].colours = Object.fromEntries(Object.entries(state.build[old].colours || {})
    .filter(([f]) => !FEATURES.includes(f) || mix || state.build[old][f].none || elsewhere(state.build[old][f])));
  state.build[kind].hat = state.build[old].hat;
  state.build[kind].extras = state.build[old].extras;
  state.name[kind] = state.name[old];
  state.kind = kind;
  heading = START_HEADING;
}

// The extra the Extras tab's options and colours are for: the last put on
// or changed, or the last worn.
const focusOf = build => (build.extras || []).includes(build.extraFocus) ? build.extraFocus
  : (build.extras || []).slice(-1)[0];
const colourKey = feat => feat === 'extras' ? 'hat:' + focusOf(state.build[state.kind]) : feat;

function paintTiles() {
  const build = state.build[state.kind];
  for (const feat of ROWS) {
    const t = tiles[feat], pick = build[feat] || {};
    for (const x of t) {
      const on = feat === 'body' ? x.kind === state.kind
        : feat === 'extras' ? (build.extras || []).some(k => hatRoot(k) === x.v)
        : x.kind === 'elsewhere' ? elsewhere(pick) && pick.v === x.v
        : !pick.none && pick.v === x.v && (pick.borrowed ? OTHER[state.kind] : state.kind) === x.kind;
      x.b.setAttribute('aria-pressed', on);
      paintTile(x.b.firstChild, feat === 'extras' ? S.characters[state.kind].buttons.hat[x.v][on ? 1 : 0]
        : x.kind === 'elsewhere' ? S.characters[state.kind].buttons[feat][x.v][on ? 1 : 0]
        : S.characters[x.kind].buttons[feat][x.v][on ? 1 : 0]);
      // a part from elsewhere only some bodies wear (Captain Cajun's feet: a Zoombini's)
      const only = x.kind === 'elsewhere' && S.characters[state.kind].borrowed[feat][x.v].only;
      x.b.hidden = !!only && only !== state.kind;
      // unmixed, the other character's parts can't be picked
      x.b.disabled = !mix && feat !== 'body' && feat !== 'extras' && x.kind === OTHER[state.kind];
    }
    if (t.none) {
      const none = feat === 'extras' ? !(build.extras || []).length : !!pick.none;
      t.none.setAttribute('aria-pressed', none);
      paintNone(t.none.firstChild, none);
    }
    const groups = feat === 'body' ? [{ ref: NATURAL_SKIN[state.kind].slice(1) }] : groupsOf(state.kind, build, colourKey(feat));
    t.colours.forEach((c, k) => {
      c.hidden = k >= groups.length;
      if (c.hidden) return;
      const hex = colourPick(build, colourKey(feat), k) || '#' + groups[k].ref;
      const word = feat === 'body' ? 'Skin' : groups.length > 1 ? 'Colour ' + (k + 1) : 'Colour';
      const label = feat === 'body' ? 'Skin colour' : titled(feat) + ' ' + word.toLowerCase();
      c.querySelector('span').textContent = word;
      c.title = label;
      const input = c.querySelector('input');
      input.setAttribute('aria-label', label);
      input.value = hex;
      paintIcon(c.firstChild, 'colour', false, hex, 2);
    });
    if (t.pages) {
      t.pages.forEach((page, n) => page.classList.toggle('shown', n === t.page));
      if (t.pager) t.pager.querySelector('.count').textContent = 'Page ' + (t.page + 1) + ' / ' + t.pages.length;
      if (t.dots) [...t.dots.children].forEach((d, n) => d.setAttribute('aria-current', n === t.page));
      const focus = focusOf(build);
      paintHatOptions(t, build, focus, (v, sound) => swapExtra(focus, v, sound));
    }
    if (t.lock) {
      t.lock.setAttribute('aria-pressed', locks[feat]);
      paintIcon(t.lock.firstChild, locks[feat] ? 'keep' : 'roll', locks[feat], null, 2);
    }
    tabs[feat].kept.hidden = !locks[feat];
  }
}

// ---- the page's own stone -----------------------------------------------

// The rock round the tiles and the window, for the stylesheet: speckled here
// from the builder's rock colours, as its painted rock would not repeat.
function rockURL() {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#312929';
  ctx.fillRect(0, 0, 32, 32);
  let seed = 7;
  const next = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const specks = [['#211818', 0.3], ['#393131', 0.15], ['#423942', 0.1], ['#311821', 0.1]];
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 32; x++) {
      let r = next();
      for (const [colour, share] of specks) {
        if (r < share) { ctx.fillStyle = colour; ctx.fillRect(x, y, 1, 1); break; }
        r -= share;
      }
    }
  }
  return c.toDataURL();
}
function dressPage() {
  document.documentElement.style.setProperty('--rock-img', `url(${rockURL()})`);
}

// The dice shows its pressed art while held, as in the game.
const dice = document.getElementById('btn-random');
let diceHeld = false;
function paintDice() { paintTile(dice.firstChild, S.controls.random[diceHeld ? 1 : 0]); }
dice.addEventListener('pointerdown', () => { diceHeld = true; paintDice(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) {
  dice.addEventListener(ev, () => { if (diceHeld) { diceHeld = false; paintDice(); } });
}
dice.addEventListener('click', () => {
  sounds.builder('dice');
  if (!locks.body) {
    setBody(KINDS[Math.floor(Math.random() * 2)]);
    state.build[state.kind].skin = undefined;
  }
  const fresh = randomBuild(), build = state.build[state.kind];
  for (const f of FEATURES) if (!locks[f]) { build[f] = fresh[f]; resetColours(f); }
  // a hat half the time, and each other extra about one time in three
  if (!locks.extras) {
    const heads = S.hatOrder.filter(v => !S.hats[v].on), rest = S.hatOrder.filter(v => S.hats[v].on);
    build.extras = (Math.random() < 0.5 ? [heads[Math.floor(Math.random() * heads.length)]] : [])
      .concat(rest.filter(() => Math.random() < 1 / 3));
  }
  state.name[state.kind] = makeName();
  endClip();
  update();
});
const mixBtn = document.getElementById('btn-mix');
mixBtn.setAttribute('aria-pressed', mix);
mixBtn.addEventListener('click', () => {
  mix = !mix;
  mixBtn.setAttribute('aria-pressed', mix);
  // turned off, what was the other's goes back to the body's own
  if (!mix) {
    const build = state.build[state.kind];
    for (const f of FEATURES) if (mixed(build[f])) { build[f] = { v: build[f].v, borrowed: false }; resetColours(f); }
    endClip();
  }
  update();
});
document.getElementById('btn-name').addEventListener('click', () => {
  state.name[state.kind] = makeName();
  update();
});

// ---- sounds ------------------------------------------------------------

// The game's own sounds (sounds/, from the exporter's export_sounds), each
// fetched the first time it plays. A Zoombini has a voice that goes with its
// looks - each of the game's kinds of thing it says is recorded 25 times, one
// for each hair and nose - and says something when clicked, as the builder's
// big Zoombini does, as an idle starts, and crying out landing from a
// tumble. A Fleen chatters instead, one of the Fleens' own at random. Feet
// sound as whose they are, on either body: a Zoombini's step as the same
// walks do in other scenes, a Fleen's as its run does (and, running away, as
// it leaves). Hats play what the game plays with them, put on and in their
// animations; a topping goes on with its own. The tiles and the dice click
// as the builder's do. Sound is on unless
// turned on with the window's Sound plaque - it starts off (Sam, 1 October
// 2026) - and this browser remembers which. Nothing plays until the page is
// first clicked or a key pressed, as browsers ask.
const SOUND_KEY = 'zoombini-maker-muted';
const sounds = (() => {
  let ctx = null, muted = true, feet = null;
  try { muted = localStorage.getItem(SOUND_KEY) !== '0'; } catch (e) { muted = true; }
  const buffers = new Map();
  function context() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  // a sound's samples, or null if it cannot be had (opened from file://)
  function load(file) {
    if (!buffers.has(file)) {
      buffers.set(file, fetch('sounds/' + file + '.wav')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .then(b => new Promise((resolve, reject) => ctx.decodeAudioData(b, resolve, reject)))
        .catch(() => { buffers.delete(file); return null; }));
    }
    return buffers.get(file);
  }
  // play a sound; stop() on what comes back fades it out
  function play(file) {
    const handle = { stopped: false };
    handle.stop = () => { handle.stopped = true; };
    if (muted || !context()) return handle;
    load(file).then(buf => {
      if (!buf || handle.stopped || muted) return;
      const src = ctx.createBufferSource(), gain = ctx.createGain();
      src.buffer = buf;
      src.connect(gain).connect(ctx.destination);
      src.start();
      handle.stop = () => {
        gain.gain.setTargetAtTime(0, ctx.currentTime, 0.03);
        src.stop(ctx.currentTime + 0.2);
      };
    });
    return handle;
  }
  const pick = list => list[Math.floor(Math.random() * list.length)];
  // what a Zoombini of these looks says, of the game's kinds; a borrowed
  // hair or nose by its number, none as the first
  function voice(build, kind) {
    const V = S.sounds.voice, v = f => build[f].none || build[f].v >= 5 ? 0 : build[f].v;
    return 'ZOOMBINI-' + (V.bases[kind] + V.hair[v('hair')] + v('nose'));
  }
  const chatter = () => 'FLEENS-' + pick(S.sounds.chatter);
  function stopFeet() { if (feet) { feet.stop(); feet = null; } }
  return {
    get muted() { return muted; },
    setMuted(m) {
      muted = m;
      if (m) stopFeet();
      try { localStorage.setItem(SOUND_KEY, m ? '1' : '0'); } catch (e) { /* not remembered */ }
    },
    wake: context,
    builder: what => play('PICKER-' + S.sounds.builder[what]),
    play: file => play(file),
    // a hat's own, as it is put on
    hat(h, what) { if (h && h[what]) play(h[what]); },
    // a clip's cues ([tick, file]) for this tick
    cues(c, at) { for (const [t, f] of c.sounds || []) if (t === at) play(f); },
    // clicked: something it says, or a Fleen's chatter
    speak(kind, build) {
      play(kind === 'zoombini' ? voice(build, Math.floor(Math.random() * S.sounds.voice.says)) : chatter());
    },
    // each tick of a clip: the feet walking, a word as an idle starts, a
    // tumble's cry, a hat's own
    onPose(p, c, at) {
      const kind = state.kind, build = state.build[kind], f = build.feet, snd = S.sounds;
      if (c.walk && !f.none && f.v < 5) {
        // the feet sound as whose they are, on either body: a Fleen's run
        // (and as it runs away, its leaving), or a Zoombini's steps
        if ((kind === 'fleen') !== f.borrowed) {
          if (at === 0) {
            stopFeet();
            if (c.fast) play('FLEENS-' + snd.fleenLeave[f.v]);
            feet = play('FLEENS-' + snd.fleenFeet[f.v]);
          }
          if (f.v === snd.fleenRattle.feet && snd.fleenRattle.ticks.includes(at)) play('FLEENS-' + snd.fleenRattle.sound);
        } else {
          const steps = snd.zoombiniFeet[f.v];
          for (const [t, file] of steps.cues) if (at % steps.loop === t) play(file);
        }
      } else if (c.walk && !f.none && at === 0) {
        // feet found elsewhere with a sound of their own (the mine cart's)
        const e = S.characters[kind].borrowed.feet[f.v];
        if (e && e.walkSound) { stopFeet(); feet = play(e.walkSound); }
      }
      const idle = !c.walk && !c.hat && !c.tumble ? S.characters[kind].idles.indexOf(c.ticks) : -1;
      if (idle >= 0 && kind === 'zoombini' && at === 0) play(voice(build, pick(snd.voice.idle)));
      if (idle >= 0 && kind === 'fleen' && snd.fleenIdleChatter[idle] === at) play(chatter());

// ---- idling ------------------------------------------------------------

// Stand still for a while, then play one of the character's idle clips,
// then stand still again - as the game's characters do between moves. A
// Zoombini in its own feet sometimes shows them off (its feet's special); so

// the same feet frames and keeps its own head still. Fleen idles never blink,
// so they get a blink of the page's own.
const PAGE_BLINK = [[1, 0, 0, 0, -1], [1, 0, 0, 0, -1]];

const WALK_WEIGHT = 3;                       // and walking about as often
const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');

// A build's moves. Idle ticks are [eyes, dx, dy, facing, feet]; walk ticks
// are as described at WALK_PARTS.
const idlesOf = kind => kind === 'fleen' ? S.characters.fleen.idles.concat([PAGE_BLINK]) : S.characters[kind].idles;
// Whether its feet's showing off is saved as a loop of itself alone: a Fleen

// stands up on top of them again at rest, which jumped at each end of the
// GIF, and around again (Sam, 30 September 2026).
const loopsSpecial = (kind, build) => kind === 'fleen' && build.feet.borrowed && !build.feet.none
  && (S.characters.fleen.borrowed.feet[build.feet.v].special || []).some(f => f.drop);
// The ticks its feet show off in, or null.
function specialOf(kind, build) {
  const ch = S.characters[kind], feet = build.feet;
  if (stepsLike(kind, build)) return ch.specials[0];
  if (kind === 'zoombini' && !feet.borrowed && !feet.none) return ch.specials[feet.v];
  if (kind === 'fleen' && feet.borrowed && ch.borrowed.feet[feet.v].special) {
    // the Fleen's head stays put; the special's opening tick, which faces a
    // Zoombini (and its device) towards the viewer, is left out

    const frames = ch.borrowed.feet[feet.v].special;
    return S.characters.zoombini.specials[feet.v]

}
// Its walk: a clip per direction, and which way their frames face.
function walkOf(kind, build) {

  if (stepsLike(kind, build)) return { dirs: ch.walks.own[0], faces: ch.faces.own };

// The pose a clip's tick puts the figure in. A hat's own clip (`hat`) moves

const poseAt = (clip, t) => clip.walk
  ? Object.assign({}, REST, { walk: t, dx: t[0], dy: t[1], faces: clip.faces })
  : clip.hat ? Object.assign({}, REST, { hat: t })
  : Object.assign({}, REST, { eyes: t[0], dx: t[1], dy: t[2], facing: t[3], feet: t[4] });
// The tumble as poses: the character's ticks (tumble_clip in the exporter),
// then standing again. Its tumbling frames face right, a Fleen's too (the
// exporter turns it first, about its origin; the window turns figures about
// the middle of their standing box, so its ticks move over by twice that).
// A hat is knocked off as the spin starts, flies up and back out of sight,

// one (mud, an acorn), else a drop straight down.
const HAT_FLIGHT = [[0, -2, -6], [0, -5, -14], [0, -9, -25], [0, -13, -39]];

    tumble: [t[0], t[1] + shift, t[2], t[3].map(([i, x, y]) => [i, x + shift, y]), t[4]],
    dx: t[1] + shift, dy: t[2], faces: 'right', n,
    hat: HAT_FLIGHT[n] || [-1, 0, 0] }));

    const drop = HAT_DROP;

}

// Clips are {ticks, walk} or {dirs, walk}, a walk with a clip per direction;
// a direction, and left or right, is picked as it starts.
function clipsFor(kind) {
  const build = state.build[kind];
  const clips = idlesOf(kind).concat(kind === 'fleen' ? [PAGE_BLINK] : []);
  const special = specialOf(kind, build);
  for (let i = 0; special && i < SPECIAL_WEIGHT; i++) clips.push(special);
  const out = clips.map(ticks => ({ ticks, walk: false }));
  const walk = walkOf(kind, build);
  for (let i = 0; i < WALK_WEIGHT; i++) out.push({ dirs: walk.dirs, walk: true, faces: walk.faces });
  return out;
}

// The extras' animations - the crab leaping on, the bee buzzing in - on a
// clock of their own: one at a time, arriving when put on and their idles
// now and then; a walk or a tumble stops them.
let extraClip = null, extraAt = 0, extraWait = 20;
function startExtraClip(k, kind) {
  const anims = (S.hats[k].anims || []).filter(a => a.kind === kind);
  if (!anims.length || paused) return;
  const a = anims[Math.floor(Math.random() * anims.length)];
  extraClip = { k, ticks: a.ticks, sounds: a.sounds };
  extraAt = 0;
}
function extraTick() {
  const extras = state.build[state.kind].extras || [];
  // a tumble's poses carry their own (a seat's throw)
  if (clip && clip.tumble) { extraClip = null; return; }
  pose.extraHats = {};
  if (clip && clip.walk) { extraClip = null; return; }
  if (!extraClip && extras.length && --extraWait <= 0) {
    extraWait = 20 + Math.floor(Math.random() * 30);
    startExtraClip(extras[Math.floor(Math.random() * extras.length)], 'idle');
  }
  if (extraClip && !extras.includes(extraClip.k)) extraClip = null;
  if (extraClip) {
    pose.extraHats[extraClip.k] = extraClip.ticks[extraAt];
    sounds.cues(extraClip, extraAt);
    if (++extraAt >= extraClip.ticks.length) extraClip = null;
  }
}

function tick() {
  if (clip) {
    // a clip of poses (the tumble), or of the game's ticks
    Object.assign(pose, clip.poses ? clip.poses[clipAt] : poseAt(clip, clip.ticks[clipAt]), { n: clipAt });
    sounds.onPose(pose, clip, clipAt);
    if (++clipAt >= (clip.poses || clip.ticks).length) {
      clip = null;
      sounds.stopFeet();
      waitTicks = 15 + Math.floor(Math.random() * 30);
    }
  } else if (paused) {
    // paused, a walk asked for by an arrow has played: stop again

  } else {
    Object.assign(pose, REST);
    if (--waitTicks <= 0) {
      const clips = clipsFor(state.kind);
      startClip(clips[Math.floor(Math.random() * clips.length)]);
    }
  }
  extraTick();
  drawPreview();
}

// A clip belongs to the build it started on - a special is one pair of
// feet's - so a new pick ends it and returns to the rest pose.
function startClip(c) {
  if (c.dirs) {
    // any direction but a Fleen's run away (see waysOf)
    // and only along in stepping Fleen shoes (see alongOnly)
    const dirs = c.dirs.map((_, d) => d).filter(d => !(state.kind === 'fleen' && c.dirs.length > 1 && d === 1)
      && !(alongOnly(state.kind, state.build[state.kind]) && d !== 2));

    clip = c;

function endClip() {
  sounds.stopFeet();

function setPaused(p) {

// The arrows (and the arrow keys, outside the tabs and the Save list): the
// character walks that way now, and stands facing that way after. Each way
// is [the walk's direction, left or right or null for as it is]. What a
// character can do is down to its feet. A Zoombini walks along, towards us
// and away. A Fleen on its own feet hops towards us on the slant and runs

// shoes it also walks along, so it gets left and right besides; riding a

// walk plays once.

// looked "weirdly lanky" (Sam), so those directions are left out
const alongOnly = (kind, build) => kind === 'zoombini' && build.feet.borrowed && !build.feet.none

const statusEl = document.getElementById('status');

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);

// The character alone as the window shows it now (Sam: "exactly as it
// currently looks") - mid-move, its extras, the way it faces - cropped to its
// own outline, at 4x on transparency.
function savePicture() {
  const kind = state.kind, build = state.build[kind];
  const scale = 4, pad = 2 * scale;
  const parts = variantsFor(kind, build, pose);
  if (!parts.length) { say('Nothing to save - every part is none.'); return; }
  // facing the way it faces in the window
  const turned = heading !== framesFace(kind, pose), mid = turnAxis(kind);
  const bb = turnedBox(boundsOf(parts), turned, mid);
  const c = document.createElement('canvas');
  c.width = (bb.r - bb.l) * scale + pad * 2;
  c.height = (bb.b - bb.t) * scale + pad * 2;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const x0 = pad - bb.l * scale;
  drawCharacter(ctx, kind, build, x0, pad - bb.t * scale, scale, pose, turned ? x0 + mid * scale : null);
  c.toBlob(blob => {
    if (!blob) { say('Could not make the PNG in this browser.'); return; }
    download(blob, state.name[kind] + '-' + kind + '.png');
  }, 'image/png');

// The animations a build can be saved as, each a list of poses a tick
// apart: its idles strung together with pauses between; its feet showing
// off, if they do; and its walk - a Zoombini's towards us, along and away
// (three of its five directions; the other two are near copies), a Fleen's
// hop and run away, or its ride on a Zoombini device.
// How it gets along, by whose feet it has on and which (Sam: "appropriate
// verb for each feet"); parts from elsewhere by name.
const GOING = { zoombini: ['Walking', 'Skating', 'Bouncing', 'Rolling', 'Flying'],
                fleen: ['Hopping', 'Hopping', 'Rolling', 'Trundling', 'Flying'] };

  const f = build.feet, kind = state.kind;
  if (f.none) return kind === 'zoombini' ? 'Sliding' : 'Hopping';
  if (stepsLike(kind, build)) return 'Walking';
  if (f.v >= 5) return /wheel/i.test(S.characters.zoombini.names.feet[f.v]) ? 'Rolling' : 'Walking';
  return GOING[f.borrowed ? OTHER[kind] : kind][f.v];
}
function animationsFor(kind, build) {
  const rest = n => Array.from({ length: n }, () => REST);
  const idle = ticks => ticks.map(t => poseAt({ walk: false }, t));
  const out = [{ label: 'Looking around', poses: idlesOf(kind).flatMap(ticks => rest(5).concat(idle(ticks))).concat(rest(5)) }];
  const special = specialOf(kind, build);
  if (special) out.push({ label: 'Showing off its feet',
                          poses: loopsSpecial(kind, build) ? idle(special) : rest(5).concat(idle(special), rest(5)) });
  const walk = walkOf(kind, build);
  const go = goingOf(build);
  const names = kind === 'zoombini' ? { 0: go + ' towards us', 2: go + ' along', 3: go + ' away' }

  // the hat's own: a woodpecker pecking, mud landing

    out.push({ label: a.label, poses: before.concat(a.ticks.map(at), rest(a.kind === 'arrive' ? 10 : 5)) });
