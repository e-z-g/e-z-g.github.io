<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zoombini Maker</title>
<!--
  Zoombini Maker - build a Zoombini (or a Fleen) the way the 1996 game's
  Zoombini Isle screen does: a tile for each choice of each feature, and a
  dice for a random one - here one feature at a time, under tabs. It then
  stands there idling, as the game's characters do.

  Where the pieces come from. Everything drawn here is the game's own art,
  pulled out of its Mohawk archives by tools/export_web.py in the separate
  zoombinis extraction project, which writes sprites.js next to this file.
  Do not hand-edit sprites.js; re-run that.

  - The characters are assembled from the in-game atlases (ZOOMBINI tBMP
    3000, FLEENS tBMP 4000), one rest pose per part variant, each with its
    REGS anchor. Every part is drawn at (origin - anchor), which is how the
    game lines them up. The maker screen has its own large parts (PICKER
    tBMP 4300) but no anchors for them - where the game puts those is in the
    EXE - so they are not used: guessing offsets would put noses on cheeks.
  - The Zoombini tiles are the maker screen's real buttons (PICKER tBMP
    4400), in the same variant order as the atlas. The game has no Fleen
    maker; the Fleen tiles are made by the exporter in the same style, and
    so are the two body tiles, which the game has no need of. The dice and
    the go arrow are PICKER tBMP 4200.

  The character is drawn with its origin fixed in the preview, not centred
  on its own outline, so the body stays put and only the feature you change
  moves - hair and feet are lopsided, and re-centring on every click makes
  the whole figure jump.

  Which body it is - Zoombini or Fleen - is picked like any feature, from
  the first row of tiles, and either can wear the other's parts: each
  feature row offers the Zoombini's five, then the Fleen's five. The fitting is done by the
  exporter, not here - the part's skin recoloured to the host's (a Fleen's
  legs belong to its feet, a Zoombini's eyelids to its eyes), mirrored
  because a Zoombini faces right and a Fleen left, and re-anchored to the
  host's head top, body bottom, or its own eye and nose spots (and Fleen hair
  goes under a Zoombini's eyes, which sit too high to clear it). Borrowed feet
  get more: a Zoombini's far foot goes behind the egg and its near foot in
  front, and a Fleen keeps its own legs for Zoombini shoes and stands its
  stalk on a Zoombini spring, wheels or propeller.
  The page only paints the result (see variantsFor).

  Every so often it walks on the spot, in one of the game's directions - a
  Zoombini has five per pair of feet, from towards the viewer round to away
  from them - to the right or, mirrored, to the left, and stays turned that
  way afterwards. A Fleen hop-steps (its hop frames face right, though it
  stands facing left) or runs away from the viewer, in its own feet or in
  Zoombini sneakers or skates. Borrowed Fleen wheels, treads and rockets use the
  Fleen's own spinning, rolling and firing frames; see
  walk_clip() and FLEEN_RIDES in the exporter for how borrowed feet walk.

  The idling is the game's own: its idle scripts for each character, which
  change nothing but the eyes, the head's facing, the feet and where the
  whole figure stands - glances and blinks, a Zoombini turning its head and
  showing off its feet (tapping sneakers, a bouncing spring, a propeller
  spinning up), a Fleen's glances. The exporter writes them in terms of what
  the parts do - rest, blink, glance, facing - rather than frame numbers, so
  borrowed eyes blink and glance with their own frames, and borrowed parts,
  having no turned frames, ride along with the turning head. A Fleen on a
  Zoombini spring, wheels or propeller plays that device's special too.
  Fleen idles never blink, so the page adds a blink of its own. Motion stops for prefers-reduced-motion, and
  the Pause button stops it anywhere. Save's picture always takes the rest
  pose; its GIFs play one animation each (see animationsFor), looping in the
  window first, to be saved from there (previewGIF).

  Names come from the game's own generator (ZOOMBINI.EXE seg26:1f26, run for
  every Zoombini it makes), ported letter for letter - see makeName(). A new
  name comes with the dice or a click on the name; picking one feature keeps
  it. The game writes names lowercase; the page capitalises them to show.

  Why the sprite sheet is a data: URI inside sprites.js rather than a PNG:
  so "Save picture" works when the page is opened from file://. A canvas that has
  drawn a file:// image is tainted and toBlob() throws.

  Pixel art is only ever scaled by whole numbers - the preview picks the
  largest integer CSS scale that fits, and image-rendering: pixelated does
  the rest - so every source pixel stays square.
-->
<!-- The game's own face, Cornerstone, which it sets its help text in:
     fonts.js, from tools/export_fonts.py, embeds it so the page works from
     file:// too. -->
<script src="fonts.js"></script>
<style>
  /* The look is the game's Zoombini Isle builder, made of its own parts
     rather than drawn from it (the scene itself stays out, as a backdrop
     behind the character was tried and taken out): the night sky's blues,
     the dark rock the builder's tiles sit in, the dice and green go arrow
     that are its own buttons, and, for everything with words on, the flat
     grey stone of its name bar - a bevel lit from the top right, a black
     outline - pressed in, as a picked tile is, to the same tan. (The
     tiles' speckled face was tried on those first; words on it were hard to
     read.) Every edge is square and in whole source pixels at 2x, like the
     tiles beside them. */
  :root {
    color-scheme: dark;
    --night: #1c185a;                    /* the builder's sky, darkest to lightest */
    --night-deep: #101042;
    --night-hi: #212173;
    --cloud: #7384ce;
    --rock: #312929;                     /* the rock round the builder's tiles */
    --rock-lo: #211818;
    --rock-hi: #423942;
    --stone: #828282;                    /* a tile: face, bevel, pressed */
    --stone-hi: #c0c0c0;
    --stone-lo: #414141;
    --stone-deep: #202020;
    --tan: #e7b55a;
    --tan-hi: #f1dfb2;
    --tan-lo: #ce8431;
    --tan-deep: #844a39;
    --window: #828282;                   /* behind the character: the tiles' grey stone, so dark hair shows */
    --zoombini: #9ebfff;                 /* the two skins, for the title */
    --fleen: #c9ee31;
    --text: #f1dfb2;
    --rock-img: none;
    --display: 'Cornerstone', 'Trebuchet MS', sans-serif;   /* it has no bold */
    --ui: 'Cornerstone', 'Trebuchet MS', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: var(--ui);
    font-weight: 500;
    line-height: 1.35;
  }
  button { touch-action: manipulation; font: inherit; -webkit-tap-highlight-color: transparent; }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 16px 36px;
  }

  /* ---- materials ---- */

  /* A stone plaque: the name bar's flat face, a tile's two-step bevel
     (light on the top and right, dark on the left and bottom), a black
     outline, and its words cut in. */
  .stone {
    color: #111;
    background: var(--stone);
    border: 2px solid #000;
    border-radius: 0;
    box-shadow:
      inset 0 2px 0 var(--stone-hi), inset -2px 0 0 var(--stone-hi),
      inset 2px 0 0 var(--stone-deep), inset 0 -2px 0 var(--stone-deep),
      inset 0 4px 0 var(--stone), inset -4px 0 0 var(--stone),
      inset 4px 0 0 var(--stone-lo), inset 0 -4px 0 var(--stone-lo);
    text-shadow: 1px 1px 0 var(--stone-hi);               /* cut in */
    cursor: pointer;
  }
  .stone:hover { filter: brightness(1.08); }
  /* pressed, or picked: the tan face, the bevel turned round */
  .stone:active, .stone[aria-selected="true"], .stone[aria-pressed="true"] {
    background: var(--tan);
    box-shadow:
      inset 0 2px 0 var(--tan-deep), inset -2px 0 0 var(--tan-deep),
      inset 2px 0 0 var(--tan-hi), inset 0 -2px 0 var(--tan-hi),
      inset 0 4px 0 var(--tan-lo), inset -4px 0 0 var(--tan-lo),
      inset 4px 0 0 #fefefe, inset 0 -4px 0 #fefefe;
    color: #4a1d08;
    text-shadow: 1px 1px 0 var(--tan-hi);
    filter: none;
  }
  /* The rock the tiles and the window are set in. */
  .rock {
    background: var(--rock) var(--rock-img) 0 0 / 64px 64px;
    image-rendering: pixelated;
    border: 2px solid #000;
    box-shadow: inset 2px 2px 0 var(--rock-hi), inset -2px -2px 0 var(--rock-lo);
  }
  :focus-visible { outline: 3px solid var(--tan); outline-offset: 2px; }

  /* ---- header ---- */

  header { margin-bottom: 16px; }
  /* Cartoon lettering: the skin of whichever character is being made, in
     the art's own black outline. */
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 2.6rem;
    line-height: 1;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--zoombini);
    text-shadow:
      2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000,
      2px 2px #000, -2px 2px #000, 2px -2px #000, -2px -2px #000,
      4px 5px 0 #000;
  }
  body[data-kind="fleen"] h1 { color: var(--fleen); }

  /* ---- the character and its controls ---- */

  /* The buttons were in two places - saving and sharing in the header, the
     name, dice, Pure and Pause under the window - and read as a scatter.
     Now each sits with what it acts on: the name bar under the character,
     as the game's builder has it; Pause in the window's corner, as it stops
     the window; and one bar for the rest, rolling at one end and saving and
     sharing at the other. */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }
  .stage { display: flex; flex-direction: column; gap: 12px; }
  .window {
    padding: 10px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  /* what saving or copying did, over the foot of the window, clear of the
     Pause button in its corner */
  .status {
    position: absolute; left: 0; right: 0; bottom: 10px; margin: 0; padding: 0 8px;
    text-align: center; pointer-events: none;
    text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000;
  }
  .preview {
    align-self: stretch;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: var(--window);
    border: 2px solid #000;
    box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  #preview { display: block; image-rendering: pixelated; }
  .corner {
    position: absolute; top: 8px; right: 8px;
    width: 44px; height: 44px; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .corner canvas { display: block; width: 18px; height: 18px; image-rendering: pixelated; }
  /* Arrows in the window's other corner: the character walks that way, as
     far as its feet go (see waysOf). A Zoombini's four go along, towards us
     and away; a Fleen's hop and its run away are both on the slant, so it
     has the diagonals, and left and right where it walks along. */
  .pad {
    position: absolute; right: 8px; bottom: 8px; z-index: 2;
    display: grid; grid-template-columns: repeat(3, 34px); grid-template-rows: repeat(3, 34px); gap: 2px;
  }
  .pad button { padding: 0; display: flex; align-items: center; justify-content: center; }
  .pad button[hidden] { display: none; }
  .pad .up { grid-area: 1 / 2; } .pad .left { grid-area: 2 / 1; }
  .pad .right { grid-area: 2 / 3; } .pad .down { grid-area: 3 / 2; }
  .pad .upleft { grid-area: 1 / 1; } .pad .upright { grid-area: 1 / 3; }
  .pad .downleft { grid-area: 3 / 1; } .pad .downright { grid-area: 3 / 3; }
  .pad .upleft .arrow, .pad .upright .arrow, .pad .downleft .arrow, .pad .downright .arrow {
    border-width: 5px 0 5px 11px; border-left-color: currentColor;
  }
  .pad .upright .arrow { transform: rotate(-45deg); } .pad .downright .arrow { transform: rotate(45deg); }
  .pad .downleft .arrow { transform: rotate(135deg); } .pad .upleft .arrow { transform: rotate(-135deg); }
  .pad .arrow { width: 0; height: 0; border: 7px solid transparent; }
  .pad .up .arrow { border-bottom-color: currentColor; border-top: 0; }
  .pad .down .arrow { border-top-color: currentColor; border-bottom: 0; }
  .pad .left .arrow { border-right-color: currentColor; border-left: 0; }
  .pad .right .arrow { border-left-color: currentColor; border-right: 0; }
  /* A GIF from the Save list plays here first, looping, over the character:
     the very file that Save GIF downloads, at the window's own scale. */
  .gif-preview {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 10px; background: var(--window);
  }
  .gif-preview[hidden] { display: none; }
  .gif-preview img { display: block; image-rendering: pixelated; }
  .gif-preview .title { margin: 0; text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000; }
  .gif-preview .buttons { display: flex; gap: 10px; }
  .status { z-index: 4; }

  .name-btn {
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
    padding: 6px 18px 8px;
    font-family: var(--display);
    font-size: 1.9rem;
    line-height: 1.1;
    min-width: 7em;
    max-width: 100%;
  }
  .name-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name-btn .again { font-family: system-ui, sans-serif; font-size: 1.1rem; font-weight: 700; opacity: 0.6; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; }
  /* Save opens a list, set in the rock like the tiles: the picture, then
     each animation the character has, as a GIF. */
  .save { position: relative; }
  .caret {
    display: inline-block; margin-left: 9px; vertical-align: 0.15em;
    border: 6px solid transparent; border-top-color: currentColor; border-bottom: 0;
  }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 20;
    display: flex; flex-direction: column; gap: 6px; padding: 10px; width: max-content;
  }
  .menu[hidden] { display: none; }
  .menu .item { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; text-align: left; }
  .menu .fmt { font-size: 0.8em; opacity: 0.6; }
  .toolbar .group { display: flex; align-items: center; gap: 10px; }
  .ctl {
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    line-height: 0;
  }
  .ctl canvas { display: block; image-rendering: pixelated; }
  #btn-random canvas { width: 108px; height: 78px; }
  .plate { padding: 8px 16px 10px; font-size: 1.05rem; min-width: 6em; white-space: nowrap; }

  /* ---- the feature box: tabs, and the open one's tiles, in the builder's rock ---- */

  /* One feature at a time. All the rows at once - 42 tiles - had to shrink
     to fit a phone, with the character squeezed to a sliver above them and
     every colour and lock a 10-pixel plaque. With tabs, the open feature's
     tiles are shown bigger and its colours and lock are full-size plaques
     with words on, and on a phone the character has the room back. On a
     desktop the box is as wide as a line of tiles at 2x needs, and the
     window has the rest.
     --tile is set by layoutTiles(); the two gaps are read by it too. */
  .box {
    --tile: 80px; --set-gap: 6px; --none-gap: 14px;
    padding: 14px; width: 100%; max-width: 560px; justify-self: center;
    display: flex; flex-direction: column; gap: 14px;
  }
  .tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .tab {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 4px 10px; font-size: 1.05rem; min-width: 0; white-space: nowrap;
  }
  .tab canvas { flex: none; width: 12px; height: 13px; image-rendering: pixelated; }
  .tab canvas[hidden] { display: none; }
  /* Every panel sits in the same grid cell, the closed ones invisible
     rather than gone, so the box is always as tall as the tallest - the
     features' two lines of tiles - and nothing moves when the tab changes:
     on a phone the character's height comes from what the box leaves. */
  .panels { display: grid; }
  .feature { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 14px; }
  .feature:not(.open) { visibility: hidden; }
  /* A feature: the Zoombini's five over the Fleen's five, whichever body is
     picked, so a tile is always where it was; none beside both. The body's
     two tiles make one line, in the middle; the hats are Pizza Pass's five
     over five from along the way. */
  .tiles { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: var(--none-gap); }
  .sets { display: flex; flex-direction: column; gap: var(--set-gap); }
  .feature.body .sets { flex-direction: row; gap: var(--none-gap); }
  .set { display: flex; gap: var(--set-gap); }
  .tile {
    flex: none;
    width: var(--tile);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }
  .tile canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 40 / 43;
    image-rendering: pixelated;
  }
  /* Under the tiles, the open part's plaques: a colour for each of its own
     colours - two for a ponytail or a propeller - and the lock that keeps
     it when the dice rolls. The icons are at 2x, a whole number of the
     tiles' pixels, like everything else here. */
  .controls { display: flex; gap: 8px; min-height: 44px; }
  .controls .spacer { flex: 1; }
  .ctrl {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px 8px; position: relative; font-size: 1.05rem; white-space: nowrap;
  }
  .ctrl[hidden] { display: none; }
  .ctrl canvas { display: block; flex: none; image-rendering: pixelated; }
  /* a colour: the plaque is the button, the browser's own colour picker
     under it, invisible, so a tap anywhere on it opens the picker */
  .ctrl input[type="color"] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; border: 0; padding: 0; cursor: pointer;
  }
  .ctrl:has(input:focus-visible) { outline: 3px solid var(--tan); outline-offset: 2px; }


  /* A desktop: the character in its window on the left, as tall as the
     screen allows; the buttons, then the tiles, down the right. */
  @media (min-width: 901px) {
    main {
      grid-template-columns: minmax(0, 1fr) minmax(0, 560px);
      grid-template-areas: "window tools" "window box" "window .";
      grid-template-rows: auto auto 1fr;
      gap: 16px 22px;
    }
    .stage { display: contents; }
    .window { grid-area: window; }
    .box { grid-area: box; }
    .toolbar { grid-area: tools; }
  }

  /* A phone: everything on one screen - the window takes whatever height
     the header, buttons and the open tab leave (see layoutPreview). The
     game's buttons at 1x. */
  @media (max-width: 900px) {
    .pad { grid-template-columns: repeat(3, 28px); grid-template-rows: repeat(3, 28px); }
    .page { padding: 8px 10px 24px; }
    header { margin-bottom: 8px; }
    /* Cornerstone is wide: smaller, so the title keeps to one line */
    h1 { font-size: 1.3rem; white-space: nowrap;
         text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000,
                      1px 1px #000, -1px 1px #000, 1px -1px #000, -1px -1px #000, 2px 3px 0 #000; }
    main { gap: 8px; }
    .stage { gap: 8px; }
    .window { padding: 5px; gap: 5px; }
    .preview { padding: 4px; }
    .corner { top: 4px; right: 4px; width: 36px; height: 36px; }
    .status { bottom: 6px; font-size: 0.85rem; }
    .name-btn { font-size: 1.15rem; padding: 3px 12px 5px; min-width: 6em; }
    .toolbar { gap: 8px; }
    .toolbar .group { gap: 6px; }
    #btn-random canvas { width: 54px; height: 39px; }
    .plate { min-width: 0; font-size: 0.8rem; padding: 6px 10px 8px; }
    .caret { margin-left: 6px; border-width: 5px; }
    .box { --set-gap: 3px; --none-gap: 8px; padding: 6px; gap: 6px; }
    .tabs { gap: 3px; }
    .tab { font-size: 0.75rem; padding: 7px 2px 9px; gap: 3px; }
    .feature { gap: 6px; }
    .controls { gap: 4px; min-height: 0; }
    .ctrl { font-size: 0.8rem; padding: 4px 10px 6px; gap: 6px; }
  }

  footer { margin-top: 30px; font-size: 0.9rem; opacity: 0.75; }
  footer a { color: var(--zoombini); }
  /* Cornerstone has one weight: shown as it is, never made bold */
  html { font-synthesis: none; }
  body, .plate, .status, h1, .name-btn, .tab, .ctrl { font-weight: 400; }
</style>
</head>
<body data-kind="zoombini">
<div class="page">
  <header>
    <h1>Zoombini Maker</h1>
  </header>

  <main>
    <div class="stage">
      <div class="window rock">
        <div class="preview" id="preview-wrap">
          <canvas id="preview" role="img"></canvas>
          <button class="stone corner" id="btn-motion" aria-pressed="false"><canvas></canvas></button>
          <div class="pad" id="pad" role="group" aria-label="Walk">
            <button class="stone up" data-way="up" title="Walk away" aria-label="Walk away"><span class="arrow"></span></button>
            <button class="stone left" data-way="left" title="Walk left" aria-label="Walk left"><span class="arrow"></span></button>
            <button class="stone right" data-way="right" title="Walk right" aria-label="Walk right"><span class="arrow"></span></button>
            <button class="stone down" data-way="down" title="Walk towards us" aria-label="Walk towards us"><span class="arrow"></span></button>
            <button class="stone upleft" data-way="upleft" title="Run away to the left" aria-label="Run away to the left" hidden><span class="arrow"></span></button>
            <button class="stone upright" data-way="upright" title="Run away to the right" aria-label="Run away to the right" hidden><span class="arrow"></span></button>
            <button class="stone downleft" data-way="downleft" title="Hop towards us, to the left" aria-label="Hop towards us, to the left" hidden><span class="arrow"></span></button>
            <button class="stone downright" data-way="downright" title="Hop towards us, to the right" aria-label="Hop towards us, to the right" hidden><span class="arrow"></span></button>
          </div>
          <div class="gif-preview" id="gif-preview" role="dialog" aria-labelledby="gif-title" hidden>
            <p class="title" id="gif-title"></p>
            <img id="gif-img" alt="">
            <div class="buttons">
              <button class="stone plate" id="gif-save">Save GIF</button>
              <button class="stone plate" id="gif-back">Back</button>
            </div>
          </div>
          <p class="status" id="status" aria-live="polite"></p>
        </div>
        <button class="stone name-btn" id="btn-name" title="Think of a new name"><span class="name" id="name"></span><span class="again" aria-hidden="true">&#x21bb;</span></button>
      </div>
      <div class="toolbar">
        <div class="group">
          <button class="ctl" id="btn-random" title="Roll a new one" aria-label="Roll a new one"><canvas width="54" height="39"></canvas></button>
          <button class="stone plate" id="btn-pure" aria-pressed="false" title="Roll only a Zoombini's parts on a Zoombini and a Fleen's on a Fleen">Pure</button>
        </div>
        <div class="group share">
          <div class="save">
            <button class="stone plate" id="btn-save" aria-haspopup="menu" aria-expanded="false" aria-controls="save-menu">Save<span class="caret" aria-hidden="true"></span></button>
            <div class="menu rock" id="save-menu" role="menu" aria-label="Save as" hidden></div>
          </div>

// other clip takes every other one.

// ---- names -------------------------------------------------------------

// (far-data segments 89-92). Vowels and consonants alternate up to a length
// of 4-8, starting with a vowel 39% of the time. A vowel is drawn from
// VOWEL_UNITS, which weights the single letters and adds pairs. A consonant
// is a single letter (from the weighted CONSONANTS) only as the first or
// second letter, and then two times in three; otherwise, and always later
// in the name, it is a cluster. A cluster that reaches the length has its
// second letter redrawn from VOWELS, so every name ends in a vowel, and a
// doubled start ("ee", "oo", "nn") is cut to one letter. The game's random
// numbers are inclusive at both ends, as between() is.

  'ee', 'oo', 'yo', 'ya', 'ye', 'ei', 'ie', 'ai', 'ia', 'au', 'ua', 'uo', 'ou', 'ae', 'ea'];

  'kr', 'kw', 'ld', 'mp', 'nd', 'nh', 'nn', 'ph', 'pl', 'pr', 'qu', 'qu', 'rh', 'rn', 'sc', 'sl',

// ---- drawing -----------------------------------------------------------

const sheet = new Image();
const rect = i => S.rects[i];

  let [sx, sy, w, h] = rect(index);

// ---- colours ------------------------------------------------------------

// Skin is the host's own shades wherever they are - the body, and the skin
// every part carries (eyelids, legs, the head under hair), which the
// exporter has already recoloured to the host's - so it is found by colour:

const SKIN_STEPS = {
  zoombini: { '112135': 0, '2e4f7f': 1, '4677bf': 2, '5e9eff': 3, '7daeff': 4, '9ebfff': 5 },
  fleen: { '697905': 1, '83a407': 2, 'afd609': 4, 'c9ee31': 5, 'ebff9e': 6 },

const STEP_LIGHT = [0.14, 0.34, 0.51, 0.68, 0.74, 0.81, 0.88];

// eye variant carries its own blink and glances; a character with fewer
// glances than asked for wraps round them.
function eyeFrame(entry, eyes) {
  if (!eyes || !entry.frames) return entry;
  if (eyes === 1) return entry.frames.blink;
  const g = entry.frames.glance;
  return g[(eyes - 2) % g.length];
}

// The sprites to paint, in order. A borrowed part comes ready-fitted from the
// exporter (recoloured, mirrored, re-anchored) and takes its feature's place.
// Borrowed feet are placed around the body instead: a Zoombini in Fleen feet
// has its far foot behind the egg (`back`) and its near foot in front, so it
// stands between its treads rather than on them; a Fleen in Zoombini shoes

//

    out.splice(out.findIndex(p => p.name === 'eyes') + 1, 0, nose);

    .map(p => p.name === 'body' ? p.v : Object.assign({ part: p.name }, p.v))

// A hat, worn as Pizza Pass's Zoombinis carry the trolls' orders: centred on

    for (let x = Math.round(cx - w / 2); x < Math.round(cx + w / 2); x++) {
      const t = topAt(hair, x);
      if (t !== null) cy = Math.min(cy, t);
    }
  } else if (hair && HAT_RULE === 'hair') {
    const w = rect(h.sets[0][0].sprite)[2];
    const tops = [];
    for (let x = Math.round(cx - w / 4); x < Math.round(cx + w / 4); x++) {
      const t = topAt(hair, x);
      tops.push(t === null ? crownY : Math.min(t, crownY));
    }
    tops.sort((a, b) => a - b);
    cy = Math.min(crownY, tops[Math.ceil(tops.length * HAT_SOLID) - 1]);
  }
  byHat.set(h, cy);
  return cy;
}

// The highest opaque pixel of a placed sprite in column x (origin
// coordinates), or null: read from the sheet once, per sprite.
const columnTops = new Map();
let sheetPixels = null;
function topAt(v, x) {
  if (!columnTops.has(v.sprite)) {
    if (!sheetPixels) {
      const c = document.createElement('canvas');
      c.width = sheet.width; c.height = sheet.height;
      const g = c.getContext('2d');
      g.drawImage(sheet, 0, 0);
      sheetPixels = g.getImageData(0, 0, c.width, c.height);
    }
    const [sx, sy, w, h] = rect(v.sprite), tops = new Int16Array(w).fill(-1);
    for (let i = 0; i < w; i++) {
      for (let j = 0; j < h; j++) if (sheetPixels.data[((sy + j) * sheetPixels.width + sx + i) * 4 + 3]) { tops[i] = j; break; }
    }
    columnTops.set(v.sprite, tops);
  }
  const tops = columnTops.get(v.sprite), i = x + v.rx;
  return i >= 0 && i < tops.length && tops[i] >= 0 ? tops[i] - v.ry : null;
}

// A box relative to the REGS origin around the given variants.
function boundsOf(variants) {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const v of variants) {
    const [, , w, h] = rect(v.sprite);
    l = Math.min(l, -v.rx); t = Math.min(t, -v.ry);
    r = Math.max(r, -v.rx + w); b = Math.max(b, -v.ry + h);
  }
  return { l, t, r, b };
}

// The box every standing build fits in, whatever its parts, facing or feet
// special. It stays put while parts are picked, and a walk turns about its
// middle; the box the figure is scaled to fit also has room for its moves
// (see moveBox).
const fitBounds = Object.fromEntries(Object.keys(LABEL).map(kind => {
  const ch = S.characters[kind];
  const all = [];
  const add = v => {
    all.push(v);
    if (v.back) all.push(v.back);
    if (v.frames) all.push(v.frames.blink, ...v.frames.glance);
    if (v.facings) Object.values(v.facings).forEach(add);
    for (const more of [v.special, v.units]) if (more) more.forEach(add);
  };
  for (const p of ch.parts) p.variants.concat(ch.borrowed[p.name] || []).forEach(add);
  const body = ch.parts.find(p => p.name === 'body').variants[0];
  for (const b of [body].concat(Object.values(body.facings || {}))) S.hats.forEach((_, k) => all.push(...hatOn(b, k)));
  return [kind, boundsOf(all)];
}));

// A bad size here does not throw - a canvas sized NaN is simply empty - so
// check, and fail loudly instead of drawing nothing.
for (const [kind, bb] of Object.entries(fitBounds)) {
  if (![bb.l, bb.t, bb.r, bb.b].every(Number.isFinite)) throw new Error('bad preview bounds for ' + kind);
}

// The box a build's parts cover in a pose, from the REGS origin, counting
// the pose's move (dx, dy) and each part's lift.
function drawnBounds(kind, build, pose = REST, seat = null) {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const v of variantsFor(kind, build, pose, seat)) {
    const [, , w, h] = rect(v.sprite), x = pose.dx - v.rx, y = pose.dy + (v.oy || 0) - v.ry;
    l = Math.min(l, x); t = Math.min(t, y); r = Math.max(r, x + w); b = Math.max(b, y + h);
  }
  return { l, t, r, b };
}

// The box every move fits in: the standing box grown by as far as any
// build's walks, special or idles take it past that build's own standing
// box - a spring's bounce 30px up, borrowed rockets' flame 42px behind -
// and by the same on both sides, as a walk may be mirrored. Scaled to the
// standing box alone, the figure was bigger, but bounces went out of the
// top of the window; Sam would rather it smaller and whole. It is one box
// per character, fitting every build, so the figure never changes size as
// parts are picked - Sam's choice over a box per pair of feet, which kept
// most of them bigger but resized the figure when the feet changed. A hat
// sits on the hair, so a sundae on a quiff's tip stands far above any hat on
// a bare head: the box also takes in, as they are, every hat on every hair
// through every move - Sam's choice, to grow the box rather than settle a
// tall hat lower or cut it off. Worked out once per character, when first
// shown (every pair of feet with every hair, each distinct tick once, and
// every hat, in each of its frames and, standing, each tick of its own
// idles, placed on what each of those ticks puts it on). A hat arriving -
// mud falling, an acorn dropping - comes in from above, and is let go past
// the top on the way.
const moveBoxes = {};
function moveBox(kind) {
  if (moveBoxes[kind]) return moveBoxes[kind];
  const fb = fitBounds[kind];
  const picks = [0, 1, 2, 3, 4].flatMap(v => [{ v, borrowed: false }, { v, borrowed: true }]);
  let top = 0, bottom = 0, side = 0;
  const hatted = { l: Infinity, t: Infinity, r: -Infinity, b: -Infinity };
  // each hat's distinct ticks standing (at rest, and its idles) and walking
  // (its wobble, its back)
  const distinct = ticks => [...new Map(ticks.map(t => [t.join(), t])).values()];
  const hatTicks = S.hats.map(h => [
    distinct([[0, 0, 0]].concat((h.anims || []).filter(a => a.kind === 'idle').flatMap(a => a.ticks))),
    distinct([0].concat(h.walk || [], h.away === undefined ? [] : [h.away]).map(i => [i, 0, 0]))]);
  for (const feet of picks) {
    for (const hair of picks.concat([{ ...NONE }])) {
      const build = { hair, feet, eyes: { v: 0, borrowed: false }, nose: { v: 0, borrowed: false } };
      const own = drawnBounds(kind, build);
      const walk = walkOf(kind, build), special = specialOf(kind, build);
      const clips = walk.dirs.map((ticks, d) => ({ ticks, walk: true, faces: facesAt(walk.faces, d) }))
        .concat(idlesOf(kind).concat(special ? [special] : []).map(ticks => ({ ticks, walk: false })));
      for (const c of clips) {
        const seen = new Set();
        for (const t of c.ticks) {
          const key = t.join();
          if (seen.has(key)) continue;
          seen.add(key);
          const pose = poseAt(c, t), seat = {};
          const bb = drawnBounds(kind, build, pose, seat);
          // where each hat goes on it, a walk mirrored too
          const mid = (fb.l + fb.r) / 2;
          hatTicks.forEach((ticks, k) => {
            for (const v of ticks[c.walk ? 1 : 0].flatMap(t => hatOn(seat.body, k, seat.hair, Object.assign({}, pose, { hat: t })))) {
              const [, , w, h] = rect(v.sprite), x = pose.dx - v.rx, y = pose.dy - v.ry;
              hatted.t = Math.min(hatted.t, y); hatted.b = Math.max(hatted.b, y + h);
              hatted.l = Math.min(hatted.l, x, 2 * mid - x - w); hatted.r = Math.max(hatted.r, x + w, 2 * mid - x);
            }
          });
          if (hair.none) continue;
          top = Math.max(top, own.t - bb.t);
          bottom = Math.max(bottom, bb.b - own.b);
          side = Math.max(side, own.l - bb.l, bb.r - own.r);
        }
      }
    }
  }
  return (moveBoxes[kind] = { l: Math.min(fb.l - side, hatted.l), r: Math.max(fb.r + side, hatted.r),
                              t: Math.min(fb.t - top, hatted.t), b: Math.max(fb.b + bottom, hatted.b) });
}

// Draw with the REGS origin at (ox, oy), mirrored about `axis` if set.
function drawCharacter(ctx, kind, build, ox, oy, scale = 1, pose = REST, axis = null) {
  for (const v of variantsFor(kind, build, pose)) {
    const src = v.part ? recoloured(v.sprite, kind, build.skin, groupsOf(kind, build, v.part), (build.colours || {})[v.part], v.part)
      : recoloured(v.sprite, kind, build.skin);
    drawSprite(ctx, v.sprite, ox - v.rx * scale, oy + ((v.oy || 0) - v.ry) * scale, scale, axis, src);
  }
}

const wrap = document.getElementById('preview-wrap');
const preview = document.getElementById('preview');
const pose = Object.assign({}, REST);       // the idle's current tick

let origin = { x: 0, y: 0 };                 // where the REGS origin sits on the canvas
let heading = null;                          // 'left' or 'right' once it has walked

// The figure turns by being mirrored about the middle of its standing box -
// the atlas's own mirrored frames are exact mirrors - so it stays in the same
// place in the panel. It is mirrored whenever the frames being drawn face the
// other way from where it is heading (the character's `faces`): a Fleen
// stands facing left but hops to the right, so it is mirrored to hop left,
// and after hopping right it stands mirrored, facing right.
function drawPreview() {
  const ctx = preview.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, preview.width, preview.height);
  if (sheet.complete) {
    const bb = fitBounds[state.kind];
    const drawn = pose.walk ? pose.faces : S.characters[state.kind].faces.rest;
    const axis = heading && heading !== drawn ? origin.x + (bb.l + bb.r) / 2 : null;
    drawCharacter(ctx, state.kind, state.build[state.kind],
                  origin.x + pose.dx, origin.y + pose.dy, 1, pose, axis);
  }
}

// The canvas fills the panel, at the largest whole-number scale at which the
// box of every move fits (moveBox), with that box in its middle - but never
// below the game's own size, 1 CSS pixel a pixel: in a window too small for
// that, the edges are cut off instead. Its height comes from the window, never from the
// panel's own, which grows with the canvas and would feed back into itself:
// on a desktop most of the window; on a phone, whatever the header, buttons
// and tiles leave of it - everything else's height, measured without the
// canvas, is the same whatever the canvas's - so the open tab is on screen
// with the character, with no scrolling.
//
// The scale is whole screen pixels per source pixel, not whole CSS pixels:
// on a phone at 3x, 2x CSS and 3x CSS are 6 and 9 of its pixels, and
// stepping by one of them in between (2 1/3x, 2 2/3x) lets the character
// fill its window rather than drop to the smaller whole number.
// The window's height without its browser bars (CSS svh): on a phone the
// address bar comes and goes as the page scrolls, and sizing from
// innerHeight would resize the pinned character mid-scroll.
const svh = document.createElement('div');
svh.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100svh;visibility:hidden;pointer-events:none';
document.body.appendChild(svh);
const viewHeight = () => svh.offsetHeight || window.innerHeight;

function layoutPreview() {
  layoutTiles();
  const cs = getComputedStyle(wrap);
  const availW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const narrow = window.matchMedia('(max-width: 900px)').matches;
  const others = document.querySelector('main').getBoundingClientRect().bottom + window.scrollY
    - preview.getBoundingClientRect().height + 10;
  const availH = narrow ? Math.max(90, viewHeight() - others)
    : Math.max(260, Math.min(560, viewHeight() - 280));
  const bb = moveBox(state.kind);
  const fw = bb.r - bb.l + PAD * 2, fh = bb.b - bb.t + PAD * 2;
  const dpr = window.devicePixelRatio || 1;
  const scale = Math.max(dpr, Math.floor(Math.min(availW / fw, availH / fh) * dpr)) / dpr;
  const w = Math.max(fw, Math.floor(availW / scale)), h = Math.max(fh, Math.floor(availH / scale));
  if (preview.width !== w || preview.height !== h) { preview.width = w; preview.height = h; }
  preview.style.width = w * scale + 'px';
  preview.style.height = h * scale + 'px';
  origin = { x: Math.floor((w - (bb.r - bb.l)) / 2) - bb.l,
             y: Math.floor((h - (bb.b - bb.t)) / 2) - bb.t };
  drawPreview();
}
new ResizeObserver(layoutPreview).observe(wrap);
window.addEventListener('resize', layoutPreview);

// The tiles likewise: a whole number of screen pixels per pixel of the
// game's 40 x 43 tile, as big as a line of five and none fits across the
// box, up to 2x - and on a phone no more than about a quarter of the
// screen's height for both lines, so a phone held sideways keeps some
// window. Only the box's width and the screen's height go in, never the
// window's, so this cannot feed back into layoutPreview.
function layoutTiles() {
  const box = document.querySelector('.box');
  const cs = getComputedStyle(box);
  const gap = parseFloat(cs.getPropertyValue('--set-gap'));
  const noneGap = parseFloat(cs.getPropertyValue('--none-gap'));
  let fit = (rowsEl.clientWidth - 4 * gap - noneGap) / 6;
  if (window.matchMedia('(max-width: 900px)').matches) fit = Math.min(fit, viewHeight() * 0.115);
  const dpr = window.devicePixelRatio || 1;
  const n = Math.min(2 * dpr, Math.max(1, Math.floor(fit * dpr / 40)));
  box.style.setProperty('--tile', n * 40 / dpr + 'px');
}

function paintTile(canvas, index) {
  const [, , w, h] = rect(index);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, w, h);
  drawSprite(ctx, index, 0, 0);
}

// ---- the feature box ---------------------------------------------------

const rowsEl = document.getElementById('rows');
let tiles = {};                          // row -> [{b, v, kind}], with its none, colours and lock
const el = (tag, cls) => Object.assign(document.createElement(tag), cls ? { className: cls } : {});

// The part a build shows for a row: the variant entry, whose `groups` are
// the colours its pickers change (see colour_groups() in the exporter) - or
// null for none.
function partOf(kind, build, feat) {
  if (feat === 'hat') return build.hat === undefined ? null : S.hats[build.hat];
  const pick = build[feat];
  if (!pick || pick.none) return null;
  const ch = S.characters[kind];
  const part = ch.parts.find(p => p.name === feat);
  return part.variants.length === 1 ? part.variants[0] : pick.borrowed ? ch.borrowed[feat][pick.v] : part.variants[pick.v];
}
const groupsOf = (kind, build, feat) => (partOf(kind, build, feat) || {}).groups || [];
const colourPick = (build, feat, k) => feat === 'body' ? build.skin : ((build.colours || {})[feat] || [])[k];
// A colour the same as the part's own is no colour: it is left out of the
// build, and of the link.
function setColour(feat, k, value) {
  const build = state.build[state.kind];
  value = value.toLowerCase();
  if (feat === 'body') { build.skin = value === NATURAL_SKIN[state.kind] ? undefined : value; return; }
  const own = (groupsOf(state.kind, build, feat)[k] || {}).ref;
  build.colours = Object.assign({}, build.colours);
  (build.colours[feat] = (build.colours[feat] || []).slice())[k] = value === '#' + own ? undefined : value;
}
// a new pick comes in its own colours
function resetColours(feat) {
  const build = state.build[state.kind];
  if (feat === 'body') build.skin = undefined;
  else if (build.colours) { build.colours = Object.assign({}, build.colours); delete build.colours[feat]; }
}

const nameOf = (feat, pick) => pick.none ? 'no ' + feat
  : S.characters[pick.borrowed ? OTHER[state.kind] : state.kind].names[feat][pick.v];

// Built once: a tab for the body, each feature and the hats, and a panel
// for each - the Zoombini's tiles over the Fleen's, none as a tile of its
// own beside them, and under them the part's plaques: a colour for each of
// the picked part's colours and the lock that keeps it when the dice rolls.
// A pick is kept as {v, borrowed} against the body (see state), so a tile's
// pick depends on the body.
const ROWS = ['body'].concat(FEATURES, ['hat']);
const KINDS = ['zoombini', 'fleen'];
// The Fleen's tiles in the order of the Zoombini's they match, each under
// its own - Sam's pairing: Shaggy over Grass tuft, One eye over Stacked
// eyes, Red over the grey nose, the spring over the red shoes, and so on.
// Only the tiles move: a tile keeps its part's number, and the game's
// numbers are what links and the dice use.
const FLEEN_ORDER = { hair: [1, 0, 2, 3, 4], eyes: [0, 2, 1, 3, 4], nose: [2, 1, 0, 4, 3], feet: [0, 3, 1, 2, 4] };
const titled = s => s[0].toUpperCase() + s.slice(1);
// Pixel icons: '#' outline, 'o' face. The lock is a padlock whose body is a
// die, shut to keep the part when the dice rolls and open to let it roll.
const ICONS = {
  keep: ['....####....', '...#....#...', '..#......#..', '..#......#..', '############', '#oooooooooo#',
         '#o##ooooooo#', '#o##ooooooo#', '#oooo##oooo#', '#oooo##oooo#', '#ooooooo##o#', '#ooooooo##o#',
         '############'],
  roll: ['..####......', '.#....#.....', '.#....#.....', '.#..........', '############', '#oooooooooo#',
         '#o##ooooooo#', '#o##ooooooo#', '#oooo##oooo#', '#oooo##oooo#', '#ooooooo##o#', '#ooooooo##o#',
         '############'],
  none: ['##.......##', '###.....###', '.###...###.', '..###.###..', '...#####...', '....###....',
         '...#####...', '..###.###..', '.###...###.', '###.....###', '##.......##'],
  // a drop of paint: 'o' is the colour picked
  colour: ['....#....', '...#o#...', '...#o#...', '..#ooo#..', '.#ooooo#.', '#ooooooo#', '#ooooooo#',
           '#ooooooo#', '.#ooooo#.', '..#####..'],
  pause: ['####.####', '#oo#.#oo#', '#oo#.#oo#', '#oo#.#oo#', '#oo#.#oo#', '#oo#.#oo#', '#oo#.#oo#',
          '#oo#.#oo#', '####.####'],
  play: ['##.......', '#o##.....', '#ooo##...', '#ooooo##.', '#ooooooo#', '#ooooo##.', '#ooo##...',
         '#o##.....', '##.......'],
};
function drawIcon(ctx, icon, on, fill, x0 = 0, y0 = 0, scale = 1) {
  ICONS[icon].forEach((row, y) => [...row].forEach((c, x) => {
    if (c === '.') return;
    ctx.fillStyle = c === '#' ? (on ? '#4a1d08' : '#111') : fill || (on ? '#ce8431' : '#c0c0c0');
    ctx.fillRect(x0 + x * scale, y0 + y * scale, scale, scale);
  }));
}
// With `shown` set, the icon is also sized to that many CSS pixels a pixel.
function paintIcon(canvas, icon, on, fill = null, shown = 0) {
  const rows = ICONS[icon];
  canvas.width = rows[0].length;
  canvas.height = rows.length;
  if (shown) { canvas.style.width = canvas.width * shown + 'px'; canvas.style.height = canvas.height * shown + 'px'; }
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawIcon(ctx, icon, on, fill);
}
// None's tile: a blank one of the game's, with a cross on it at 2x, moved
// when pressed as a figure is on the game's own tiles.
function paintNone(canvas, on) {
  paintTile(canvas, S.controls.blank[on ? 1 : 0]);
  const ctx = canvas.getContext('2d');
  const size = ICONS.none.length * 2;
  drawIcon(ctx, 'none', on, null, Math.floor((canvas.width - size) / 2) - (on ? 2 : 0),
           Math.floor((canvas.height - size) / 2) + (on ? 1 : 0), 2);
}
// A colour plaque: the paint drop in the colour it holds and a word, over
// the browser's colour picker. Its word is set as it is painted: "Colour",
// or "Colour 1" and "Colour 2" for a part with two.
function colourPlaque(onPick) {
  const b = el('label', 'stone ctrl');
  const input = el('input');
  input.type = 'color';
  input.addEventListener('input', () => onPick(input.value));
  b.append(el('canvas'), el('span'), input);
  return b;
}
function tileButton(label, onClick) {
  const b = el('button', 'tile');
  b.title = label;
  b.setAttribute('aria-label', label);
  b.appendChild(el('canvas'));
  b.addEventListener('click', onClick);
  return b;
}

const tabsEl = document.getElementById('tabs');
const tabs = {};                          // row -> its tab, with a padlock that shows when it is kept
let openRow = 'body';

function buildTiles() {
  rowsEl.textContent = '';
  tabsEl.textContent = '';
  tiles = {};
  for (const feat of ROWS) {
    const Feat = titled(feat);
    const tab = tabs[feat] = el('button', 'stone tab');
    tab.id = 'tab-' + feat;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-controls', 'panel-' + feat);
    const word = el('span');
    word.textContent = Feat;
    tab.kept = el('canvas');
    tab.kept.title = 'Kept when the dice rolls';
    paintIcon(tab.kept, 'keep', false);
    tab.append(word, tab.kept);
    tab.addEventListener('click', () => openTab(feat));
    tabsEl.appendChild(tab);

    const panel = el('div', 'feature' + (feat === 'body' ? ' body' : ''));
    panel.id = 'panel-' + feat;
    panel.setAttribute('role', 'tabpanel');
    panel.setAttribute('aria-labelledby', tab.id);
    const t = tiles[feat] = [];
    t.panel = panel;
    const tilesEl = el('div', 'tiles'), sets = el('div', 'sets');
    if (feat === 'hat') {
      // the hats on the body that is picked: Pizza Pass's on one line, the
      // ones from elsewhere on the next
      let set = null;
      const pizza = hat => hat.place === 'Pizza Pass';
      S.hats.forEach((hat, v) => {
        if (!v || pizza(hat) !== pizza(S.hats[v - 1])) {
          set = el('div', 'set');
          sets.appendChild(set);
        }
        const b = tileButton(titled(hat.name) + ' (from ' + hat.place + ')', () => {
          state.build[state.kind].hat = v;
          resetColours('hat');
          // mud falls into place, an acorn drops - from its first tick, so
          // the hat is not seen already there
          const [arrive] = hatClips(state.build[state.kind], 'arrive');
          if (arrive && !paused) {
            startClip(arrive);
            Object.assign(pose, poseAt(arrive, arrive.ticks[0]));
          }
          update();
        });
        set.appendChild(b);
        t.push({ b, v });
      });
    } else {
      for (const kind of KINDS) {
        const set = el('div', 'set');
        const order = kind === 'fleen' && FLEEN_ORDER[feat] || S.characters[kind].buttons[feat].map((_, v) => v);
        order.forEach(v => {
          const name = feat === 'body' ? LABEL[kind] : S.characters[kind].names[feat][v] + ' (' + LABEL[kind] + ')';
          const b = tileButton(name, () => {
            // a tile is that part as it comes, its own colours too
            if (feat === 'body') setBody(kind);
            else state.build[state.kind][feat] = { v, borrowed: kind !== state.kind };
            resetColours(feat);
            endClip();
            update();
          });
          set.appendChild(b);
          t.push({ b, v, kind });
        });
        sets.appendChild(set);
      }
    }
    tilesEl.appendChild(sets);
    // none, as a tile of its own (the body has none)
    if (feat !== 'body') {
      t.none = tileButton(feat === 'hat' ? 'No hat' : 'No ' + feat, () => {
        if (feat === 'hat') state.build[state.kind].hat = undefined;
        else state.build[state.kind][feat] = { ...NONE };
        resetColours(feat);
        endClip();
        update();
      });
      tilesEl.appendChild(t.none);
    }
    const controls = el('div', 'controls');
    t.colours = [0, 1].map(k => {
      const c = colourPlaque(value => { setColour(feat, k, value); update(); });
      controls.appendChild(c);
      return c;
    });
    controls.appendChild(el('div', 'spacer'));
    if (feat !== 'hat') {
      // a hat is left alone when the dice rolls, and has no lock
      t.lock = el('button', 'stone ctrl');
      t.lock.title = 'Keep this ' + feat + ' when the dice rolls';
      const keep = el('span');
      keep.textContent = 'Keep';
      t.lock.append(el('canvas'), keep);
      t.lock.addEventListener('click', () => {
        locks[feat] = !locks[feat];
        paintTiles();
      });
      controls.appendChild(t.lock);
    }
    panel.append(tilesEl, controls);
    rowsEl.appendChild(panel);
  }
  openTab(openRow);
}

// The closed panels are only invisible (see .panels), which also takes
// their tiles out of the tab order; the tabs themselves are one stop, moved
// along with the arrow keys, as tabs are.
function openTab(feat, focus = false) {
  openRow = feat;
  for (const f of ROWS) {
    const on = f === feat;
    tabs[f].setAttribute('aria-selected', on);
    tabs[f].tabIndex = on ? 0 : -1;
    tiles[f].panel.classList.toggle('open', on);
  }
  if (focus) tabs[feat].focus();
}
tabsEl.addEventListener('keydown', e => {
  const i = ROWS.indexOf(openRow);
  const to = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: ROWS.length - 1 }[e.key];
  if (to === undefined) return;
  e.preventDefault();
  openTab(ROWS[(to + ROWS.length) % ROWS.length], true);
});

// The whole character becomes the other one's body, every feature staying
// what it was - a Fleen's hair on a Zoombini is that Fleen's own hair on a
// Fleen - and so do its colours, its hat and its name.
function setBody(kind) {
  if (kind === state.kind) return;
  const old = state.kind;
  state.build[kind] = Object.fromEntries(FEATURES.map(f => {
    const pick = state.build[old][f];
    return [f, pick.none ? pick : { v: pick.v, borrowed: (pick.borrowed ? OTHER[old] : old) !== kind }];
  }));
  state.build[kind].skin = state.build[old].skin;
  state.build[kind].colours = state.build[old].colours;
  state.build[kind].hat = state.build[old].hat;
  state.name[kind] = state.name[old];
  state.kind = kind;
  heading = null;
}

function paintTiles() {
  const build = state.build[state.kind];
  for (const feat of ROWS) {
    const t = tiles[feat], pick = build[feat] || {};
    for (const x of t) {
      const on = feat === 'hat' ? build.hat === x.v
        : !pick.none && (feat === 'body' ? x.kind === state.kind
          : pick.v === x.v && (pick.borrowed ? OTHER[state.kind] : state.kind) === x.kind);
      x.b.setAttribute('aria-pressed', on);
      paintTile(x.b.firstChild, feat === 'hat' ? S.characters[state.kind].buttons.hat[x.v][on ? 1 : 0]
        : S.characters[x.kind].buttons[feat][x.v][on ? 1 : 0]);
    }
    if (t.none) {
      const on = feat === 'hat' ? build.hat === undefined : !!pick.none;
      t.none.setAttribute('aria-pressed', on);
      paintNone(t.none.firstChild, on);
    }
    const groups = feat === 'body' ? [{ ref: NATURAL_SKIN[state.kind].slice(1) }] : groupsOf(state.kind, build, feat);
    t.colours.forEach((c, k) => {
      c.hidden = k >= groups.length;
      if (c.hidden) return;
      const hex = colourPick(build, feat, k) || '#' + groups[k].ref;
      const word = feat === 'body' ? 'Skin' : groups.length > 1 ? 'Colour ' + (k + 1) : 'Colour';
      const label = feat === 'body' ? 'Skin colour' : titled(feat) + ' ' + word.toLowerCase();
      c.querySelector('span').textContent = word;
      c.title = label;
      const input = c.querySelector('input');
      input.setAttribute('aria-label', label);
      input.value = hex;
      paintIcon(c.firstChild, 'colour', false, hex, 2);
    });
    if (t.lock) {
      t.lock.setAttribute('aria-pressed', locks[feat]);
      paintIcon(t.lock.firstChild, locks[feat] ? 'keep' : 'roll', locks[feat], null, 2);
    }
    tabs[feat].kept.hidden = !locks[feat];
  }
}

// ---- the page's own stone -----------------------------------------------

// The rock round the tiles and the window, for the stylesheet: speckled here
// from the builder's rock colours, as its painted rock would not repeat.
function rockURL() {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#312929';
  ctx.fillRect(0, 0, 32, 32);
  let seed = 7;
  const next = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const specks = [['#211818', 0.3], ['#393131', 0.15], ['#423942', 0.1], ['#311821', 0.1]];
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 32; x++) {
      let r = next();
      for (const [colour, share] of specks) {
        if (r < share) { ctx.fillStyle = colour; ctx.fillRect(x, y, 1, 1); break; }
        r -= share;
      }
    }
  }
  return c.toDataURL();
}
function dressPage() {
  document.documentElement.style.setProperty('--rock-img', `url(${rockURL()})`);
}

// The dice shows its pressed art while held, as in the game.
const dice = document.getElementById('btn-random');
let diceHeld = false;
function paintDice() { paintTile(dice.firstChild, S.controls.random[diceHeld ? 1 : 0]); }
dice.addEventListener('pointerdown', () => { diceHeld = true; paintDice(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) {
  dice.addEventListener(ev, () => { if (diceHeld) { diceHeld = false; paintDice(); } });
}
dice.addEventListener('click', () => {
  if (!locks.body) {
    setBody(KINDS[Math.floor(Math.random() * 2)]);
    state.build[state.kind].skin = undefined;
  }
  const fresh = randomBuild();
  for (const f of FEATURES) if (!locks[f]) { state.build[state.kind][f] = fresh[f]; resetColours(f); }
  state.name[state.kind] = makeName();
  endClip();
  update();
});
const pureBtn = document.getElementById('btn-pure');
pureBtn.addEventListener('click', () => {
  pure = !pure;
  pureBtn.setAttribute('aria-pressed', pure);
});
document.getElementById('btn-name').addEventListener('click', () => {

// ---- idling ------------------------------------------------------------

// Stand still for a while, then play one of the character's idle clips,
// then stand still again - as the game's characters do between moves. A
// Zoombini in its own feet sometimes shows them off (its feet's special); so
// does a Fleen standing on a Zoombini spring, wheels or propeller, which plays
// the same feet frames and keeps its own head still. Fleen idles never blink,
// so they get a blink of the page's own.
const PAGE_BLINK = [[1, 0, 0, 0, -1], [1, 0, 0, 0, -1]];
const SPECIAL_WEIGHT = 3;                    // shown off about a quarter of the time
const WALK_WEIGHT = 3;                       // and walking about as often
const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
let paused = motionQuery.matches;
let clip = null, clipAt = 0, waitTicks = 15, timer = 0;

// A build's moves. Idle ticks are [eyes, dx, dy, facing, feet]; walk ticks
// are as described at WALK_PARTS.
const idlesOf = kind => kind === 'fleen' ? S.characters.fleen.idles.concat([PAGE_BLINK]) : S.characters[kind].idles;
// Whether its feet show off without a break: a Fleen sat down into Zoombini
// wheels while they turn (its special frames' `drop`) stood up on top of
// them again at rest, a jump each time; so on them it keeps turning (Sam,
// 30 September 2026), and stands at rest only when paused.
const loopsSpecial = (kind, build) => kind === 'fleen' && build.feet.borrowed && !build.feet.none
  && (S.characters.fleen.borrowed.feet[build.feet.v].special || []).some(f => f.drop);
// The ticks its feet show off in, or null.
function specialOf(kind, build) {
  const ch = S.characters[kind], feet = build.feet;
  if (kind === 'zoombini' && !feet.borrowed && !feet.none) return ch.specials[feet.v];
  if (kind === 'fleen' && feet.borrowed && ch.borrowed.feet[feet.v].special) {
    // the Fleen's head stays put; the special's opening tick, which faces a
    // Zoombini (and its device) towards the viewer, is left out
    // (a frame's `drop` sits the Fleen that much further down into it -
    // into the wheels - the frame itself raised as much, so it stays put)
    const frames = ch.borrowed.feet[feet.v].special;
    return S.characters.zoombini.specials[feet.v]
      .filter(t => t[3] !== 1).map(([, dx, dy, , f]) => [0, dx, dy + ((frames[f] || {}).drop || 0), 0, f]);
  }
  return null;
}
// Its walk: a clip per direction, and which way their frames face.
function walkOf(kind, build) {
  const ch = S.characters[kind], feet = build.feet;
  return { dirs: (feet.borrowed ? ch.walks.borrowedFeet : ch.walks.own)[feet.v],
           faces: ch.faces[feet.borrowed ? 'borrowedFeet' : 'own'] };
}
// The pose a clip's tick puts the figure in. A hat's own clip (`hat`) moves
// only the hat: its ticks are [set, dx, dy].
const poseAt = (clip, t) => clip.walk
  ? Object.assign({}, REST, { walk: t, dx: t[0], dy: t[1], faces: clip.faces })
  : clip.hat ? Object.assign({}, REST, { hat: t })
  : Object.assign({}, REST, { eyes: t[0], dx: t[1], dy: t[2], facing: t[3], feet: t[4] });
// A hat's animations of a kind - 'idle' (now and then) or 'arrive' (when
// picked) - as clips.
const hatClips = (build, kind) => ((S.hats[build.hat] || {}).anims || [])
  .filter(a => a.kind === kind).map(a => ({ ticks: a.ticks, walk: false, hat: true }));

// Clips are {ticks, walk} or {dirs, walk}, a walk with a clip per direction;
// a direction, and left or right, is picked as it starts.
function clipsFor(kind) {
  const build = state.build[kind];
  const clips = idlesOf(kind).concat(kind === 'fleen' ? [PAGE_BLINK] : []);
  const special = specialOf(kind, build);
  for (let i = 0; special && i < SPECIAL_WEIGHT; i++) clips.push(special);
  const out = clips.map(ticks => ({ ticks, walk: false }));
  const walk = walkOf(kind, build);
  for (let i = 0; i < WALK_WEIGHT; i++) out.push({ dirs: walk.dirs, walk: true, faces: walk.faces });
  return out;
}

// A hat's own idles - a woodpecker pecking, a toad breathing - keep their
// own time, every few seconds, whatever the character's idles are doing; a
// walk, or a hat arriving, stops them. Drawn at random among the
// character's own idles, they came round so seldom that Sam saw no pecking.
let hatClip = null, hatAt = 0, hatWait = 10;
function hatTick() {
  if (clip && (clip.walk || clip.hat)) { hatClip = null; return; }
  if (!hatClip && --hatWait <= 0) {
    const clips = hatClips(state.build[state.kind], 'idle');
    hatWait = 15 + Math.floor(Math.random() * 30);
    if (clips.length) { hatClip = clips[Math.floor(Math.random() * clips.length)]; hatAt = 0; }
  }
  if (hatClip) {
    pose.hat = hatClip.ticks[hatAt];
    if (++hatAt >= hatClip.ticks.length) hatClip = null;
  }
}

function tick() {
  if (clip) {
    Object.assign(pose, poseAt(clip, clip.ticks[clipAt]), { n: clipAt });
    if (++clipAt >= clip.ticks.length) { clip = null; waitTicks = 15 + Math.floor(Math.random() * 30); }
  } else if (paused) {
    // paused, a walk asked for by an arrow has played: stop again
    clearInterval(timer);
    timer = 0;
    Object.assign(pose, REST);
  } else if (loopsSpecial(state.kind, state.build[state.kind])) {
    // straight into the next turn, with no rest frame between
    startClip({ ticks: specialOf(state.kind, state.build[state.kind]), walk: false });
    Object.assign(pose, poseAt(clip, clip.ticks[0]), { n: 0 });
    clipAt = 1;
  } else {
    Object.assign(pose, REST);
    if (--waitTicks <= 0) {
      const clips = clipsFor(state.kind);
      startClip(clips[Math.floor(Math.random() * clips.length)]);
    }
  }
  hatTick();
  drawPreview();
}

// A clip belongs to the build it started on - a special is one pair of
// feet's - so a new pick ends it and returns to the rest pose.
function startClip(c) {
  if (c.dirs) {
    clip = walkClip(state.kind, c, Math.floor(Math.random() * c.dirs.length));
    heading = Math.random() < 0.5 ? 'left' : 'right';
  } else {
    clip = c;
  }
  clipAt = 0;
}

function endClip() {
  if (!clip) return;
  clip = null;
  Object.assign(pose, REST);
  waitTicks = 15;
}

function setPaused(p) {
  paused = p;
  clearInterval(timer);
  timer = 0;
  clip = null;
  Object.assign(pose, REST);
  if (!paused) { waitTicks = 8; timer = setInterval(halfTick, TICK_MS / 2); }
  // the button shows what a press does: pause, or, held in, play
  const btn = document.getElementById('btn-motion');
  paintIcon(btn.firstChild, paused ? 'play' : 'pause', paused);
  btn.title = paused ? 'Play' : 'Pause';
  btn.setAttribute('aria-label', 'Pause');
  btn.setAttribute('aria-pressed', paused);
  drawPreview();
}
document.getElementById('btn-motion').addEventListener('click', () => setPaused(!paused));

// The arrows (and the arrow keys, outside the tabs and the Save list): the
// character walks that way now, and stands facing that way after. Each way
// is [the walk's direction, left or right or null for as it is]. What a
// character can do is down to its feet. A Zoombini walks along, towards us
// and away. A Fleen on its own feet hops towards us on the slant and runs
// away on the slant, so its arrows are the four diagonals; in Zoombini
// shoes it also walks along, so it gets left and right besides; riding a
// Zoombini device it only goes along. A Fleen's arrow keys go left or right
// and, whichever way it faces, away (up) or towards us (down). Paused, the
// walk plays once.
function waysOf(kind, build) {
  const n = walkOf(kind, build).dirs.length;
  if (kind === 'zoombini') return { left: [2, 'left'], right: [2, 'right'], down: [0, null], up: [3, null] };
  if (n === 1) return { left: [0, 'left'], right: [0, 'right'] };
  const [along, away, towards] = n === 3 ? [0, 1, 2] : [0, 1, 0];
  return { downleft: [towards, 'left'], downright: [towards, 'right'], upleft: [away, 'left'], upright: [away, 'right'],
           left: [along, 'left'], right: [along, 'right'], down: [towards, null], up: [away, null] };
}
function walkWay(way) {
  const kind = state.kind, build = state.build[kind], walk = walkOf(kind, build);
  const [d, side] = waysOf(kind, build)[way] || [];
  if (d === undefined || !walk.dirs[d]) return;
  heading = side || heading || S.characters[kind].faces.rest;
  clip = walkClip(kind, walk, d);
  clipAt = 0;
  if (paused && !timer) timer = setInterval(halfTick, TICK_MS / 2);
}
function updatePad() {
  const kind = state.kind, build = state.build[kind], ways = waysOf(kind, build);
  // a Fleen's up and down are keys only; its left and right are buttons
  // only where it walks along (in Zoombini shoes, or riding)
  const shown = kind === 'zoombini' ? ways
    : Object.fromEntries(Object.entries(ways).filter(([way]) => way !== 'up' && way !== 'down'
        && !((way === 'left' || way === 'right') && walkOf(kind, build).dirs.length === 2)));
  for (const b of document.querySelectorAll('#pad button')) b.hidden = !(b.dataset.way in shown);
}
document.getElementById('pad').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) walkWay(b.dataset.way);
});
document.addEventListener('keydown', e => {
  const way = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key];
  if (!way || e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target instanceof Element && e.target.closest('[role=tablist], [role=menu], input, textarea, select')) return;
  e.preventDefault();
  walkWay(way);
});
motionQuery.addEventListener('change', e => setPaused(e.matches));

// ---- saving and sharing ------------------------------------------------

const statusEl = document.getElementById('status');
let statusTimer = 0;
function say(text) {
  statusEl.textContent = text;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 2500);
}

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// The character alone at rest, cropped to its own outline, at 4x on
// transparency.
function savePicture() {
  const kind = state.kind, build = state.build[kind];
  const scale = 4, pad = 2 * scale;
  const parts = variantsFor(kind, build);
  if (!parts.length) { say('Nothing to save - every part is none.'); return; }
  const bb = boundsOf(parts);
  const c = document.createElement('canvas');
  c.width = (bb.r - bb.l) * scale + pad * 2;
  c.height = (bb.b - bb.t) * scale + pad * 2;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  drawCharacter(ctx, kind, build, pad - bb.l * scale, pad - bb.t * scale, scale);
  c.toBlob(blob => {
    if (!blob) { say('Could not make the PNG in this browser.'); return; }
    download(blob, state.name[kind] + '-' + kind + '.png');
  }, 'image/png');
}

// The animations a build can be saved as, each a list of poses a tick
// apart: its idles strung together with pauses between; its feet showing
// off, if they do; and its walk - a Zoombini's towards us, along and away
// (three of its five directions; the other two are near copies), a Fleen's
// hop and run away, or its ride on a Zoombini device.
function animationsFor(kind, build) {
  const rest = n => Array.from({ length: n }, () => REST);
  const idle = ticks => ticks.map(t => poseAt({ walk: false }, t));
  const out = [{ label: 'Looking around', poses: idlesOf(kind).flatMap(ticks => rest(5).concat(idle(ticks))).concat(rest(5)) }];
  const special = specialOf(kind, build);
  if (special) out.push({ label: 'Showing off its feet', poses: rest(5).concat(idle(special), rest(5)) });
  const walk = walkOf(kind, build);
  const names = kind === 'zoombini' ? { 0: 'Walking towards us', 2: 'Walking along', 3: 'Walking away' }
    : walk.dirs.length === 1 ? { 0: 'Riding along' }
    : walk.dirs.length === 3 ? { 0: 'Walking along', 2: 'Walking towards us', 1: 'Running away' }
    : { 0: 'Hopping along', 1: 'Running away' };
  for (const [d, label] of Object.entries(names)) {
    if (walk.dirs[d]) out.push({ label, fast: isFast(kind, walk, +d), poses: walk.dirs[d].map((t, n) => Object.assign(poseAt({ walk: true, faces: facesAt(walk.faces, +d) }, t), { n })) });
  }
  // the hat's own: a woodpecker pecking, mud landing
  for (const a of (S.hats[build.hat] || {}).anims || []) {
    const before = a.kind === 'arrive' ? rest(5).map(p => Object.assign({}, p, { hat: [-1, 0, 0] })) : rest(5);
    out.push({ label: a.label, poses: before.concat(a.ticks.map(t => poseAt({ hat: true }, t)), rest(a.kind === 'arrive' ? 10 : 5)) });
  }
  return out;
}

// ---- animated GIF ------------------------------------------------------

// GIF89a, written here rather than with a library, so saving works offline
// and from file:// like the rest of the page. One palette of the frames'
// own colours - the art has far fewer than the 255 a GIF allows beside its
// transparent entry 0 (past that, the rarest go to their nearest) - every
// frame the whole picture, cleared to transparency before the next
// (disposal 2), and looping for ever. A run of identical frames is written
// once, held for the run's time.
class Bytes {
  constructor() { this.a = new Uint8Array(1 << 16); this.n = 0; }
  push(...bs) { for (const b of bs) { if (this.n === this.a.length) this.grow(); this.a[this.n++] = b; } }
  grow() { const a = new Uint8Array(this.a.length * 2); a.set(this.a); this.a = a; }
  u16(v) { this.push(v & 255, v >> 8 & 255); }
  text(s) { for (const ch of s) this.push(ch.charCodeAt(0)); }
}

// LZW as GIF has it: variable-width codes from minSize + 1 bits to 12, a
// clear code when the table is full, packed low bit first and cut into
// sub-blocks of up to 255 bytes. The table is two flat arrays keyed by
// (prefix code, next index), stamped per run so a clear costs nothing.
let lzwCode = null, lzwStamp = null, lzwRun = 0;
function writeLZW(out, ix, minSize) {
  if (!lzwCode) { lzwCode = new Int16Array(4096 << 8); lzwStamp = new Int32Array(4096 << 8); }
  const clear = 1 << minSize, eoi = clear + 1;
  let size = minSize + 1, next = eoi + 1, run = ++lzwRun;
  const data = new Bytes();
  let acc = 0, bits = 0;
  const put = code => {
    acc |= code << bits;
    bits += size;
    while (bits >= 8) { data.push(acc & 255); acc >>>= 8; bits -= 8; }
  };
  put(clear);
  let cur = ix[0];
  for (let i = 1; i < ix.length; i++) {
    const k = ix[i], key = cur << 8 | k;
    if (lzwStamp[key] === run) { cur = lzwCode[key]; continue; }
    put(cur);
    if (next === 4096) {
      put(clear);
      next = eoi + 1; size = minSize + 1; run = ++lzwRun;
    } else {
      if (next >= 1 << size) size++;
      lzwCode[key] = next++;
      lzwStamp[key] = run;
    }
    cur = k;
  }
  put(cur);
  put(eoi);
  if (bits > 0) data.push(acc & 255);
  out.push(minSize);
  for (let i = 0; i < data.n; i += 255) {
    const len = Math.min(255, data.n - i);
    out.push(len);
    for (let j = 0; j < len; j++) out.push(data.a[i + j]);
  }
  out.push(0);
}

// frames: RGBA at 1x, w x h, `delay` hundredths of a second apart; written
// at `scale`, each pixel a scale x scale block.
function encodeGIF(frames, w, h, scale, delay) {
  const rgb = (f, i) => f[i * 4] << 16 | f[i * 4 + 1] << 8 | f[i * 4 + 2];
  const count = new Map();
  for (const f of frames) {
    for (let i = 0; i < w * h; i++) if (f[i * 4 + 3] >= 128) count.set(rgb(f, i), (count.get(rgb(f, i)) || 0) + 1);
  }
  let palette = [...count.keys()];
  if (palette.length > 255) palette = palette.sort((a, b) => count.get(b) - count.get(a)).slice(0, 255);
  const index = new Map(palette.map((c, k) => [c, k + 1]));
  const nearest = c => {
    if (index.has(c)) return index.get(c);
    let best = 1, bestD = Infinity;
    palette.forEach((p, k) => {
      const d = ((p >> 16) - (c >> 16)) ** 2 + ((p >> 8 & 255) - (c >> 8 & 255)) ** 2 + ((p & 255) - (c & 255)) ** 2;
      if (d < bestD) { bestD = d; best = k + 1; }
    });
    index.set(c, best);
    return best;
  };
  // each frame as palette indices, a run of the same one kept once
  const runs = [];
  for (const f of frames) {
    const ix = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) if (f[i * 4 + 3] >= 128) ix[i] = nearest(rgb(f, i));
    const last = runs[runs.length - 1];
    if (last && last.ix.every((v, i) => v === ix[i])) last.ticks++;
    else runs.push({ ix, ticks: 1 });
  }
  const bitsFor = Math.max(1, Math.ceil(Math.log2(palette.length + 1)));
  const W = w * scale, H = h * scale;
  const out = new Bytes();
  out.text('GIF89a');
  out.u16(W); out.u16(H);
  out.push(0x80 | (bitsFor - 1) << 4 | (bitsFor - 1), 0, 0);
  for (let k = 0; k < 1 << bitsFor; k++) {
    const c = k >= 1 && k <= palette.length ? palette[k - 1] : 0;
    out.push(c >> 16 & 255, c >> 8 & 255, c & 255);
  }
  out.push(0x21, 0xff, 11); out.text('NETSCAPE2.0'); out.push(3, 1, 0, 0, 0);
  const big = new Uint8Array(W * H);
  for (const r of runs) {
    out.push(0x21, 0xf9, 4, 2 << 2 | 1); out.u16(r.ticks * delay); out.push(0, 0);
    out.push(0x2c); out.u16(0); out.u16(0); out.u16(W); out.u16(H); out.push(0);
    for (let y = 0; y < H; y++) {
      const src = ((y / scale) | 0) * w, row = y * W;
      for (let x = 0; x < W; x++) big[row + x] = r.ix[src + ((x / scale) | 0)];
    }
    writeLZW(out, big, Math.max(2, bitsFor));
  }
  out.push(0x3b);
  return new Blob([out.a.subarray(0, out.n)], { type: 'image/gif' });
}

// An animation of the build as a GIF, at 4x like the picture: the frames
// drawn at 1x on a canvas just big enough for every one of them, facing the
// way the game's frames do.
function makeGIF(kind, build, anim) {
  const pad = 2;
  const U = { l: Infinity, t: Infinity, r: -Infinity, b: -Infinity };
  for (const p of anim.poses) {
    const bb = drawnBounds(kind, build, p);
    U.l = Math.min(U.l, bb.l); U.t = Math.min(U.t, bb.t); U.r = Math.max(U.r, bb.r); U.b = Math.max(U.b, bb.b);
  }
  if (!Number.isFinite(U.l)) return null;
  const w = U.r - U.l + pad * 2, h = U.b - U.t + pad * 2;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  const frames = anim.poses.map(p => {
    ctx.clearRect(0, 0, w, h);
    drawCharacter(ctx, kind, build, pad - U.l + p.dx, pad - U.t + p.dy, 1, p);
    return ctx.getImageData(0, 0, w, h).data;
  });
  return encodeGIF(frames, w, h, 4, Math.round((anim.fast ? TICK_MS / 2 : TICK_MS) / 10));
}

// A GIF picked from the Save list is made at once and shown in the window,
// looping, before it is saved: Save GIF downloads that same file, Back (or
// Escape, or any change to the character) puts the character back. It is
// shown at the window's scale - the GIF is 4x - or less, in whole screen
// pixels, if the window is too small for it and its buttons.
const gifPreview = document.getElementById('gif-preview');
const gifImg = document.getElementById('gif-img');
let gifShown = null;                         // { blob, url, filename } while one is shown
function previewGIF(anim) {
  const kind = state.kind, build = state.build[kind], name = state.name[kind];
  say('Making the GIF…');
  // let the words show before the work starts
  setTimeout(() => {
    const blob = makeGIF(kind, build, anim);
    if (!blob) { say('Nothing to save - every part is none.'); return; }
    closeGIF();
    const url = URL.createObjectURL(blob);
    gifShown = { blob, url, filename: name + '-' + kind + '-' + anim.label.toLowerCase().replace(/[^a-z]+/g, '-') + '.gif' };
    document.getElementById('gif-title').textContent = anim.label;
    gifImg.alt = name + ' ' + anim.label.toLowerCase() + ', looping';
    gifImg.onload = () => {
      const dpr = window.devicePixelRatio || 1, live = parseFloat(preview.style.width) / preview.width;
      const w = gifImg.naturalWidth / 4, h = gifImg.naturalHeight / 4;
      gifPreview.hidden = false;
      const room = gifPreview.clientHeight - 20 - 20
        - document.getElementById('gif-title').offsetHeight - gifPreview.querySelector('.buttons').offsetHeight;
      const fit = Math.min(live, room / h, (gifPreview.clientWidth - 20) / w);
      const scale = Math.max(1, Math.floor(fit * dpr)) / dpr;
      gifImg.style.width = w * scale + 'px';
      gifImg.style.height = h * scale + 'px';
      statusEl.textContent = '';
      document.getElementById('gif-save').focus();
    };
    gifImg.src = url;
  }, 30);
}
function closeGIF(refocus = false) {
  if (!gifShown) return;
  gifPreview.hidden = true;
  gifImg.removeAttribute('src');
  URL.revokeObjectURL(gifShown.url);
  gifShown = null;
  if (refocus) saveBtn.focus();
}
document.getElementById('gif-save').addEventListener('click', () => {
  if (!gifShown) return;
  download(gifShown.blob, gifShown.filename);
  say('GIF saved.');
});
document.getElementById('gif-back').addEventListener('click', () => closeGIF(true));
gifPreview.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeGIF(true); }
});

// ---- the save menu -----------------------------------------------------

const saveBtn = document.getElementById('btn-save');
const saveMenu = document.getElementById('save-menu');
function menuItem(label, fmt, action) {
  const b = el('button', 'stone plate item');
  b.setAttribute('role', 'menuitem');
  const l = el('span'), f = el('span', 'fmt');
  l.textContent = label;
  f.textContent = fmt;
  b.append(l, f);
  b.addEventListener('click', () => { closeSaveMenu(true); action(); });
  return b;
}
function openSaveMenu() {
  saveMenu.textContent = '';
  saveMenu.appendChild(menuItem('Picture', 'PNG', savePicture));
  for (const anim of animationsFor(state.kind, state.build[state.kind])) {
    saveMenu.appendChild(menuItem(anim.label, 'GIF', () => previewGIF(anim)));
  }
  saveMenu.hidden = false;
  saveBtn.setAttribute('aria-expanded', 'true');
  saveMenu.firstChild.focus();
}
function closeSaveMenu(refocus = false) {
  if (saveMenu.hidden) return;
  saveMenu.hidden = true;
  saveBtn.setAttribute('aria-expanded', 'false');
  if (refocus) saveBtn.focus();
}
saveBtn.addEventListener('click', () => (saveMenu.hidden ? openSaveMenu() : closeSaveMenu()));
document.addEventListener('pointerdown', e => {
  if (!saveMenu.hidden && !e.target.closest('.save')) closeSaveMenu();
});
saveMenu.addEventListener('keydown', e => {
  const items = [...saveMenu.children], i = items.indexOf(document.activeElement);
  const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
  if (e.key === 'Escape') { e.preventDefault(); closeSaveMenu(true); }
  else if (to !== undefined) { e.preventDefault(); items[(to + items.length) % items.length].focus(); }
});

document.getElementById('btn-link').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    say('Link copied.');
  } catch (e) {
    say('Copy the address bar - it holds this ' + LABEL[state.kind] + '.');
  }
});

// ---- refresh -----------------------------------------------------------

function switchKind() {
  document.body.dataset.kind = state.kind;
  clip = null;
  heading = null;
  update();
}

function update() {
  closeGIF();
  hatClip = null;
  updatePad();
  const build = state.build[state.kind];
  const described = FEATURES.map((f, i) => {
    const n = nameOf(f, build[f]);
    return i ? n.toLowerCase() : n;
  }).join(', ');
  document.body.dataset.kind = state.kind;
  const name = shownName(state.name[state.kind]);
  document.getElementById('name').textContent = name;
  preview.setAttribute('aria-label', name + ', a ' + LABEL[state.kind] + ': ' + described);
  paintTiles();
  paintDice();
  layoutPreview();
  writeHash();
}

window.addEventListener('hashchange', () => { readHash(); switchKind(); });

readHash();
sheet.onload = () => { dressPage(); buildTiles(); switchKind(); setPaused(paused); };
sheet.src = S.sheet;
</script>
