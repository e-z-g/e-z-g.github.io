<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zoombini Maker</title>
<!--
  Zoombini Maker - build a Zoombini (or a Fleen) the way the 1996 game's
  Zoombini Isle screen does: rows of feature tiles and a dice for a random
  one. It then stands there idling, as the game's characters do.

  Where the pieces come from. Everything drawn here is the game's own art,
  pulled out of its Mohawk archives by tools/export_web.py in the separate
  zoombinis extraction project, which writes sprites.js next to this file.
  Do not hand-edit sprites.js; re-run that.

  - The characters are assembled from the in-game atlases (ZOOMBINI tBMP
    3000, FLEENS tBMP 4000), one rest pose per part variant, each with its
    REGS anchor. Every part is drawn at (origin - anchor), which is how the
    game lines them up. The maker screen has its own large parts (PICKER
    tBMP 4300) but no anchors for them - where the game puts those is in the
    EXE - so they are not used: guessing offsets would put noses on cheeks.
  - The Zoombini tiles are the maker screen's real buttons (PICKER tBMP
    4400), in the same variant order as the atlas. The game has no Fleen
    maker; the Fleen tiles are made by the exporter in the same style, and
    so are the two body tiles, which the game has no need of. The dice and
    the go arrow are PICKER tBMP 4200.

  The character is drawn with its origin fixed in the preview, not centred
  on its own outline, so the body stays put and only the feature you change
  moves - hair and feet are lopsided, and re-centring on every click makes
  the whole figure jump.

  Which body it is - Zoombini or Fleen - is picked like any feature, from
  the first row of tiles, and either can wear the other's parts: each
  feature row offers the Zoombini's five, then the Fleen's five. The fitting is done by the
  exporter, not here - the part's skin recoloured to the host's (a Fleen's
  legs belong to its feet, a Zoombini's eyelids to its eyes), mirrored
  because a Zoombini faces right and a Fleen left, and re-anchored to the
  host's head top, body bottom, or its own eye and nose spots (and Fleen hair
  goes under a Zoombini's eyes, which sit too high to clear it). Borrowed feet
  get more: a Zoombini's far foot goes behind the egg and its near foot in
  front, and a Fleen keeps its own legs for Zoombini shoes and stands its
  stalk on a Zoombini spring, wheels or propeller.
  The page only paints the result (see variantsFor).

  Every so often it walks on the spot, in one of the game's directions - a
  Zoombini has five per pair of feet, from towards the viewer round to away
  from them - to the right or, mirrored, to the left, and stays turned that
  way afterwards. A Fleen hop-steps (its hop frames face right, though it
  stands facing left) or runs away from the viewer, in its own feet or in
  Zoombini sneakers or skates. Borrowed Fleen wheels, treads and rockets use the
  Fleen's own spinning, rolling and firing frames; see
  walk_clip() and FLEEN_RIDES in the exporter for how borrowed feet walk.

  The idling is the game's own: its idle scripts for each character, which
  change nothing but the eyes, the head's facing, the feet and where the
  whole figure stands - glances and blinks, a Zoombini turning its head and
  showing off its feet (tapping sneakers, a bouncing spring, a propeller
  spinning up), a Fleen's hops. The exporter writes them in terms of what
  the parts do - rest, blink, glance, facing - rather than frame numbers, so
  borrowed eyes blink and glance with their own frames, and borrowed parts,
  having no turned frames, ride along with the turning head. A Fleen on a
  Zoombini spring, wheels or propeller plays that device's special too.
  Fleen idles never blink, so the page adds a blink of its own. Motion stops for prefers-reduced-motion, and
  the Pause button stops it anywhere; Save picture always takes the rest pose.

  Names come from the game's own generator (ZOOMBINI.EXE seg26:1f26, run for
  every Zoombini it makes), ported letter for letter - see makeName(). A new
  name comes with the dice or a click on the name; picking one feature keeps
  it. The game writes names lowercase; the page capitalises them to show.

  Why the sprite sheet is a data: URI inside sprites.js rather than a PNG:
  so "Save picture" works when the page is opened from file://. A canvas that has
  drawn a file:// image is tainted and toBlob() throws.

  Pixel art is only ever scaled by whole numbers - the preview picks the
  largest integer CSS scale that fits, and image-rendering: pixelated does
  the rest - so every source pixel stays square.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Grandstander:wght@500;700;800&display=swap">
<style>
  /* The look is the game's Zoombini Isle builder, made of its own parts
     rather than drawn from it (the scene itself stays out, as a backdrop
     behind the character was tried and taken out): the night sky's blues,
     the dark rock the builder's tiles sit in, the dice and green go arrow
     that are its own buttons, and, for everything with words on, the flat
     grey stone of its name bar - a bevel lit from the top right, a black
     outline - pressed in, as a picked tile is, to the same tan. (The
     tiles' speckled face was tried on those first; words on it were hard to
     read.) Every edge is square and in whole source pixels at 2x, like the
     tiles beside them. */
  :root {
    color-scheme: dark;
    --night: #1c185a;                    /* the builder's sky, darkest to lightest */
    --night-deep: #101042;
    --night-hi: #212173;
    --cloud: #7384ce;
    --rock: #312929;                     /* the rock round the builder's tiles */
    --rock-lo: #211818;
    --rock-hi: #423942;
    --stone: #828282;                    /* a tile: face, bevel, pressed */
    --stone-hi: #c0c0c0;
    --stone-lo: #414141;
    --stone-deep: #202020;
    --tan: #e7b55a;
    --tan-hi: #f1dfb2;
    --tan-lo: #ce8431;
    --tan-deep: #844a39;
    --zoombini: #9ebfff;                 /* the two skins, for the title */
    --fleen: #c9ee31;
    --text: #f1dfb2;
    --rock-img: none;
    --display: 'Chewy', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    --ui: 'Grandstander', 'Trebuchet MS', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--night);
    color: var(--text);
    font-family: var(--ui);
    font-weight: 500;
    line-height: 1.35;
  }
  button { touch-action: manipulation; font: inherit; -webkit-tap-highlight-color: transparent; }
  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 16px 36px;
  }

  /* ---- materials ---- */

  /* A stone plaque: the name bar's flat face, a tile's two-step bevel
     (light on the top and right, dark on the left and bottom), a black
     outline, and its words cut in. */
  .stone {
    color: #111;
    background: var(--stone);
    border: 2px solid #000;
    border-radius: 0;
    box-shadow:
      inset 0 2px 0 var(--stone-hi), inset -2px 0 0 var(--stone-hi),
      inset 2px 0 0 var(--stone-deep), inset 0 -2px 0 var(--stone-deep),
      inset 0 4px 0 var(--stone), inset -4px 0 0 var(--stone),
      inset 4px 0 0 var(--stone-lo), inset 0 -4px 0 var(--stone-lo);
    text-shadow: 1px 1px 0 var(--stone-hi);               /* cut in */
    cursor: pointer;
  }
  .stone:hover { filter: brightness(1.08); }
  /* pressed, or picked: the tan face, the bevel turned round */
  .stone:active, .stone[aria-selected="true"], .stone[aria-pressed="true"] {
    background: var(--tan);
    box-shadow:
      inset 0 2px 0 var(--tan-deep), inset -2px 0 0 var(--tan-deep),
      inset 2px 0 0 var(--tan-hi), inset 0 -2px 0 var(--tan-hi),
      inset 0 4px 0 var(--tan-lo), inset -4px 0 0 var(--tan-lo),
      inset 4px 0 0 #fefefe, inset 0 -4px 0 #fefefe;
    color: #4a1d08;
    text-shadow: 1px 1px 0 var(--tan-hi);
    filter: none;
  }
  /* The rock the tiles and the window are set in. */
  .rock {
    background: var(--rock) var(--rock-img) 0 0 / 64px 64px;
    image-rendering: pixelated;
    border: 2px solid #000;
    box-shadow: inset 2px 2px 0 var(--rock-hi), inset -2px -2px 0 var(--rock-lo);
  }
  :focus-visible { outline: 3px solid var(--tan); outline-offset: 2px; }

  /* ---- header ---- */

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 20px;
    margin-bottom: 16px;
  }
  /* Cartoon lettering: the skin of whichever character is being made, in
     the art's own black outline. */
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 2.6rem;
    line-height: 1;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--zoombini);
    text-shadow:
      2px 0 #000, -2px 0 #000, 0 2px #000, 0 -2px #000,
      2px 2px #000, -2px 2px #000, 2px -2px #000, -2px -2px #000,
      4px 5px 0 #000;
  }
  body[data-kind="fleen"] h1 { color: var(--fleen); }
  .share { display: flex; gap: 10px; }
  .share .short { display: none; }

  /* ---- the character and its controls ---- */

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    align-items: start;
  }
  .stage { display: flex; flex-direction: column; gap: 12px; }
  .window { padding: 10px; position: relative; }
  /* what saving or copying did, over the bottom of the window */
  .status {
    position: absolute; left: 0; right: 0; bottom: 18px; margin: 0;
    text-align: center; font-weight: 700; pointer-events: none;
    text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000;
  }
  .preview {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: var(--night-hi);
    border: 2px solid #000;
    box-shadow: inset 4px 4px 0 rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }
  #preview { display: block; image-rendering: pixelated; }

  .name-btn {
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 10px;
    padding: 6px 18px 8px;
    font-family: var(--display);
    font-size: 1.9rem;
    line-height: 1.1;
    min-width: 7em;
    max-width: 100%;
    min-height: 0;
  }
  .name-btn .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name-btn .again { font-family: system-ui, sans-serif; font-size: 1.1rem; font-weight: 700; opacity: 0.6; }

  .toolbar { display: flex; justify-content: center; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ctl {
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    line-height: 0;
  }
  .ctl canvas { display: block; image-rendering: pixelated; }
  #btn-random canvas { width: 108px; height: 78px; }
  #btn-walk canvas { width: 76px; height: 72px; }
  .plate { padding: 8px 16px 10px; font-weight: 800; font-size: 1.05rem; min-width: 7em; }

  /* ---- the feature box: the tiles set in the builder's rock ---- */

  .box { padding: 14px; width: 100%; max-width: 620px; justify-self: center; }
  .rows { display: grid; gap: 10px; }
  /* A row: the body, then each feature - the Zoombini's five tiles on the
     left and the Fleen's on the right, whichever body is picked, so a tile
     is always where it was. The body row has one tile in each. */
  .feature {
    display: flex;
    justify-content: center;
    gap: 14px;
  }
  .set {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 52px));
    gap: 4px;
  }
  .tile {
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
  }
  .tile canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 40 / 43;
    image-rendering: pixelated;
  }


  /* A desktop: the character in its window on the left, as tall as the
     screen allows; its name and buttons, then the tiles, down the right. */
  @media (min-width: 901px) {
    main {
      grid-template-columns: minmax(0, 1fr) minmax(0, 620px);
      grid-template-areas: "window tools" "window box" "window .";
      grid-template-rows: auto auto 1fr;
      gap: 16px 22px;
    }
    .stage { display: contents; }
    .window { grid-area: window; }
    .box { grid-area: box; }
    .toolbar { grid-area: tools; }
  }

  /* A phone: everything on one screen - the window takes whatever height
     the name, buttons and all 42 tiles leave (see layoutPreview), and the
     tiles shrink to fit ten across, as the two sets share each row. The
     game's buttons at 1x. */
  @media (max-width: 900px) {
    .page { padding: 8px 10px 24px; }
    header { flex-wrap: nowrap; margin-bottom: 8px; gap: 8px; }
    h1 { font-size: 1.5rem; white-space: nowrap;
         text-shadow: 1px 0 #000, -1px 0 #000, 0 1px #000, 0 -1px #000,
                      1px 1px #000, -1px 1px #000, 1px -1px #000, -1px -1px #000, 2px 3px 0 #000; }
    .share { gap: 6px; }
    .share .long { display: none; }
    .share .short { display: inline; }
    main { gap: 8px; }
    .stage { display: flex; flex-direction: column; gap: 8px; }
    .window { padding: 5px; }
    .preview { padding: 4px; }
    .status { bottom: 10px; font-size: 0.85rem; }
    .toolbar { flex-wrap: nowrap; gap: 8px; }
    .name-btn { font-size: 1.3rem; padding: 3px 10px 5px; min-width: 0; flex: 1 1 auto; }
    #btn-random canvas { width: 54px; height: 39px; }
    #btn-walk canvas { width: 38px; height: 36px; }
    .plate { min-width: 0; font-size: 0.85rem; padding: 5px 9px 7px; }
    .box { padding: 6px; }
    .rows { gap: 4px; }
    .feature { gap: 6px; }
    .set { flex: 1 1 0; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
  }

  footer { margin-top: 30px; font-size: 0.9rem; opacity: 0.75; }
  footer a { color: var(--zoombini); }
</style>
</head>
<body data-kind="zoombini">
<div class="page">
  <header>
    <h1>Zoombini Maker</h1>
    <div class="share">
      <button class="stone plate" id="btn-save"><span class="long">Save picture</span><span class="short">Save</span></button>
      <button class="stone plate" id="btn-link">Copy link</button>
    </div>
  </header>

  <main>
    <div class="stage">
      <div class="window rock">
        <div class="preview" id="preview-wrap">
          <canvas id="preview" role="img"></canvas>
        </div>
        <p class="status" id="status" aria-live="polite"></p>
      </div>
      <div class="toolbar">
        <button class="stone name-btn" id="btn-name" title="Think of a new name"><span class="name" id="name"></span><span class="again" aria-hidden="true">&#x21bb;</span></button>
        <button class="ctl" id="btn-random" title="Roll a new one" aria-label="Roll a new one"><canvas width="54" height="39"></canvas></button>
        <button class="ctl" id="btn-walk" title="Walk" aria-label="Walk"><canvas width="38" height="36"></canvas></button>
        <button class="stone plate" id="btn-motion" aria-pressed="false">Pause</button>
      </div>
    </div>

    <section class="box rock" aria-label="Body and features">
      <div class="rows" id="rows"></div>
    </section>
  </main>

  <footer>
    Art from <i>The Logical Journey of the Zoombinis</i> (Broderbund, 1996), taken
    from the game's data files. A fan-made toy, not affiliated with the game's makers.
    <a href="../">More tools</a>.
  </footer>
</div>

<script src="sprites.js"></script>
<script>
'use strict';

const S = window.ZOOMBINI_SPRITES;
const FEATURES = S.features;                 // ['hair', 'eyes', 'nose', 'feet']
const LABEL = { zoombini: 'Zoombini', fleen: 'Fleen' };
const OTHER = { zoombini: 'fleen', fleen: 'zoombini' };
const PAD = 3;                               // source pixels around the figure
const TICK_MS = 100;                         // one script section per tick
const REST = { eyes: 0, dx: 0, dy: 0, facing: 0, feet: -1, walk: null, faces: null };
// A walk tick: [dx, dy, feet, body, nose, eyes, hair, liftNear, liftFar,
// device, away] - each part's pose (-1 rest), how far each borrowed foot
// is lifted, the frame of a borrowed device (-1 none), and 1 when the head is
// turned away from the viewer. See walk_clip() in the exporter.
const WALK_PARTS = ['feet', 'body', 'nose', 'eyes', 'hair'];

// ---- names -------------------------------------------------------------

// The game's name generator (ZOOMBINI.EXE seg26:1f26), with its tables
// (far-data segments 89-92). Vowels and consonants alternate up to a length
// of 4-8, starting with a vowel 39% of the time. A vowel is drawn from
// VOWEL_UNITS, which weights the single letters and adds pairs. A consonant
// is a single letter (from the weighted CONSONANTS) only as the first or
// second letter, and then two times in three; otherwise, and always later
// in the name, it is a cluster. A cluster that reaches the length has its
// second letter redrawn from VOWELS, so every name ends in a vowel, and a
// doubled start ("ee", "oo", "nn") is cut to one letter. The game's random
// numbers are inclusive at both ends, as between() is.
const VOWEL_UNITS = ['a', 'a', 'a', 'e', 'e', 'e', 'e', 'i', 'i', 'i', 'o', 'o', 'o', 'u', 'u', 'y',
  'ee', 'oo', 'yo', 'ya', 'ye', 'ei', 'ie', 'ai', 'ia', 'au', 'ua', 'uo', 'ou', 'ae', 'ea'];
const CONSONANTS = 'bbccdddfghjkkllmmnnprrssssttvwxz';
const VOWELS = 'aeiouy';
const CLUSTERS = ['bl', 'br', 'ch', 'cl', 'cr', 'dr', 'dw', 'fl', 'fr', 'gh', 'gl', 'gr', 'kl', 'kn',
  'kr', 'kw', 'ld', 'mp', 'nd', 'nh', 'nn', 'ph', 'pl', 'pr', 'qu', 'qu', 'rh', 'rn', 'sc', 'sl',
  'sm', 'sn', 'sp', 'sr', 'st', 'sw', 'th', 'tr', 'tw', 'wr'];
const between = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const drawFrom = list => list[between(1, list.length) - 1];
function makeName() {
  const length = between(4, 8);
  let vowel = between(1, 100) < 40;
  let name = '';
  while (name.length < length) {
    let cluster = false;
    if (vowel) name += drawFrom(VOWEL_UNITS);
    else if (name.length > 1 || between(1, 100) <= 33) { name += drawFrom(CLUSTERS); cluster = true; }
    else name += drawFrom(CONSONANTS);
    vowel = !vowel;
    if (cluster && name.length >= length) name = name.slice(0, -1) + drawFrom(VOWELS);
    if (name.length === 2 && name[0] === name[1]) name = name[0];
  }
  return name;
}
const shownName = name => name[0].toUpperCase() + name.slice(1);

// ---- state -------------------------------------------------------------

// A pick is {v, borrowed}: variant v of this character's part, or of the
// other character's if borrowed.
const randomPick = () => ({ v: Math.floor(Math.random() * 5), borrowed: Math.random() < 0.5 });
const randomBuild = () => Object.fromEntries(FEATURES.map(f => [f, randomPick()]));
const plainBuild = () => Object.fromEntries(FEATURES.map(f => [f, { v: Math.floor(Math.random() * 5), borrowed: false }]));

const state = {
  kind: 'zoombini',
  build: { zoombini: plainBuild(), fleen: plainBuild() },
  name: { zoombini: makeName(), fleen: makeName() },
};

// The build lives in the address, so a link shows the same character:
// #zoombini-2031-oplie is hair 2, eyes 0, nose 3, feet 1, named Oplie, and a
// letter marks a feature borrowed from the other character - #zoombini-2d31
// has the other's eyes number 3 (a = 0). Links from before names keep
// working, with a new name.
const codeOf = build => FEATURES.map(f =>
  build[f].borrowed ? 'abcde'[build[f].v] : String(build[f].v)).join('');
function readHash() {
  const m = /^#(zoombini|fleen)(?:-([0-4a-e]{4}))?(?:-([a-z]{1,12}))?$/.exec(location.hash);
  if (!m) return;
  state.kind = m[1];
  if (m[3]) state.name[m[1]] = m[3];
  if (!m[2]) return;
  FEATURES.forEach((f, i) => {
    const c = m[2][i], letter = c >= 'a';
    state.build[m[1]][f] = { v: letter ? c.charCodeAt(0) - 97 : +c, borrowed: letter };
  });
}
function writeHash() {
  const hash = '#' + state.kind + '-' + codeOf(state.build[state.kind]) + '-' + state.name[state.kind];
  if (location.hash !== hash) history.replaceState(null, '', hash);
}

// ---- drawing -----------------------------------------------------------

const sheet = new Image();
const rect = i => S.rects[i];

// With `axis` set, the sprite is drawn mirrored about that vertical line.
function drawSprite(ctx, index, x, y, scale = 1, axis = null) {
  const [sx, sy, w, h] = rect(index);
  if (axis === null) {
    ctx.drawImage(sheet, sx, sy, w, h, x, y, w * scale, h * scale);
    return;
  }
  ctx.save();
  ctx.translate(2 * axis - x, y);
  ctx.scale(-1, 1);
  ctx.drawImage(sheet, sx, sy, w, h, 0, 0, w * scale, h * scale);
  ctx.restore();
}

// The eyes as the idle wants them: 0 rest, 1 blink, 2 + k glance k. Each
// eye variant carries its own blink and glances; a character with fewer
// glances than asked for wraps round them.
function eyeFrame(entry, eyes) {
  if (!eyes || !entry.frames) return entry;
  if (eyes === 1) return entry.frames.blink;
  const g = entry.frames.glance;
  return g[(eyes - 2) % g.length];
}

// The sprites to paint, in order. A borrowed part comes ready-fitted from the
// exporter (recoloured, mirrored, re-anchored) and takes its feature's place.
// Borrowed feet are placed around the body instead: a Zoombini in Fleen feet
// has its far foot behind the egg (`back`) and its near foot in front, so it
// stands between its treads rather than on them; a Fleen in Zoombini shoes
// gets straight legs down into a shoe each, and a Fleen on a Zoombini spring,
// wheels or propeller rests on it - both `behind` the stalk (running away in
// shoes, its own run frames are in front, as its own feet are).
//
// `pose` is the idle's current tick: the head's facing (0 for the rest one)
// swaps in a part's turned frame - a borrowed part, having none, its frame
// moved to where the host's own part sits at that angle - and `feet` >= 0
// swaps in a special frame, keeping the feet's place around the body.
//
// Walking (`pose.walk`) picks each part's walk pose; a borrowed part follows
// the host's own part it sits on - hair the body. Borrowed feet do not use
// the other character's walk frames: a Zoombini's near and far borrowed foot
// lift in turn, a Fleen's legs-and-shoes lift in turn, and a device plays its
// own walk frames.
const lifted = (v, up) => up ? Object.assign({}, v, { oy: -up }) : v;
function variantsFor(kind, build, pose = REST) {
  const ch = S.characters[kind];
  const w = pose.walk;
  const at = n => w[2 + WALK_PARTS.indexOf(n)];
  const out = ch.parts.map(part => {
    const pick = build[part.name];
    const borrowed = part.variants.length > 1 && pick.borrowed;
    let v = part.variants.length === 1 ? part.variants[0]
      : borrowed ? ch.borrowed[part.name][pick.v] : part.variants[pick.v];
    if (w) {
      if (!(borrowed && part.name === 'feet')) {
        const key = at(borrowed && part.name === 'hair' ? 'body' : part.name);
        if (key >= 0 && v.poses && v.poses[key]) v = v.poses[key];
      }
    } else {
      if (pose.facing && v.facings) v = v.facings[pose.facing];
      if (part.name === 'eyes') v = eyeFrame(v, pose.eyes);
      if (part.name === 'feet' && pose.feet >= 0 && v.special) {
        v = Object.assign({}, v.special[pose.feet], { behind: v.behind, back: v.back });
      }
    }
    return { name: part.name, v };
  });
  if (build.feet.borrowed) {
    const [feet] = out.splice(out.findIndex(p => p.name === 'feet'), 1);
    let f = feet.v;
    const nearUp = w ? w[7] : 0, farUp = w ? w[8] : 0;
    if (w && w[9] >= 0 && f.walk) f = Object.assign({ behind: f.behind }, f.walk[w[9]]);
    const layers = w && f.units ? [lifted(f.units[0], farUp), lifted(f.units[1], nearUp)]
      : [lifted(f, f.back ? nearUp : 0)];
    const body = out.findIndex(p => p.name === 'body');
    out.splice(f.behind ? body : body + 1, 0, ...layers.map(v => ({ name: 'feet', v })));
    if (f.back) out.splice(out.findIndex(p => p.name === 'body'), 0, { name: 'feet', v: lifted(f.back, farUp) });
  }
  // A Zoombini's eyes sit high on its head, about 7px under its top where a
  // Fleen's are 13px under, so Fleen hair fitted to the top reaches down over
  // them. Borrowed hair goes under a Zoombini's eyes, then, as a Fleen draws
  // its own - but not with the head turned away, when the hair is nearer.
  if (kind === 'zoombini' && build.hair.borrowed && !(w && w[10])) {
    const [hair] = out.splice(out.findIndex(p => p.name === 'hair'), 1);
    out.splice(out.findIndex(p => p.name === 'eyes'), 0, hair);
  }
  // walking away, a Zoombini's head is turned from the viewer and the game
  // draws its nose before its body; borrowed eyes go behind with it, so only
  // what sticks out past the head shows, as with its own eyes
  if (w && w[10]) {
    for (const name of ['nose', 'eyes']) {
      if (name === 'eyes' && !build.eyes.borrowed) continue;
      const [part] = out.splice(out.findIndex(p => p.name === name), 1);
      out.splice(out.findIndex(p => p.name === 'body'), 0, part);
    }
  }
  // borrowed hair with a piece hanging behind the head (the horned helmet's
  // downward braid) paints that piece before the body, which hides it
  const hair = out.find(p => p.name === 'hair');
  if (hair && hair.v.back) out.splice(out.findIndex(p => p.name === 'body'), 0, { name: 'hair', v: hair.v.back });
  return out.map(p => p.v);
}

// A box relative to the REGS origin around the given variants.
function boundsOf(variants) {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  for (const v of variants) {
    const [, , w, h] = rect(v.sprite);
    l = Math.min(l, -v.rx); t = Math.min(t, -v.ry);
    r = Math.max(r, -v.rx + w); b = Math.max(b, -v.ry + h);
  }
  return { l, t, r, b };
}

// The box every standing build fits in, whatever its parts, facing or feet
// special. The figure is scaled so this box fills the panel, and it stays put
// while parts are picked. Walks, hops and bounces are left out: counting them
// shrank a standing Zoombini from about 7x to 4x. They use the panel around
// the box instead (see layoutPreview).
const fitBounds = Object.fromEntries(Object.keys(LABEL).map(kind => {
  const ch = S.characters[kind];
  const all = [];
  const add = v => {
    all.push(v);
    if (v.back) all.push(v.back);
    if (v.frames) all.push(v.frames.blink, ...v.frames.glance);
    if (v.facings) Object.values(v.facings).forEach(add);
    for (const more of [v.special, v.units]) if (more) more.forEach(add);
  };
  for (const p of ch.parts) p.variants.concat(ch.borrowed[p.name] || []).forEach(add);
  return [kind, boundsOf(all)];
}));

// A bad size here does not throw - a canvas sized NaN is simply empty - so
// check, and fail loudly instead of drawing nothing.
for (const [kind, bb] of Object.entries(fitBounds)) {
  if (![bb.l, bb.t, bb.r, bb.b].every(Number.isFinite)) throw new Error('bad preview bounds for ' + kind);
}

// Draw with the REGS origin at (ox, oy), mirrored about `axis` if set.
function drawCharacter(ctx, kind, build, ox, oy, scale = 1, pose = REST, axis = null) {
  for (const v of variantsFor(kind, build, pose)) {
    drawSprite(ctx, v.sprite, ox - v.rx * scale, oy + ((v.oy || 0) - v.ry) * scale, scale, axis);
  }
}

const wrap = document.getElementById('preview-wrap');
const preview = document.getElementById('preview');
const pose = Object.assign({}, REST);       // the idle's current tick

let origin = { x: 0, y: 0 };                 // where the REGS origin sits on the canvas
let heading = null;                          // 'left' or 'right' once it has walked

// The figure turns by being mirrored about the middle of its standing box -
// the atlas's own mirrored frames are exact mirrors - so it stays in the same
// place in the panel. It is mirrored whenever the frames being drawn face the
// other way from where it is heading (the character's `faces`): a Fleen
// stands facing left but hops to the right, so it is mirrored to hop left,
// and after hopping right it stands mirrored, facing right.
function drawPreview() {
  const ctx = preview.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, preview.width, preview.height);
  if (sheet.complete) {
    const bb = fitBounds[state.kind];
    const drawn = pose.walk ? pose.faces : S.characters[state.kind].faces.rest;
    const axis = heading && heading !== drawn ? origin.x + (bb.l + bb.r) / 2 : null;
    drawCharacter(ctx, state.kind, state.build[state.kind],
                  origin.x + pose.dx, origin.y + pose.dy, 1, pose, axis);
  }
}

// The canvas fills the panel, at the largest whole-number scale at which the
// standing box fits, with the box in its middle - so moving figures have the
// rest of the panel to move in, and only something travelling past the
// panel's edge is cut off. Its height comes from the window, never from the
// panel's own, which grows with the canvas and would feed back into itself:
// on a desktop most of the window; on a phone, whatever the header, buttons
// and tiles leave of it - everything else's height, measured without the
// canvas, is the same whatever the canvas's - so every option is on screen
// at once, with no scrolling.
// The window's height without its browser bars (CSS svh): on a phone the
// address bar comes and goes as the page scrolls, and sizing from
// innerHeight would resize the pinned character mid-scroll.
const svh = document.createElement('div');
svh.style.cssText = 'position:fixed;top:0;left:0;width:0;height:100svh;visibility:hidden;pointer-events:none';
document.body.appendChild(svh);
const viewHeight = () => svh.offsetHeight || window.innerHeight;

function layoutPreview() {
  const cs = getComputedStyle(wrap);
  const availW = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const narrow = window.matchMedia('(max-width: 900px)').matches;
  const others = document.querySelector('main').getBoundingClientRect().bottom + window.scrollY
    - preview.getBoundingClientRect().height + 10;
  const availH = narrow ? Math.max(90, viewHeight() - others)
    : Math.max(260, Math.min(560, viewHeight() - 280));
  const bb = fitBounds[state.kind];
  const fw = bb.r - bb.l + PAD * 2, fh = bb.b - bb.t + PAD * 2;
  const scale = Math.max(1, Math.floor(Math.min(availW / fw, availH / fh)));
  const w = Math.max(fw, Math.floor(availW / scale)), h = Math.max(fh, Math.floor(availH / scale));
  if (preview.width !== w || preview.height !== h) { preview.width = w; preview.height = h; }
  preview.style.width = w * scale + 'px';
  preview.style.height = h * scale + 'px';
  origin = { x: Math.floor((w - (bb.r - bb.l)) / 2) - bb.l,
             y: Math.floor((h - (bb.b - bb.t)) / 2) - bb.t };
  drawPreview();
}
new ResizeObserver(layoutPreview).observe(wrap);
window.addEventListener('resize', layoutPreview);

function paintTile(canvas, index) {
  const [, , w, h] = rect(index);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, w, h);
  drawSprite(ctx, index, 0, 0);
}

// ---- the feature box ---------------------------------------------------

const rowsEl = document.getElementById('rows');
let tiles = {};                          // feature -> [{b, v, borrowed}]

const nameOf = (feat, pick) =>
  S.characters[pick.borrowed ? OTHER[state.kind] : state.kind].names[feat][pick.v];

// Built once: the body's row, then each feature's, the Zoombini's tiles on
// the left and the Fleen's on the right. A pick is kept as {v, borrowed}
// against the body (see state), so a tile's pick depends on the body.
const ROWS = ['body'].concat(FEATURES);
const KINDS = ['zoombini', 'fleen'];
function buildTiles() {
  rowsEl.textContent = '';
  tiles = {};
  for (const feat of ROWS) {
    const row = document.createElement('div');
    row.className = 'feature';
    row.setAttribute('role', 'group');
    row.setAttribute('aria-label', feat[0].toUpperCase() + feat.slice(1));
    tiles[feat] = [];
    for (const kind of KINDS) {
      const set = document.createElement('div');
      set.className = 'set';
      S.characters[kind].buttons[feat].forEach((pair, v) => {
        const b = document.createElement('button');
        b.className = 'tile';
        const name = feat === 'body' ? LABEL[kind]
          : S.characters[kind].names[feat][v] + ' (' + LABEL[kind] + ')';
        b.title = name;
        b.setAttribute('aria-label', name);
        b.appendChild(document.createElement('canvas'));
        b.addEventListener('click', () => {
          if (feat === 'body') setBody(kind);
          else state.build[state.kind][feat] = { v, borrowed: kind !== state.kind };
          endClip();
          update();
        });
        set.appendChild(b);
        tiles[feat].push({ b, v, kind });
      });
      row.appendChild(set);
    }
    rowsEl.appendChild(row);
  }
}

// The whole character becomes the other one's body, every feature staying
// what it was - a Fleen's hair on a Zoombini is that Fleen's own hair on a
// Fleen - and so does its name.
function setBody(kind) {
  if (kind === state.kind) return;
  const old = state.kind;
  state.build[kind] = Object.fromEntries(FEATURES.map(f => {
    const { v, borrowed } = state.build[old][f];
    return [f, { v, borrowed: (borrowed ? OTHER[old] : old) !== kind }];
  }));
  state.name[kind] = state.name[old];
  state.kind = kind;
  heading = null;
}

function paintTiles() {
  const build = state.build[state.kind];
  for (const feat of ROWS) {
    for (const t of tiles[feat]) {
      const pick = build[feat];
      const on = feat === 'body' ? t.kind === state.kind
        : pick.v === t.v && (pick.borrowed ? OTHER[state.kind] : state.kind) === t.kind;
      t.b.setAttribute('aria-pressed', on);
      paintTile(t.b.firstChild, S.characters[t.kind].buttons[feat][t.v][on ? 1 : 0]);
    }
  }
}

// ---- the page's own stone -----------------------------------------------

// The rock round the tiles and the window, for the stylesheet: speckled here
// from the builder's rock colours, as its painted rock would not repeat.
function rockURL() {
  const c = document.createElement('canvas');
  c.width = c.height = 32;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#312929';
  ctx.fillRect(0, 0, 32, 32);
  let seed = 7;
  const next = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const specks = [['#211818', 0.3], ['#393131', 0.15], ['#423942', 0.1], ['#311821', 0.1]];
  for (let y = 0; y < 32; y++) {
    for (let x = 0; x < 32; x++) {
      let r = next();
      for (const [colour, share] of specks) {
        if (r < share) { ctx.fillStyle = colour; ctx.fillRect(x, y, 1, 1); break; }
        r -= share;
      }
    }
  }
  return c.toDataURL();
}
function dressPage() {
  document.documentElement.style.setProperty('--rock-img', `url(${rockURL()})`);
}

// The dice and the go arrow, which walks, show their pressed art while held,
// as in the game.
const walkBtn = document.getElementById('btn-walk');
let walkHeld = false;
function paintWalk() { paintTile(walkBtn.firstChild, S.controls.go[walkHeld ? 1 : 0]); }
for (const [ev, held] of [['pointerdown', true], ['pointerup', false], ['pointerleave', false],
                          ['pointercancel', false]]) {
  walkBtn.addEventListener(ev, () => { if (walkHeld !== held) { walkHeld = held; paintWalk(); } });
}
const dice = document.getElementById('btn-random');
let diceHeld = false;
function paintDice() { paintTile(dice.firstChild, S.controls.random[diceHeld ? 1 : 0]); }
dice.addEventListener('pointerdown', () => { diceHeld = true; paintDice(); });
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) {
  dice.addEventListener(ev, () => { if (diceHeld) { diceHeld = false; paintDice(); } });
}
dice.addEventListener('click', () => {
  state.kind = KINDS[Math.floor(Math.random() * 2)];
  heading = null;
  state.build[state.kind] = randomBuild();
  state.name[state.kind] = makeName();
  endClip();
  update();
});
document.getElementById('btn-name').addEventListener('click', () => {
  state.name[state.kind] = makeName();
  update();
});

// ---- idling ------------------------------------------------------------

// Stand still for a while, then play one of the character's idle clips,
// then stand still again - as the game's characters do between moves. A
// Zoombini in its own feet sometimes shows them off (its feet's special); so
// does a Fleen standing on a Zoombini spring, wheels or propeller, which plays
// the same feet frames and keeps its own head still. Fleen idles never blink,
// so they get a blink of the page's own.
const PAGE_BLINK = [[1, 0, 0, 0, -1], [1, 0, 0, 0, -1]];
const SPECIAL_WEIGHT = 3;                    // shown off about a quarter of the time
const WALK_WEIGHT = 3;                       // and walking about as often
const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
let paused = motionQuery.matches;
let clip = null, clipAt = 0, waitTicks = 15, timer = 0;

// Clips are {ticks, walk} - idle ticks [eyes, dx, dy, facing, feet] - or
// {dirs, walk}, a walk with a clip per direction (walk ticks as described at
// WALK_PARTS); a direction, and left or right, is picked as it starts.
function clipsFor(kind) {
  const ch = S.characters[kind];
  const feet = state.build[kind].feet;
  const clips = kind === 'fleen' ? ch.idles.concat([PAGE_BLINK, PAGE_BLINK]) : ch.idles.slice();
  const walk = (feet.borrowed ? ch.walks.borrowedFeet : ch.walks.own)[feet.v];
  let special = null;
  if (kind === 'zoombini' && !feet.borrowed) {
    special = ch.specials[feet.v];
  } else if (kind === 'fleen' && feet.borrowed && ch.borrowed.feet[feet.v].special) {
    // the Fleen's head stays put; the special's opening tick, which faces a
    // Zoombini (and its device) towards the viewer, is left out
    special = S.characters.zoombini.specials[feet.v]
      .filter(t => t[3] !== 1).map(([, dx, dy, , f]) => [0, dx, dy, 0, f]);
  }
  for (let i = 0; special && i < SPECIAL_WEIGHT; i++) clips.push(special);
  const out = clips.map(ticks => ({ ticks, walk: false }));
  const faces = ch.faces[feet.borrowed ? 'borrowedFeet' : 'own'];
  for (let i = 0; i < WALK_WEIGHT; i++) out.push({ dirs: walk, walk: true, faces });
  return out;
}

function tick() {
  if (clip) {
    const t = clip.ticks[clipAt++];
    if (clip.walk) Object.assign(pose, REST, { walk: t, dx: t[0], dy: t[1], faces: clip.faces });
    else Object.assign(pose, REST, { eyes: t[0], dx: t[1], dy: t[2], facing: t[3], feet: t[4] });
    if (clipAt >= clip.ticks.length) { clip = null; waitTicks = 15 + Math.floor(Math.random() * 30); }
  } else {
    Object.assign(pose, REST);
    if (--waitTicks <= 0) {
      const clips = clipsFor(state.kind);
      startClip(clips[Math.floor(Math.random() * clips.length)]);
    }
  }
  drawPreview();
}

// A clip belongs to the build it started on - a special is one pair of
// feet's - so a new pick ends it and returns to the rest pose.
function startClip(c) {
  if (c.dirs) {
    clip = { ticks: c.dirs[Math.floor(Math.random() * c.dirs.length)], walk: true, faces: c.faces };
    heading = Math.random() < 0.5 ? 'left' : 'right';
  } else {
    clip = c;
  }
  clipAt = 0;
}

function endClip() {
  if (!clip) return;
  clip = null;
  Object.assign(pose, REST);
  waitTicks = 15;
}

function setPaused(p) {
  paused = p;
  clearInterval(timer);
  clip = null;
  Object.assign(pose, REST);
  if (!paused) { waitTicks = 8; timer = setInterval(tick, TICK_MS); }
  const btn = document.getElementById('btn-motion');
  btn.textContent = paused ? 'Play' : 'Pause';
  btn.setAttribute('aria-pressed', paused);
  drawPreview();
}
document.getElementById('btn-motion').addEventListener('click', () => setPaused(!paused));
// Walks come round at random; this starts one now.
document.getElementById('btn-walk').addEventListener('click', () => {
  if (paused) setPaused(false);
  startClip(clipsFor(state.kind).find(c => c.walk));
});
motionQuery.addEventListener('change', e => setPaused(e.matches));

// ---- saving and sharing ------------------------------------------------

const statusEl = document.getElementById('status');
let statusTimer = 0;
function say(text) {
  statusEl.textContent = text;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 2500);
}

// The character alone at rest, cropped to its own outline, at 4x on
// transparency.
document.getElementById('btn-save').addEventListener('click', () => {
  const kind = state.kind, build = state.build[kind];
  const scale = 4, pad = 2 * scale;
  const bb = boundsOf(variantsFor(kind, build));
  const c = document.createElement('canvas');
  c.width = (bb.r - bb.l) * scale + pad * 2;
  c.height = (bb.b - bb.t) * scale + pad * 2;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  drawCharacter(ctx, kind, build, pad - bb.l * scale, pad - bb.t * scale, scale);
  c.toBlob(blob => {
    if (!blob) { say('Could not make the PNG in this browser.'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = state.name[kind] + '-' + kind + '.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
});

document.getElementById('btn-link').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    say('Link copied.');
  } catch (e) {
    say('Copy the address bar - it holds this ' + LABEL[state.kind] + '.');
  }
});

// ---- refresh -----------------------------------------------------------

function switchKind() {
  document.body.dataset.kind = state.kind;
  clip = null;
  heading = null;
  update();
}

function update() {
  const build = state.build[state.kind];
  const described = FEATURES.map((f, i) => {
    const n = nameOf(f, build[f]);
    return i ? n.toLowerCase() : n;
  }).join(', ');
  document.body.dataset.kind = state.kind;
  const name = shownName(state.name[state.kind]);
  document.getElementById('name').textContent = name;
  preview.setAttribute('aria-label', name + ', a ' + LABEL[state.kind] + ': ' + described);
  paintTiles();
  paintDice();
  paintWalk();
  layoutPreview();
  writeHash();
}

window.addEventListener('hashchange', () => { readHash(); switchKind(); });

readHash();
sheet.onload = () => { dressPage(); buildTiles(); switchKind(); setPaused(paused); };
sheet.src = S.sheet;
</script>
</body>
</html>
