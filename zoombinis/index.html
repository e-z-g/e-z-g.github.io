// ---- animated GIF ------------------------------------------------------

// GIF89a, written here rather than with a library, so saving works offline
// and from file:// like the rest of the page. One palette of the frames'
// own colours - the art has far fewer than the 255 a GIF allows beside its
// transparent entry 0 (past that, the rarest go to their nearest) - every
// frame the whole picture, cleared to transparency before the next
// (disposal 2), and looping for ever. A run of identical frames is written
// once, held for the run's time.
class Bytes {
  constructor() { this.a = new Uint8Array(1 << 16); this.n = 0; }
  push(...bs) { for (const b of bs) { if (this.n === this.a.length) this.grow(); this.a[this.n++] = b; } }
  grow() { const a = new Uint8Array(this.a.length * 2); a.set(this.a); this.a = a; }
  u16(v) { this.push(v & 255, v >> 8 & 255); }
  text(s) { for (const ch of s) this.push(ch.charCodeAt(0)); }
}

// LZW as GIF has it: variable-width codes from minSize + 1 bits to 12, a
// clear code when the table is full, packed low bit first and cut into
// sub-blocks of up to 255 bytes. The table is two flat arrays keyed by
// (prefix code, next index), stamped per run so a clear costs nothing.
let lzwCode = null, lzwStamp = null, lzwRun = 0;
function writeLZW(out, ix, minSize) {
  if (!lzwCode) { lzwCode = new Int16Array(4096 << 8); lzwStamp = new Int32Array(4096 << 8); }
  const clear = 1 << minSize, eoi = clear + 1;
  let size = minSize + 1, next = eoi + 1, run = ++lzwRun;
  const data = new Bytes();
  let acc = 0, bits = 0;
  const put = code => {
    acc |= code << bits;
    bits += size;
    while (bits >= 8) { data.push(acc & 255); acc >>>= 8; bits -= 8; }
  };
  put(clear);
  let cur = ix[0];
  for (let i = 1; i < ix.length; i++) {
    const k = ix[i], key = cur << 8 | k;
    if (lzwStamp[key] === run) { cur = lzwCode[key]; continue; }
    put(cur);
    if (next === 4096) {
      put(clear);
      next = eoi + 1; size = minSize + 1; run = ++lzwRun;
    } else {
      if (next >= 1 << size) size++;
      lzwCode[key] = next++;
      lzwStamp[key] = run;
    }
    cur = k;
  }
  put(cur);
  put(eoi);
  if (bits > 0) data.push(acc & 255);
  out.push(minSize);
  for (let i = 0; i < data.n; i += 255) {
    const len = Math.min(255, data.n - i);
    out.push(len);
    for (let j = 0; j < len; j++) out.push(data.a[i + j]);
  }
  out.push(0);
}

// frames: RGBA at 1x, w x h, `delay` hundredths of a second apart; written
// at `scale`, each pixel a scale x scale block.
function encodeGIF(frames, w, h, scale, delay) {
  const rgb = (f, i) => f[i * 4] << 16 | f[i * 4 + 1] << 8 | f[i * 4 + 2];
  const count = new Map();
  for (const f of frames) {
    for (let i = 0; i < w * h; i++) if (f[i * 4 + 3] >= 128) count.set(rgb(f, i), (count.get(rgb(f, i)) || 0) + 1);
  }
  let palette = [...count.keys()];
  if (palette.length > 255) palette = palette.sort((a, b) => count.get(b) - count.get(a)).slice(0, 255);
  const index = new Map(palette.map((c, k) => [c, k + 1]));
  const nearest = c => {
    if (index.has(c)) return index.get(c);
    let best = 1, bestD = Infinity;
    palette.forEach((p, k) => {
      const d = ((p >> 16) - (c >> 16)) ** 2 + ((p >> 8 & 255) - (c >> 8 & 255)) ** 2 + ((p & 255) - (c & 255)) ** 2;
      if (d < bestD) { bestD = d; best = k + 1; }
    });
    index.set(c, best);
    return best;
  };
  // each frame as palette indices, a run of the same one kept once
  const runs = [];
  for (const f of frames) {
    const ix = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) if (f[i * 4 + 3] >= 128) ix[i] = nearest(rgb(f, i));
    const last = runs[runs.length - 1];
    if (last && last.ix.every((v, i) => v === ix[i])) last.ticks++;
    else runs.push({ ix, ticks: 1 });
  }
  const bitsFor = Math.max(1, Math.ceil(Math.log2(palette.length + 1)));
  const W = w * scale, H = h * scale;
  const out = new Bytes();
  out.text('GIF89a');
  out.u16(W); out.u16(H);
  out.push(0x80 | (bitsFor - 1) << 4 | (bitsFor - 1), 0, 0);
  for (let k = 0; k < 1 << bitsFor; k++) {
    const c = k >= 1 && k <= palette.length ? palette[k - 1] : 0;
    out.push(c >> 16 & 255, c >> 8 & 255, c & 255);
  }
  out.push(0x21, 0xff, 11); out.text('NETSCAPE2.0'); out.push(3, 1, 0, 0, 0);
  const big = new Uint8Array(W * H);
  for (const r of runs) {
    out.push(0x21, 0xf9, 4, 2 << 2 | 1); out.u16(r.ticks * delay); out.push(0, 0);
    out.push(0x2c); out.u16(0); out.u16(0); out.u16(W); out.u16(H); out.push(0);
    for (let y = 0; y < H; y++) {
      const src = ((y / scale) | 0) * w, row = y * W;
      for (let x = 0; x < W; x++) big[row + x] = r.ix[src + ((x / scale) | 0)];
    }
    writeLZW(out, big, Math.max(2, bitsFor));
  }
  out.push(0x3b);
  return new Blob([out.a.subarray(0, out.n)], { type: 'image/gif' });
}

// An animation of the build as a GIF, at 4x like the picture: the frames
// drawn at 1x on a canvas just big enough for every one of them, facing the
// way the game's frames do.
function makeGIF(kind, build, anim) {
  const pad = 2;
  const U = { l: Infinity, t: Infinity, r: -Infinity, b: -Infinity };
  // each frame facing the way the figure in the window would at that pose
  const mid = turnAxis(kind), turned = p => heading !== framesFace(kind, p);
  for (const p of anim.poses) {
    const bb = turnedBox(drawnBounds(kind, build, p), turned(p), mid);
    U.l = Math.min(U.l, bb.l); U.t = Math.min(U.t, bb.t); U.r = Math.max(U.r, bb.r); U.b = Math.max(U.b, bb.b);
  }
  if (!Number.isFinite(U.l)) return null;
  const w = U.r - U.l + pad * 2, h = U.b - U.t + pad * 2;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = false;
  const frames = anim.poses.map(p => {
    ctx.clearRect(0, 0, w, h);
    drawCharacter(ctx, kind, build, pad - U.l + p.dx, pad - U.t + p.dy, 1, p, turned(p) ? pad - U.l + mid : null);
    return ctx.getImageData(0, 0, w, h).data;
  });
  return encodeGIF(frames, w, h, 4, Math.round((anim.fast ? TICK_MS / 2 : TICK_MS) / 10));
}

// A GIF picked from the Save list is made at once and shown in the window,
// looping, before it is saved: Save GIF downloads that same file, Back (or
// Escape, or any change to the character) puts the character back. It is
// shown at the window's scale - the GIF is 4x - or less, in whole screen
// pixels, if the window is too small for it and its buttons.
const gifPreview = document.getElementById('gif-preview');
const gifImg = document.getElementById('gif-img');
let gifShown = null;                         // { blob, url, filename } while one is shown
function previewGIF(anim) {
  const kind = state.kind, build = state.build[kind], name = state.name[kind];
  say('Making the GIF…');
  // let the words show before the work starts
  setTimeout(() => {
    const blob = makeGIF(kind, build, anim);
    if (!blob) { say('Nothing to save - every part is none.'); return; }
    closeGIF();
    const url = URL.createObjectURL(blob);
    gifShown = { blob, url, filename: name + '-' + kind + '-' + anim.label.toLowerCase().replace(/[^a-z]+/g, '-') + '.gif' };
    document.getElementById('gif-title').textContent = anim.label;
    gifImg.alt = name + ' ' + anim.label.toLowerCase() + ', looping';
    gifImg.onload = () => {
      const dpr = window.devicePixelRatio || 1, live = parseFloat(preview.style.width) / preview.width;
      const w = gifImg.naturalWidth / 4, h = gifImg.naturalHeight / 4;
      gifPreview.hidden = false;
      const room = gifPreview.clientHeight - 20 - 20
        - document.getElementById('gif-title').offsetHeight - gifPreview.querySelector('.buttons').offsetHeight;
      const fit = Math.min(live, room / h, (gifPreview.clientWidth - 20) / w);
      const scale = Math.max(1, Math.floor(fit * dpr)) / dpr;
      gifImg.style.width = w * scale + 'px';
      gifImg.style.height = h * scale + 'px';
      statusEl.textContent = '';
      document.getElementById('gif-save').focus();
    };
    gifImg.src = url;
  }, 30);
}
function closeGIF(refocus = false) {
  if (!gifShown) return;
  gifPreview.hidden = true;
  gifImg.removeAttribute('src');
  URL.revokeObjectURL(gifShown.url);
  gifShown = null;
  if (refocus) saveBtn.focus();
}
document.getElementById('gif-save').addEventListener('click', () => {
  if (!gifShown) return;
  download(gifShown.blob, gifShown.filename);
  say('GIF saved.');
});
document.getElementById('gif-back').addEventListener('click', () => closeGIF(true));
gifPreview.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeGIF(true); }
});

// ---- the save menu -----------------------------------------------------

const saveBtn = document.getElementById('btn-save');
const saveMenu = document.getElementById('save-menu');
function menuItem(label, fmt, action) {
  const b = el('button', 'stone plate item');
  b.setAttribute('role', 'menuitem');
  const l = el('span'), f = el('span', 'fmt');
  l.textContent = label;
  f.textContent = fmt;
  b.append(l, f);
  b.addEventListener('click', () => { closeSaveMenu(true); action(); });
  return b;
}
function openSaveMenu() {
  saveMenu.textContent = '';
  saveMenu.appendChild(menuItem('Picture', 'PNG', savePicture));
  for (const anim of animationsFor(state.kind, state.build[state.kind])) {
    saveMenu.appendChild(menuItem(anim.label, 'GIF', () => previewGIF(anim)));
  }
  saveMenu.hidden = false;
  saveBtn.setAttribute('aria-expanded', 'true');
  saveMenu.firstChild.focus();
}
function closeSaveMenu(refocus = false) {
  if (saveMenu.hidden) return;
  saveMenu.hidden = true;
  saveBtn.setAttribute('aria-expanded', 'false');
  if (refocus) saveBtn.focus();
}
saveBtn.addEventListener('click', () => (saveMenu.hidden ? openSaveMenu() : closeSaveMenu()));
document.addEventListener('pointerdown', e => {
  if (!saveMenu.hidden && !e.target.closest('.save')) closeSaveMenu();
});
saveMenu.addEventListener('keydown', e => {
  const items = [...saveMenu.children], i = items.indexOf(document.activeElement);
  const to = { ArrowDown: i + 1, ArrowUp: i - 1, Home: 0, End: items.length - 1 }[e.key];
  if (e.key === 'Escape') { e.preventDefault(); closeSaveMenu(true); }
  else if (to !== undefined) { e.preventDefault(); items[(to + items.length) % items.length].focus(); }
});

document.getElementById('btn-link').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(location.href);
    say('Link copied.');
  } catch (e) {
    say('Copy the address bar - it holds this ' + LABEL[state.kind] + '.');
  }
});

// ---- refresh -----------------------------------------------------------

function switchKind() {
  document.body.dataset.kind = state.kind;
  clip = null;
  heading = START_HEADING;
  update();
}

function update() {
  closeGIF();
  updatePad();
  const build = state.build[state.kind];
  const described = FEATURES.map((f, i) => {
    const n = nameOf(f, build[f]);
    return i ? n.toLowerCase() : n;
  }).join(', ');
  document.body.dataset.kind = state.kind;
  const name = shownName(state.name[state.kind]);
  document.getElementById('name').textContent = name;
  preview.setAttribute('aria-label', name + ', a ' + LABEL[state.kind] + ': ' + described);
  paintTiles();
  paintDice();
  layoutPreview();
  writeHash();
}

window.addEventListener('hashchange', () => { readHash(); switchKind(); });

readHash();
sheet.onload = () => { dressPage(); buildTiles(); switchKind(); setPaused(paused); paintMute(); paintIcon(document.querySelector('#btn-tumble canvas'), 'tumble', false); };
sheet.src = S.sheet;
</script>
