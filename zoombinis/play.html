<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zoombinis Player</title>
<!--
  Logical Journey of the Zoombinis (1996), in the browser, with the Fleens'
  hair on the Zoombinis - or as it shipped, with ?original.

  None of the game is in this repository. The page fetches the Zomb's Lair
  installer from archive.org through its /cors/ path (the one that sends a
  CORS header), unpacks its Game folder - Windows 3.1 with the game
  installed, and the game's CD image - with 7-Zip compiled to WebAssembly,
  applies fleen-hair.json (only what the mod changes: made by
  tools/make_web_patch.py in the zoombinis extraction project), and runs the
  result under js-dos, DOSBox compiled to WebAssembly. play-lib.js does the
  unpacking, patching and bundling; the project checks it against its own
  Python tools, and its archives come out byte for byte the same.

  js-dos keeps each bundle it loads in the browser's storage, keyed by the
  URL it fetched it from, and keys saved games the same way. So the page
  gives the bundle a fixed name - with a checksum of the patch in it, so a
  new patch builds a new one - and answers js-dos's fetch of that name by
  building it. The 245 MB download happens once; later visits start from
  storage, saves and all.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/js-dos.css">
<script src="https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/js-dos.js"></script>
<script src="play-lib.js"></script>
<style>
  :root { color-scheme: dark; --bg: #0e1220; --text: #e8e2d6; --muted: #9a917f; --accent: #f0c060; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 6px 12px; }
  header b { font-size: 1rem; }
  header a { color: var(--accent); }
  header a[aria-current] { color: var(--text); text-decoration: none; font-weight: 600; }
  #status { color: var(--muted); font-size: 0.85rem; }
  #status.error { color: #ff8f7a; }
  #fallback { display: none; font-size: 0.85rem; }
  #fallback.shown { display: inline; }
  #fallback label { color: var(--accent); text-decoration: underline; cursor: pointer; }
  #fallback input { display: none; }
  #dos { flex: 1; min-height: 0; }
</style>
</head>
<body>
<header>
  <b>Zoombinis</b>
  <a href="?" id="mod">Fleen hair</a>
  <a href="?original" id="original">Original</a>
  <span id="status">Starting…</span>
  <span id="fallback">- or <label>use the installer on this device<input type="file" id="file"></label>
    (<i>Logical Journey of the Zoombinis.exe</i>, from archive.org's Zomb's Lair item)</span>
</header>
<div id="dos"></div>
<script>
'use strict';

const INSTALLER = 'https://archive.org/cors/LogicalJourneyOfTheZoombinis-ZombsLair/Logical%20Journey%20of%20the%20Zoombinis.exe';
const ITEM = 'https://archive.org/details/LogicalJourneyOfTheZoombinis-ZombsLair';
const JSDOS = 'https://cdn.jsdelivr.net/npm/js-dos@8.4.1/dist/';
const original = new URLSearchParams(location.search).has('original');
document.getElementById(original ? 'original' : 'mod').setAttribute('aria-current', 'page');

const statusEl = document.getElementById('status');
function say(text, error = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle('error', error);
}
const MB = n => (n / 1e6).toFixed(0) + ' MB';
const TOUCH = matchMedia('(pointer: coarse)').matches;

// The installer: a file chosen here if there is one, otherwise archive.org.
let chosen = null;
async function installer() {
  if (chosen) return chosen;
  say('Downloading the game from archive.org… (once; about 245 MB)');
  const res = await realFetch(INSTALLER);
  if (!res.ok) throw new Error(`archive.org answered ${res.status}`);
  const total = Number(res.headers.get('Content-Length')) || 245577757;
  const reader = res.body.getReader(), chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value); got += value.length;
    say(`Downloading the game from archive.org: ${MB(got)} of ${MB(total)} (once)`);
  }
  return new Blob(chunks);
}

// Build the js-dos bundle: download, unpack, patch, zip.
async function build(patch) {
  const exe = await installer();
  say('Unpacking Windows 3.1 and the game…');
  const game = await ZoombiniPlay.unpack(exe);
  say(patch ? 'Putting the Fleens’ hair on the Zoombinis…' : 'Packing the game for js-dos…');
  await new Promise(r => setTimeout(r, 30));             // let the message paint
  const blob = new Blob(ZoombiniPlay.bundle(game, patch));
  say('Starting Windows 3.1…');
  return new Response(blob, { status: 200, headers: { 'Content-Length': String(blob.size) } });
}

// js-dos fetches the bundle by name after looking in its own storage; that
// one name is answered by building it, anything else goes out as usual.
const realFetch = window.fetch.bind(window);
let bundleName = null, patchData = null;
window.fetch = (input, init) => {
  const url = typeof input === 'string' ? input : input.url;
  if (bundleName && url === bundleName) {
    return build(patchData).catch(e => {
      say(`Could not get the game: ${e.message}. `, true);
      document.getElementById('fallback').classList.add('shown');
      throw e;
    });
  }
  return realFetch(input, init);
};

let dos = null;
async function start() {
  if (dos && dos.stop) { try { await dos.stop(); } catch (e) {} }
  document.getElementById('dos').innerHTML = '';
  let tag = 'original';
  patchData = null;
  if (!original) {
    const text = await (await realFetch('fleen-hair.json')).text();
    patchData = JSON.parse(text);
    tag = 'fleen-hair-' + ZoombiniPlay.crc32(new TextEncoder().encode(text)).toString(16);
  }
  bundleName = `zoombinis-${tag}.jsdos`;
  say(chosen ? 'Using the installer from this device…' : 'Looking for the game in this browser…');
  dos = Dos(document.getElementById('dos'), {
    url: bundleName,
    pathPrefix: JSDOS + 'emulators/',
    autoStart: true,
    // Windows 3.1 only understands a mouse that moves, not one that jumps to
    // where the finger is: js-dos's default turns each touch into a move
    // towards that spot, Windows accelerates it, and the pointer falls short
    // of the edges (the builder's tiles, at the bottom, were out of reach).
    // Captured, a touch screen is a trackpad - drag to move, tap to click -
    // and a mouse is locked to the game, as Windows expects.
    mouseCapture: true,
    onEvent: event => {
      if (event === 'ci-ready') say(TOUCH
        ? 'Running. Drag anywhere to move the pointer, like a trackpad; tap to click.'
        : 'Running. Click the game to use the mouse; Esc gives it back.');
    },
  });
}

document.getElementById('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  chosen = f;
  document.getElementById('fallback').classList.remove('shown');
  start().catch(err => say('Could not start: ' + err.message, true));
});

start().catch(err => say('Could not start: ' + err.message, true));
</script>
</body>
</html>
