<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Scaler</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .controls {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            max-width: 900px;
            width: 100%;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input, select, button {
            padding: 8px 12px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #2a2a2a;
            color: #fff;
            font-size: 14px;
        }
        button {
            background: #007bff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        canvas {
            border: 1px solid #333;
            background-color: #000;
            max-width: 100%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .pixelated {
            image-rendering: pixelated;
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-group">
            <label for="videoUpload">Load Video:</label>
            <input type="file" id="videoUpload" accept="video/*">
        </div>
        
        <div class="control-group">
            <label for="outWidth">Width (px):</label>
            <input type="number" id="outWidth" value="1280" style="width: 80px;">
        </div>

        <div class="control-group">
            <label for="outHeight">Height (px):</label>
            <input type="number" id="outHeight" value="720" style="width: 80px;">
        </div>

        <div class="control-group">
            <label for="targetFps">Target FPS:</label>
            <input type="number" id="targetFps" value="60" min="1" max="144" style="width: 70px;" title="Set to lower values (e.g. 12 or 15) for a retro feel">
        </div>

        <div class="control-group">
            <label for="algoSelect">Scaling Algorithm:</label>
            <select id="algoSelect">
                <option value="smooth">Smooth (Bilinear/Bicubic)</option>
                <option value="nearest">Nearest Neighbor (Pixelated)</option>
            </select>
        </div>

        <div class="control-group" style="flex-direction: row; align-items: flex-end; height: 100%;">
            <button id="playBtn">Play / Pause</button>
        </div>
    </div>

    <video id="sourceVideo" style="display: none;" loop playsinline></video>
    <canvas id="outputCanvas"></canvas>

    <script>
        const videoUpload = document.getElementById('videoUpload');
        const sourceVideo = document.getElementById('sourceVideo');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        const outWidthInput = document.getElementById('outWidth');
        const outHeightInput = document.getElementById('outHeight');
        const targetFpsInput = document.getElementById('targetFps');
        const algoSelect = document.getElementById('algoSelect');
        const playBtn = document.getElementById('playBtn');

        let animationFrameId = null;
        let lastDrawTime = 0;
        let fpsInterval = 1000 / 60; // Default to 60fps

        // Handle video upload
        videoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const fileURL = URL.createObjectURL(file);
            sourceVideo.src = fileURL;
            sourceVideo.load();
            
            sourceVideo.onloadeddata = () => {
                updateCanvasSize();
                updateFps();
                sourceVideo.play();
                startRenderLoop();
            };
        });

        // Toggle Play/Pause
        playBtn.addEventListener('click', () => {
            if (sourceVideo.paused) {
                sourceVideo.play();
            } else {
                sourceVideo.pause();
            }
        });

        // Update settings dynamically
        outWidthInput.addEventListener('change', updateCanvasSize);
        outHeightInput.addEventListener('change', updateCanvasSize);
        algoSelect.addEventListener('change', applyScalingAlgorithm);
        targetFpsInput.addEventListener('change', updateFps);

        function updateCanvasSize() {
            canvas.width = parseInt(outWidthInput.value, 10);
            canvas.height = parseInt(outHeightInput.value, 10);
            applyScalingAlgorithm(); 
        }

        function updateFps() {
            const targetFps = parseInt(targetFpsInput.value, 10);
            if (targetFps > 0) {
                fpsInterval = 1000 / targetFps;
            } else {
                fpsInterval = 1000 / 60; // Fallback
            }
            // Reset draw time so the transition is smooth
            lastDrawTime = performance.now();
        }

        function applyScalingAlgorithm() {
            const algo = algoSelect.value;
            
            if (algo === 'nearest') {
                ctx.imageSmoothingEnabled = false;
                canvas.classList.add('pixelated');
            } else {
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                canvas.classList.remove('pixelated');
            }
        }

        // Render loop: throttles the draw call based on target FPS
        function renderFrame(timestamp) {
            animationFrameId = requestAnimationFrame(renderFrame);

            if (!sourceVideo.paused && !sourceVideo.ended) {
                if (!lastDrawTime) lastDrawTime = timestamp;

                const elapsed = timestamp - lastDrawTime;

                // Only draw a new frame if enough time has passed for our target FPS
                if (elapsed >= fpsInterval) {
                    // Adjust lastDrawTime to account for slight overshoots, preventing drift
                    lastDrawTime = timestamp - (elapsed % fpsInterval);
                    
                    ctx.drawImage(sourceVideo, 0, 0, canvas.width, canvas.height);
                }
            }
        }

        function startRenderLoop() {
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            lastDrawTime = 0; // Reset time tracker
            applyScalingAlgorithm();
            animationFrameId = requestAnimationFrame(renderFrame);
        }
    </script>
</body>
</html>
