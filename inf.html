<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cythera Interactive Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #3B0000;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        .control-bank {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #3B0000;
            padding: 10px;
            gap: 15px;
            border-left: 2px solid #220000;
            border-right: 2px solid #220000;
        }

        #emulator-wrapper {
            flex-shrink: 0;
            background-color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            height: 100vh;
            width: calc(100vh * (4 / 3));
            border-left: 3px solid #C4A464;
            border-right: 3px solid #8B6914;
            box-sizing: border-box;
        }

        iframe {
            min-width: 640px !important;
            max-width: 640px !important;
            width: 640px !important;
            
            min-height: 480px !important;
            max-height: 480px !important;
            height: 480px !important;
            
            border: none;
            display: block;
            transform-origin: center center;
        }

        .render-crisp {
            image-rendering: -webkit-optimize-contrast !important;
            image-rendering: -moz-crisp-edges !important;
            image-rendering: crisp-edges !important;
            image-rendering: pixelated !important;
            filter: none !important;
        }

        /* 
         * True Pixel-Level Dedithering
         * Calls the SVG feConvolveMatrix defined in the HTML body
         */
        .render-dedither {
            image-rendering: auto !important;
            filter: url(#dedither) !important; 
        }

        .btn-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 160px;
        }

        .d-pad-grid {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .action-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .btn {
            background-color: #1E0059;
            border-top: 2px solid #C4A464;
            border-left: 2px solid #C4A464;
            border-bottom: 2px solid #8B6914;
            border-right: 2px solid #8B6914;
            color: #FCE688;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 5px;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn:active { 
            background-color: #150040;
            border-top: 2px solid #8B6914;
            border-left: 2px solid #8B6914;
            border-bottom: 2px solid #C4A464;
            border-right: 2px solid #C4A464;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .btn-utility {
            font-size: 0.85rem;
            background-color: #3B0000;
            border: 1px solid #C4A464;
            margin-top: auto;
            color: #FCE688;
        }
        
        .btn-utility:active {
            background-color: #220000;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        
        .btn-wide { grid-column: 1 / -1; margin-top: 10px; }

        @media (max-aspect-ratio: 4/3) {
            #app-container { flex-direction: column; }
            #emulator-wrapper {
                width: 100vw;
                height: calc(100vw * (3 / 4));
                border-left: none;
                border-right: none;
                border-top: 3px solid #C4A464;
                border-bottom: 3px solid #8B6914;
            }
            .control-bank {
                flex-direction: row;
                border: none;
            }
            .btn-grid { max-width: none; }
            .btn-utility { margin-top: 0; }
        }
    </style>
</head>
<body>

<!-- Hidden SVG Filter for True Dedithering -->
<!-- The convolution matrix heavily weights the center pixel but pulls exactly enough
     from the 4 surrounding checkerboard pixels to neutralize the 50/50 dither pattern -->
<svg width="0" height="0" style="position:absolute;">
  <defs>
    <filter id="dedither" x="0%" y="0%" width="100%" height="100%">
      <feConvolveMatrix order="3 3" kernelMatrix="
        0 1 0 
        1 2 1 
        0 1 0" 
        divisor="6" preserveAlpha="true" />
    </filter>
  </defs>
</svg>

<div id="app-container">
    <div class="control-bank" id="left-controls">
        <div class="btn-grid d-pad-grid">
            <div class="btn btn-up" data-code="ArrowUp">▲</div>
            <div class="btn btn-left" data-code="ArrowLeft">◄</div>
            <div class="btn btn-right" data-code="ArrowRight">►</div>
            <div class="btn btn-down" data-code="ArrowDown">▼</div>
        </div>
        <div class="btn-grid">
            <div class="btn btn-wide" data-code="Space">SPACE</div>
            <div class="btn btn-wide btn-utility" id="filter-toggle">[ Filter: Crisp ]</div>
        </div>
    </div>

    <div id="emulator-wrapper">
        <iframe src="https://infinitemac.org/embed?disk=Mac+OS+9.0&machine=Power+Macintosh+G3+%28Blue+%26+White%29&screen_update_messages=true&cdrom=https%3A%2F%2Fgardenmirror.oldapplestuff.com%2Fgames%2Fcythera_infinitemac.dsk"
            id="mac-iframe"
            class="render-crisp"
            allow="cross-origin-isolated"
            frameborder="0"></iframe>
    </div>
    
    <div class="control-bank" id="right-controls">
        <div class="btn-grid action-grid">
            <div class="btn" data-code="KeyG">Get</div>
            <div class="btn" data-code="KeyT">Talk</div>
            <div class="btn" data-code="KeyL">Look</div>
            <div class="btn" data-code="KeyU">Use</div>
            <div class="btn" data-code="KeyD">Drop</div>
            <div class="btn" data-code="KeyA">Attck</div>
        </div>
        <div class="btn-grid">
            <div class="btn btn-wide" data-code="KeyC">Cast Spell</div>
        </div>
    </div>

</div>

<script>
    const iframe = document.getElementById('mac-iframe');
    const wrapper = document.getElementById('emulator-wrapper');
    const buttons = document.querySelectorAll('.btn:not(#filter-toggle)');
    const filterToggle = document.getElementById('filter-toggle');

    function scaleIframe() {
        const wrapperRect = wrapper.getBoundingClientRect();
        const scaleX = wrapperRect.width / 640;
        const scaleY = wrapperRect.height / 480;
        const scale = Math.min(scaleX, scaleY);
        iframe.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', scaleIframe);
    setTimeout(scaleIframe, 50); 

    let isCrisp = true;
    filterToggle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isCrisp = !isCrisp;
        
        iframe.style.display = 'none';
        iframe.offsetHeight; 
        
        if (isCrisp) {
            iframe.classList.remove('render-dedither');
            iframe.classList.add('render-crisp');
            filterToggle.textContent = '[ Filter: Crisp ]';
        } else {
            iframe.classList.remove('render-crisp');
            iframe.classList.add('render-dedither');
            filterToggle.textContent = '[ Filter: Dedither ]';
        }
        
        iframe.style.display = 'block';
    });

    function sendKey(code, isKeyDown) {
        if (!iframe.contentWindow) return;
        
        iframe.contentWindow.postMessage({
            type: isKeyDown ? 'emulator_key_down' : 'emulator_key_up',
            code: code
        }, '*');
    }

    buttons.forEach(btn => {
        const keyCode = btn.getAttribute('data-code');
        
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            sendKey(keyCode, true);
        });

        btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            sendKey(keyCode, false);
        });

        btn.addEventListener('pointerleave', (e) => {
            e.preventDefault();
            sendKey(keyCode, false);
        });
    });
</script>

</body>
</html>
