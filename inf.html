<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cythera Mobile Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        /* 
         * This forces the wrapper to act as an intrinsic aspect-ratio container
         */
        #emulator-wrapper {
            flex-shrink: 0;
            background-color: #111;
            position: relative;
        }

        /* 
         * The iframe uses absolute positioning to fill the aspect-ratio box exactly.
         * By setting width/height to 100% inside a 4:3 box, Infinite Mac calculates
         * the bounding box correctly and boots at 640x480.
         */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        #controls-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
        }

        /* Portrait: Wrapper takes full width, height is calculated via padding */
        @media (max-aspect-ratio: 4/3) {
            #app-container { flex-direction: column; }
            #emulator-wrapper {
                width: 100vw;
                padding-top: 75%; /* 3/4 = 75% for 4:3 ratio */
                height: 0;
            }
        }

        /* Landscape: Wrapper takes full height, width is calculated to maintain 4:3 */
        @media (min-aspect-ratio: 4/3) {
            #app-container { flex-direction: row; }
            #emulator-wrapper {
                height: 100vh;
                width: calc(100vh * (4 / 3));
                padding-top: 0;
            }
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, min(20vw, 80px));
            grid-template-rows: repeat(3, min(20vw, 80px));
            gap: 10px;
            padding: 20px;
        }

        .btn {
            background: #333;
            border: 2px solid #555;
            border-radius: 12px;
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:active { background: #555; transform: translateY(2px); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="emulator-wrapper">
        <!-- Kept explicit width/height parameters in URL as a fail-safe -->
        <iframe src="https://infinitemac.org/embed?disk=Mac+OS+9.0&machine=Power+Macintosh+G3+%28Blue+%26+White%29&screen_update_messages=true&screen_width=640&screen_height=480&cdrom=https%3A%2F%2Fgardenmirror.oldapplestuff.com%2Fgames%2Fcythera_infinitemac.dsk"
            id="mac-iframe"
            allow="cross-origin-isolated"
            frameborder="0"></iframe>
    </div>
    
    <div id="controls-container">
        <div class="d-pad">
            <div class="btn btn-up" data-key="ArrowUp">▲</div>
            <div class="btn btn-left" data-key="ArrowLeft">◄</div>
            <div class="btn btn-right" data-key="ArrowRight">►</div>
            <div class="btn btn-down" data-key="ArrowDown">▼</div>
        </div>
    </div>
</div>

<script>
    const iframe = document.getElementById('mac-iframe');
    const buttons = document.querySelectorAll('.btn');

    function sendKey(key, isKeyDown) {
        if (!iframe.contentWindow) return;
        iframe.contentWindow.postMessage({
            type: isKeyDown ? 'keydown' : 'keyup',
            key: key
        }, '*');
    }

    buttons.forEach(btn => {
        const keyName = btn.getAttribute('data-key');
        
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            sendKey(keyName, true);
        });

        btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            sendKey(keyName, false);
        });

        btn.addEventListener('pointerleave', (e) => {
            e.preventDefault();
            sendKey(keyName, false);
        });
    });
</script>

</body>
</html>
