<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cythera Interactive Viewer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #3B0000;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: row;
        }

        .control-bank {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #3B0000;
            padding: 10px;
            gap: 15px;
            box-sizing: border-box;
        }

        #emulator-wrapper {
            flex-shrink: 0;
            background-color: #000;
            position: relative;
            overflow: hidden;
            height: 100vh;
            width: calc(100vh * (4 / 3));
        }

        #scale-target {
            width: 640px;
            height: 480px;
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
        }

        #mac-iframe, #dedither-canvas {
            width: 640px;
            height: 480px;
            position: absolute;
            top: 0;
            left: 0;
            border: none;
            display: block;
        }

        #mac-iframe {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        #dedither-canvas {
            pointer-events: none; 
            display: none;        
            /* 
             * HARDWARE SHARPENING
             * Boosts contrast to recover text legibility after the pixel blend,
             * pushing soft gray text edges back to crisp black/white.
             */
            filter: contrast(1.25) saturate(1.1); 
        }

        .btn-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 160px;
        }

        .d-pad-grid {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .action-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .btn {
            background-color: #1E0059;
            border-top: 2px solid #C4A464;
            border-left: 2px solid #C4A464;
            border-bottom: 2px solid #8B6914;
            border-right: 2px solid #8B6914;
            color: #FCE688;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 5px;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .btn:active { 
            background-color: #150040;
            border-top: 2px solid #8B6914;
            border-left: 2px solid #8B6914;
            border-bottom: 2px solid #C4A464;
            border-right: 2px solid #C4A464;
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .btn-utility {
            font-size: 0.85rem;
            background-color: #3B0000;
            border: 1px solid #C4A464;
            margin-top: auto;
            color: #FCE688;
        }
        
        .btn-utility:active { background-color: #220000; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        .btn-wide { grid-column: 1 / -1; margin-top: 10px; }

        @media (min-aspect-ratio: 4/3) {
            #left-controls { border-right: 3px solid #C4A464; }
            #right-controls { border-left: 3px solid #8B6914; }
        }

        @media (max-aspect-ratio: 4/3) {
            #app-container { flex-direction: column; }
            #emulator-wrapper {
                width: 100vw;
                height: calc(100vw * (3 / 4));
            }
            #left-controls { border-bottom: 3px solid #C4A464; }
            #right-controls { border-top: 3px solid #8B6914; }
            
            .control-bank { flex-direction: row; }
            .btn-grid { max-width: none; }
            .btn-utility { margin-top: 0; }
        }
    </style>
</head>
<body>

<div id="app-container">
    <div class="control-bank" id="left-controls">
        <div class="btn-grid d-pad-grid">
            <div class="btn btn-up" data-code="ArrowUp">▲</div>
            <div class="btn btn-left" data-code="ArrowLeft">◄</div>
            <div class="btn btn-right" data-code="ArrowRight">►</div>
            <div class="btn btn-down" data-code="ArrowDown">▼</div>
        </div>
        <div class="btn-grid">
            <div class="btn btn-wide" data-code="Space">SPACE</div>
            <div class="btn btn-wide btn-utility" id="filter-toggle">[ Filter: Crisp ]</div>
        </div>
    </div>

    <div id="emulator-wrapper">
        <div id="scale-target">
            <iframe src="https://infinitemac.org/embed?disk=Mac+OS+9.0&machine=Power+Macintosh+G3+%28Blue+%26+White%29&screen_update_messages=true&cdrom=https%3A%2F%2Fgardenmirror.oldapplestuff.com%2Fgames%2Fcythera_infinitemac.dsk"
                id="mac-iframe"
                allow="cross-origin-isolated"
                frameborder="0"></iframe>
            
            <canvas id="dedither-canvas" width="640" height="480"></canvas>
        </div>
    </div>
    
    <div class="control-bank" id="right-controls">
        <div class="btn-grid action-grid">
            <div class="btn" data-code="KeyG">Get</div>
            <div class="btn" data-code="KeyT">Talk</div>
            <div class="btn" data-code="KeyL">Look</div>
            <div class="btn" data-code="KeyU">Use</div>
            <div class="btn" data-code="KeyD">Drop</div>
            <div class="btn" data-code="KeyA">Attck</div>
        </div>
        <div class="btn-grid">
            <div class="btn btn-wide" data-code="KeyC">Cast Spell</div>
        </div>
    </div>
</div>

<script>
    const iframe = document.getElementById('mac-iframe');
    const scaleTarget = document.getElementById('scale-target');
    const wrapper = document.getElementById('emulator-wrapper');
    const buttons = document.querySelectorAll('.btn:not(#filter-toggle)');
    const filterToggle = document.getElementById('filter-toggle');
    const canvas = document.getElementById('dedither-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    
    const offCanvas = document.createElement('canvas');
    offCanvas.width = 640;
    offCanvas.height = 480;
    const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });

    function scaleIframe() {
        const wrapperRect = wrapper.getBoundingClientRect();
        const scale = wrapperRect.width / 640;
        scaleTarget.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', scaleIframe);
    setTimeout(scaleIframe, 50); 

    let isCrisp = true;
    filterToggle.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isCrisp = !isCrisp;
        
        if (isCrisp) {
            canvas.style.display = 'none';
            filterToggle.textContent = '[ Filter: Crisp ]';
        } else {
            canvas.style.display = 'block';
            filterToggle.textContent = '[ Filter: Dedither ]';
        }
    });

    window.addEventListener("message", e => {
        if (!isCrisp && e.data && e.data.type === "emulator_screen" && e.data.data) {
            try {
                const w = e.data.width || 640;
                const h = e.data.height || 480;
                const imgData = new ImageData(new Uint8ClampedArray(e.data.data), w, h);
                offCtx.putImageData(imgData, 0, 0);

                // DRAW 1: Base image at full opacity (Anchors the text so it stays legible)
                ctx.globalAlpha = 1.0;
                ctx.drawImage(offCanvas, 0, 0);
                
                // DRAW 2 & 3: Bleed the pixels 1 unit over to melt the checkerboards.
                // We use 33% opacity so the original text pixels remain the darkest/strongest.
                ctx.globalAlpha = 0.33;
                ctx.drawImage(offCanvas, 1, 0); 
                ctx.drawImage(offCanvas, 0, 1);
                
            } catch (err) {
                console.error("Canvas dedither error:", err);
            }
        }
    });

    function sendKey(code, isKeyDown) {
        if (!iframe.contentWindow) return;
        iframe.contentWindow.postMessage({
            type: isKeyDown ? 'emulator_key_down' : 'emulator_key_up',
            code: code
        }, '*');
    }

    buttons.forEach(btn => {
        const keyCode = btn.getAttribute('data-code');
        
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            sendKey(keyCode, true);
        });

        btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            sendKey(keyCode, false);
        });

        btn.addEventListener('pointerleave', (e) => {
            e.preventDefault();
            sendKey(keyCode, false);
        });
    });
</script>

</body>
</html>
