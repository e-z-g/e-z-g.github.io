<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cythera Mobile Player</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
        }

        #emulator-wrapper {
            flex-shrink: 0;
            background-color: #111;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 
         * Crucial Fix: Force the iframe to be exactly 640x480 in the DOM.
         * Using min/max properties prevents mobile browsers from squishing it 
         * to 393px wide, which stops Infinite Mac from downscaling the monitor.
         */
        iframe {
            min-width: 640px !important;
            max-width: 640px !important;
            width: 640px !important;
            
            min-height: 480px !important;
            max-height: 480px !important;
            height: 480px !important;
            
            border: none;
            display: block;
            transform-origin: center center;
        }

        #controls-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1a1a1a;
        }

        /* Landscape */
        @media (min-aspect-ratio: 4/3) {
            #app-container { flex-direction: row; }
            #emulator-wrapper {
                height: 100vh;
                width: calc(100vh * (4 / 3));
                justify-content: flex-start;
            }
            iframe { transform-origin: left center; }
        }

        /* Portrait */
        @media (max-aspect-ratio: 4/3) {
            #app-container { flex-direction: column; }
            #emulator-wrapper {
                width: 100vw;
                height: calc(100vw * (3 / 4));
                align-items: flex-start;
            }
            iframe { transform-origin: center top; }
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, min(20vw, 80px));
            grid-template-rows: repeat(3, min(20vw, 80px));
            gap: 10px;
            padding: 20px;
        }

        .btn {
            background: #333;
            border: 2px solid #555;
            border-radius: 12px;
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn:active { background: #555; transform: translateY(2px); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="emulator-wrapper">
        <iframe src="https://infinitemac.org/embed?disk=Mac+OS+9.0&machine=Power+Macintosh+G3+%28Blue+%26+White%29&screen_update_messages=true&cdrom=https%3A%2F%2Fgardenmirror.oldapplestuff.com%2Fgames%2Fcythera_infinitemac.dsk"
            id="mac-iframe"
            allow="cross-origin-isolated"
            frameborder="0"></iframe>
    </div>
    
    <div id="controls-container">
        <div class="d-pad">
            <div class="btn btn-up" data-key="ArrowUp">▲</div>
            <div class="btn btn-left" data-key="ArrowLeft">◄</div>
            <div class="btn btn-right" data-key="ArrowRight">►</div>
            <div class="btn btn-down" data-key="ArrowDown">▼</div>
        </div>
    </div>
</div>

<script>
    const iframe = document.getElementById('mac-iframe');
    const wrapper = document.getElementById('emulator-wrapper');
    const buttons = document.querySelectorAll('.btn');

    // Visually scale the 640x480 iframe back down to fit the phone screen
    function scaleIframe() {
        const wrapperRect = wrapper.getBoundingClientRect();
        const scaleX = wrapperRect.width / 640;
        const scaleY = wrapperRect.height / 480;
        const scale = Math.min(scaleX, scaleY);
        iframe.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', scaleIframe);
    setTimeout(scaleIframe, 50); // Run slightly after DOM load

    function sendKey(key, isKeyDown) {
        if (!iframe.contentWindow) return;
        iframe.contentWindow.postMessage({
            type: isKeyDown ? 'keydown' : 'keyup',
            key: key
        }, '*');
    }

    buttons.forEach(btn => {
        const keyName = btn.getAttribute('data-key');
        
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            sendKey(keyName, true);
        });

        btn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            sendKey(keyName, false);
        });

        btn.addEventListener('pointerleave', (e) => {
            e.preventDefault();
            sendKey(keyName, false);
        });
    });
</script>

</body>
</html>
