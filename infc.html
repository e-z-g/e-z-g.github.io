<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>Cythera Mobile Fullscreen</title>

  <style>
    :root {
      --gold: #c4a464;
      --dark-gold: #8b6914;
      --panel: rgba(59, 0, 0, 0.86);
      --purple: #1e0059;
      --yellow: #fce688;
    }

    html,
    body {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: "Courier New", Courier, monospace;
      touch-action: none;
    }

    #app-container,
    #emulator-wrapper,
    #pan-zoom-container,
    #scale-target,
    #mac-iframe,
    #gl-canvas,
    #touch-overlay {
      position: absolute;
      inset: 0;
    }

    #app-container {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    #emulator-wrapper {
      z-index: 1;
      overflow: hidden;
    }

    #pan-zoom-container {
      transform-origin: top left;
      will-change: transform;
    }

    #scale-target {
      transform-origin: top left;
      will-change: transform;
    }

    #mac-iframe,
    #gl-canvas,
    #touch-overlay {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      image-rendering: pixelated;
    }

    #mac-iframe {
      image-rendering: crisp-edges;
      image-rendering: -webkit-optimize-contrast;
    }

    #gl-canvas {
      display: none;
      pointer-events: none;
    }

    #touch-overlay {
      z-index: 10;
      touch-action: none;
      background: transparent;
    }

    #hud-layer {
      position: absolute;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    .hud-window {
      position: absolute;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      background: var(--panel);
      border: 2px solid var(--dark-gold);
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .hud-header {
      padding: 4px 8px;
      color: #3b0000;
      background: var(--gold);
      border-bottom: 2px solid var(--dark-gold);
      font-size: 0.75rem;
      font-weight: bold;
      text-align: center;
      touch-action: none;
      cursor: grab;
    }

    .hud-header::before {
      content: "✥";
      float: left;
      opacity: 0.55;
    }

    .hud-content {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      touch-action: none;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(12vw, 45px));
      grid-template-rows: repeat(3, minmax(12vw, 45px));
      gap: 4px;
    }

    .btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      color: var(--yellow);
      background: var(--purple);
      border-top: 2px solid var(--gold);
      border-right: 2px solid var(--dark-gold);
      border-bottom: 2px solid var(--dark-gold);
      border-left: 2px solid var(--gold);
      box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.55);
      cursor: pointer;
      font-size: 0.65rem;
      font-weight: bold;
      line-height: 1.1;
      text-align: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn .emoji {
      margin-bottom: 1px;
      font-size: 1.1rem;
      line-height: 1;
    }

    .btn:active,
    .btn.pressed {
      background: #150040;
      border-top-color: var(--dark-gold);
      border-right-color: var(--gold);
      border-bottom-color: var(--gold);
      border-left-color: var(--dark-gold);
      box-shadow: none;
    }

    .btn.active-action {
      background: #7a0000 !important;
      border-color: var(--yellow) !important;
      box-shadow: 0 0 10px var(--yellow) !important;
    }

    .gesture-active {
      outline: 2px solid rgba(252, 230, 136, 0.85);
      outline-offset: 2px;
    }

    #gesture-feedback {
      position: absolute;
      z-index: 2000;
      top: 13%;
      left: 50%;
      padding: 6px 11px;
      color: white;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(252, 230, 136, 0.65);
      border-radius: 7px;
      font-size: 0.86rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(-4px);
      transition: opacity 110ms ease, transform 110ms ease;
    }

    #gesture-feedback.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #settings-drawer {
      position: absolute;
      z-index: 1000;
      bottom: 0;
      left: 50%;
      width: 90%;
      max-width: 400px;
      background: rgba(59, 0, 0, 0.95);
      border: 2px solid var(--dark-gold);
      border-bottom: 0;
      border-radius: 12px 12px 0 0;
      pointer-events: auto;
      transform: translateX(-50%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      touch-action: none;
    }

    #settings-drawer.collapsed {
      transform: translateX(-50%) translateY(calc(100% - 28px));
    }

    #settings-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 28px;
      color: var(--yellow);
      border-bottom: 1px solid rgba(196, 164, 100, 0.3);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
      touch-action: none;
    }

    #settings-content {
      display: flex;
      justify-content: space-around;
      gap: 10px;
      padding: 10px;
    }

    .settings-btn {
      flex: 1;
      height: 48px;
      padding: 5px 0;
      font-size: 0.7rem;
    }

    #hidden-keyboard {
      position: absolute;
      top: -1000px;
      left: -1000px;
      opacity: 0;
      pointer-events: none;
    }

    @media (max-width: 430px) {
      .btn-grid {
        grid-template-columns: repeat(3, minmax(11vw, 41px));
        grid-template-rows: repeat(3, minmax(11vw, 41px));
      }

      .hud-content {
        padding: 4px;
      }
    }
  </style>
</head>

<body>
  <div id="app-container">
    <div id="emulator-wrapper">
      <div id="pan-zoom-container">
        <div id="scale-target">
          <iframe
            id="mac-iframe"
            width="640"
            frameborder="0"
            allow="cross-origin-isolated"
            src="https://infinitemac.org/embed?disk=MacOS8.0&infinitehd=true&saved_hd=true&machine=Quadra650&autopause=true&screenupdatemessages=true&settings=%7B%22swapControlAndCommand%22%3Afalse%2C%22speed%22%3A-1%2C%22useMouseDeltas%22%3Afalse%2C%22trackpadMode%22%3Afalse%7D&cdrom=https%3A%2F%2Fgardenmirror.oldapplestuff.com%2Fgames%2Fcytherainfinitemac.dsk"
          ></iframe>

          <canvas id="gl-canvas"></canvas>
          <div id="touch-overlay"></div>
        </div>
      </div>
    </div>

    <div id="hud-layer">
      <div id="gesture-feedback" aria-live="polite"></div>

      <div
        id="hud-dpad"
        class="hud-window"
        style="left: 10px; bottom: 45px;"
      >
        <div class="hud-header">MOVEMENT</div>
        <div class="hud-content">
          <div class="btn-grid">
            <div class="btn dir-btn" data-code="Numpad7"><span class="emoji">↖️</span></div>
            <div class="btn dir-btn" data-code="Numpad8"><span class="emoji">⬆️</span></div>
            <div class="btn dir-btn" data-code="Numpad9"><span class="emoji">↗️</span></div>

            <div class="btn dir-btn" data-code="Numpad4"><span class="emoji">⬅️</span></div>
            <div class="btn" data-code="Space"><span class="emoji">⏱️</span>SPC</div>
            <div class="btn dir-btn" data-code="Numpad6"><span class="emoji">➡️</span></div>

            <div class="btn dir-btn" data-code="Numpad1"><span class="emoji">↙️</span></div>
            <div class="btn dir-btn" data-code="Numpad2"><span class="emoji">⬇️</span></div>
            <div class="btn dir-btn" data-code="Numpad3"><span class="emoji">↘️</span></div>
          </div>
        </div>
      </div>

      <div
        id="hud-actions"
        class="hud-window"
        style="right: 10px; bottom: 45px;"
      >
        <div class="hud-header">ACTIONS</div>
        <div class="hud-content">
          <div class="btn-grid">
            <div class="btn action-btn" data-code="KeyG"><span class="emoji">✋</span>Get</div>
            <div class="btn action-btn" data-code="KeyT"><span class="emoji">💬</span>Talk</div>
            <div class="btn action-btn" data-code="KeyL"><span class="emoji">👁️</span>Look</div>

            <div class="btn action-btn" data-code="KeyU"><span class="emoji">🖐️</span>Use</div>
            <div class="btn action-btn" data-code="KeyD"><span class="emoji">📥</span>Drop</div>
            <div class="btn action-btn" data-code="KeyA"><span class="emoji">⚔️</span>Atk</div>

            <div class="btn action-btn" data-code="KeyC"><span class="emoji">✨</span>Cast</div>
            <div class="btn" id="kb-toggle"><span class="emoji">⌨️</span>Keyb</div>
            <div class="btn" data-code="Enter"><span class="emoji">↩️</span>Ent</div>
          </div>
        </div>
      </div>

      <div id="settings-drawer" class="collapsed">
        <div id="settings-handle">⚙️ SETTINGS ⚙️</div>
        <div id="settings-content">
          <div id="trackpad-toggle" class="btn settings-btn">
            <span class="emoji">☝️</span>Direct
          </div>
          <div id="filter-toggle" class="btn settings-btn">
            <span class="emoji">◫</span>Crisp
          </div>
          <div id="pause-btn" class="btn settings-btn">
            <span class="emoji">⏸️</span>Pause
          </div>
        </div>
      </div>

      <input
        id="hidden-keyboard"
        type="text"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
      >
    </div>
  </div>

  <script>
    const MAC_ORIGIN = "https://infinitemac.org";

    const iframe = document.getElementById("mac-iframe");
    const scaleTarget = document.getElementById("scale-target");
    const panZoomContainer = document.getElementById("pan-zoom-container");
    const touchOverlay = document.getElementById("touch-overlay");
    const feedback = document.getElementById("gesture-feedback");

    const moveWindow = document.getElementById("hud-dpad");
    const actionWindow = document.getElementById("hud-actions");

    const baseWidth = 640;
    const baseHeight = Math.round(baseWidth * window.innerHeight / window.innerWidth);

    let cssScale = 1;

    function updateBaseScale() {
      cssScale = window.innerWidth / baseWidth;

      scaleTarget.style.width = `${baseWidth}px`;
      scaleTarget.style.height = `${baseHeight}px`;
      scaleTarget.style.transform = `scale(${cssScale})`;
    }

    updateBaseScale();
    window.addEventListener("resize", updateBaseScale);

    function postToMac(message) {
      if (!iframe.contentWindow) return;
      iframe.contentWindow.postMessage(message, MAC_ORIGIN);
    }

    function sendKey(code, isKeyDown) {
      postToMac({
        type: isKeyDown ? "emulatorkeydown" : "emulatorkeyup",
        code
      });
    }

    function tapKey(code, duration = 42) {
      sendKey(code, true);
      window.setTimeout(() => sendKey(code, false), duration);
    }

    function showFeedback(label) {
      feedback.textContent = label;
      feedback.classList.add("visible");

      clearTimeout(showFeedback.timeout);
      showFeedback.timeout = window.setTimeout(() => {
        feedback.classList.remove("visible");
      }, 430);

      if (navigator.vibrate) navigator.vibrate(8);
    }

    function clearActionHighlight() {
      document.querySelectorAll(".action-btn").forEach(button => {
        button.classList.remove("active-action");
      });
    }

    function selectAction(code, label) {
      tapKey(code);
      clearActionHighlight();

      const button = document.querySelector(`.action-btn[data-code="${code}"]`);
      if (button) button.classList.add("active-action");

      showFeedback(label);
    }

    /* Draggable HUD windows */

    document.querySelectorAll(".hud-window").forEach(windowElement => {
      const header = windowElement.querySelector(".hud-header");

      let dragging = false;
      let startX = 0;
      let startY = 0;
      let initialLeft = 0;
      let initialTop = 0;

      header.addEventListener("pointerdown", event => {
        event.preventDefault();
        event.stopPropagation();

        dragging = true;
        header.setPointerCapture(event.pointerId);

        const rect = windowElement.getBoundingClientRect();
        startX = event.clientX;
        startY = event.clientY;
        initialLeft = rect.left;
        initialTop = rect.top;

        windowElement.style.zIndex = "1200";
      });

      header.addEventListener("pointermove", event => {
        if (!dragging) return;

        event.preventDefault();

        windowElement.style.left = `${initialLeft + event.clientX - startX}px`;
        windowElement.style.top = `${initialTop + event.clientY - startY}px`;
        windowElement.style.right = "auto";
        windowElement.style.bottom = "auto";
      });

      function stopDragging() {
        dragging = false;
        windowElement.style.zIndex = "";
      }

      header.addEventListener("pointerup", stopDragging);
      header.addEventListener("pointercancel", stopDragging);
    });

    /* Settings */

    const settingsDrawer = document.getElementById("settings-drawer");
    const settingsHandle = document.getElementById("settings-handle");
    const trackpadToggle = document.getElementById("trackpad-toggle");
    const filterToggle = document.getElementById("filter-toggle");
    const pauseButton = document.getElementById("pause-btn");

    settingsHandle.addEventListener("pointerdown", event => {
      event.preventDefault();
      settingsDrawer.classList.toggle("collapsed");
    });

    let isTrackpadMode = false;

    trackpadToggle.addEventListener("pointerdown", event => {
      event.preventDefault();
      event.stopPropagation();

      isTrackpadMode = !isTrackpadMode;
      trackpadToggle.innerHTML = isTrackpadMode
        ? '<span class="emoji">🖱️</span>Trackpad'
        : '<span class="emoji">☝️</span>Direct';

      showFeedback(isTrackpadMode ? "TRACKPAD" : "DIRECT");
    });

    let isPaused = false;

    pauseButton.addEventListener("pointerdown", event => {
      event.preventDefault();
      event.stopPropagation();

      isPaused = !isPaused;
      postToMac({ type: isPaused ? "emulatorpause" : "emulatorunpause" });

      pauseButton.innerHTML = isPaused
        ? '<span class="emoji">▶️</span>Play'
        : '<span class="emoji">⏸️</span>Pause';

      showFeedback(isPaused ? "PAUSED" : "PLAY");
    });

    /*
      Direction recognizer

      Indexes correspond to a clockwise compass beginning at east:
      E, SE, S, SW, W, NW, N, NE.
    */

    const DIRECTION_KEYS = [
      "Numpad6",
      "Numpad3",
      "Numpad2",
      "Numpad1",
      "Numpad4",
      "Numpad7",
      "Numpad8",
      "Numpad9"
    ];

    const DIRECTION_LABELS = [
      "E",
      "SE",
      "S",
      "SW",
      "W",
      "NW",
      "N",
      "NE"
    ];

    function directionFromVector(dx, dy) {
      const angle = Math.atan2(-dy, dx);
      const octant = Math.round(angle / (Math.PI / 4));
      const index = (octant + 8) % 8;

      return {
        index,
        key: DIRECTION_KEYS[index],
        label: DIRECTION_LABELS[index]
      };
    }

    /*
      Continuous movement gesture.

      A swipe that crosses the threshold presses and holds the appropriate
      numpad direction. Sliding the held finger into another octant releases
      the old direction and holds the new one. Releasing the finger releases
      the final direction.

      This deliberately uses a real held key rather than rapid repeated
      key taps. Cythera can therefore apply its own normal key-repeat behavior.
    */

    function installMovementGesture(windowElement) {
      const content = windowElement.querySelector(".hud-content");
      const minDistance = 20;

      let gesture = null;

      function releaseDirection() {
        if (!gesture || !gesture.currentDirection) return;
        sendKey(gesture.currentDirection.key, false);
        gesture.currentDirection = null;
      }

      function beginDirection(direction) {
        if (!gesture) return;

        if (
          gesture.currentDirection &&
          gesture.currentDirection.index === direction.index
        ) {
          return;
        }

        releaseDirection();
        gesture.currentDirection = direction;

        sendKey(direction.key, true);
        showFeedback(direction.label);
      }

      content.addEventListener("pointerdown", event => {
        if (event.target.closest(".btn")) return;

        event.preventDefault();
        event.stopPropagation();
        content.setPointerCapture(event.pointerId);

        gesture = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          currentDirection: null
        };

        windowElement.classList.add("gesture-active");
      });

      content.addEventListener("pointermove", event => {
        if (!gesture || event.pointerId !== gesture.pointerId) return;

        event.preventDefault();

        const dx = event.clientX - gesture.startX;
        const dy = event.clientY - gesture.startY;

        if (Math.hypot(dx, dy) < minDistance) return;

        beginDirection(directionFromVector(dx, dy));
      });

      function endMovementGesture(event) {
        if (!gesture || event.pointerId !== gesture.pointerId) return;

        event.preventDefault();
        releaseDirection();

        gesture = null;
        windowElement.classList.remove("gesture-active");
      }

      content.addEventListener("pointerup", endMovementGesture);
      content.addEventListener("pointercancel", endMovementGesture);
      content.addEventListener("lostpointercapture", endMovementGesture);
    }

    installMovementGesture(moveWindow);

    /*
      Action gestures.

      These operate only in blank space around the buttons, so the visible
      buttons remain available and retain their existing direct behavior.

      Tap: Attack
      Swipe up: Get
      Swipe down: Drop
      Swipe left: Look
      Swipe right: Talk
      Hold: Use
      Two-finger tap: Cast
    */

    function installActionGestures(windowElement) {
      const content = windowElement.querySelector(".hud-content");

      const tapDistance = 16;
      const swipeDistance = 30;
      const holdDelay = 480;

      let gesture = null;

      function endGesture(event) {
        if (!gesture || event.pointerId !== gesture.pointerId) return;

        event.preventDefault();
        clearTimeout(gesture.holdTimer);

        const dx = event.clientX - gesture.startX;
        const dy = event.clientY - gesture.startY;
        const distance = Math.hypot(dx, dy);
        const elapsed = performance.now() - gesture.startedAt;
        const didHold = gesture.didHold;

        gesture = null;
        windowElement.classList.remove("gesture-active");

        if (didHold) return;

        if (distance <= tapDistance && elapsed < holdDelay) {
          selectAction("KeyA", "ATTACK");
          return;
        }

        if (distance < swipeDistance) return;

        if (Math.abs(dx) > Math.abs(dy)) {
          if (dx > 0) selectAction("KeyT", "TALK");
          else selectAction("KeyL", "LOOK");
        } else if (dy < 0) {
          selectAction("KeyG", "GET");
        } else {
          selectAction("KeyD", "DROP");
        }
      }

      content.addEventListener("pointerdown", event => {
        if (event.target.closest(".btn")) return;

        event.preventDefault();
        event.stopPropagation();
        content.setPointerCapture(event.pointerId);

        gesture = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          startedAt: performance.now(),
          didHold: false,
          holdTimer: null
        };

        windowElement.classList.add("gesture-active");

        gesture.holdTimer = window.setTimeout(() => {
          if (!gesture) return;
          gesture.didHold = true;
          selectAction("KeyU", "USE");
        }, holdDelay);
      });

      content.addEventListener("pointerup", endGesture);
      content.addEventListener("pointercancel", event => {
        if (!gesture || event.pointerId !== gesture.pointerId) return;
        clearTimeout(gesture.holdTimer);
        gesture = null;
        windowElement.classList.remove("gesture-active");
      });

      content.addEventListener("lostpointercapture", event => {
        if (!gesture || event.pointerId !== gesture.pointerId) return;
        clearTimeout(gesture.holdTimer);
        gesture = null;
        windowElement.classList.remove("gesture-active");
      });

      content.addEventListener("pointerdown", event => {
        if (!event.isPrimary && event.pointerType === "touch") {
          event.preventDefault();
          event.stopPropagation();

          if (gesture) {
            clearTimeout(gesture.holdTimer);
            gesture = null;
          }

          windowElement.classList.remove("gesture-active");
          selectAction("KeyC", "CAST");
        }
      });
    }

    installActionGestures(actionWindow);

    /*
      Regular visible buttons.

      Direction buttons are intentionally held while pressed. The action
      buttons are tapped once so they select the in-game action before a
      direction is supplied.
    */

    document.querySelectorAll(".dir-btn").forEach(button => {
      let activePointer = null;

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        event.stopPropagation();

        activePointer = event.pointerId;
        button.setPointerCapture(activePointer);
        button.classList.add("pressed");

        sendKey(button.dataset.code, true);
        showFeedback(button.dataset.code.replace("Numpad", ""));
      });

      function releaseButton(event) {
        if (activePointer === null) return;
        if (event.pointerId !== activePointer) return;

        sendKey(button.dataset.code, false);
        button.classList.remove("pressed");
        activePointer = null;
      }

      button.addEventListener("pointerup", releaseButton);
      button.addEventListener("pointercancel", releaseButton);
      button.addEventListener("lostpointercapture", releaseButton);
    });

    document.querySelectorAll(".action-btn").forEach(button => {
      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        event.stopPropagation();

        const labels = {
          KeyG: "GET",
          KeyT: "TALK",
          KeyL: "LOOK",
          KeyU: "USE",
          KeyD: "DROP",
          KeyA: "ATTACK",
          KeyC: "CAST"
        };

        selectAction(button.dataset.code, labels[button.dataset.code]);
      });
    });

    document.querySelectorAll(".btn[data-code]:not(.dir-btn):not(.action-btn)").forEach(button => {
      let activePointer = null;

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        event.stopPropagation();

        activePointer = event.pointerId;
        button.setPointerCapture(activePointer);
        button.classList.add("pressed");

        sendKey(button.dataset.code, true);
      });

      function releaseButton(event) {
        if (activePointer === null) return;
        if (event.pointerId !== activePointer) return;

        sendKey(button.dataset.code, false);
        button.classList.remove("pressed");
        activePointer = null;
      }

      button.addEventListener("pointerup", releaseButton);
      button.addEventListener("pointercancel", releaseButton);
      button.addEventListener("lostpointercapture", releaseButton);
    });

    /*
      Touch mouse / pan / zoom / right-click support for the emulator area.
    */

    let pzScale = 1;
    let pzX = 0;
    let pzY = 0;

    let startDistance = 0;
    let initialPzScale = 1;
    let initialPzX = 0;
