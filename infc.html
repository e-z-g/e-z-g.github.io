<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cythera Mobile - System 7.6</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100dvh;
            background-color: #000;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        #app-container {
            width: 100vw; height: 100dvh;
            position: relative;
        }

        /* BOTTOM LAYER: Emulator & Screen */
        #emulator-wrapper {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100dvh;
            overflow: hidden;
            z-index: 1;
        }

        #pan-zoom-container {
            width: 100%; height: 100%;
            transform-origin: top left;
            will-change: transform;
            position: absolute;
            top: 0; left: 0;
        }

        #scale-target {
            transform-origin: top left;
            position: absolute;
            top: 0; left: 0;
        }

        #mac-iframe, #touch-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            display: block;
        }

        #mac-iframe {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        /* Disabled initially so the user can click the iframe's Play button */
        #touch-overlay { 
            z-index: 10; 
            touch-action: none; 
            pointer-events: none; 
        }
        #touch-overlay.active {
            pointer-events: auto;
        }


        /* TOP LAYER: HUD & Windows */
        #hud-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; 
            z-index: 100;
            opacity: 0; /* Hidden until initial tap */
            transition: opacity 0.5s ease-in;
        }
        #hud-layer.active {
            opacity: 1;
        }

        .hud-window {
            position: absolute;
            pointer-events: auto; 
            background-color: rgba(59, 0, 0, 0.85); 
            border: 2px solid #8B6914;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            min-width: 140px;
            min-height: 140px;
        }

        .hud-header {
            background-color: #C4A464;
            color: #3B0000;
            font-weight: bold;
            font-size: 0.75rem;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8B6914;
            touch-action: none;
        }
        
        .drag-handle { flex-grow: 1; cursor: move; }
        .drag-handle::before { content: '≡ '; opacity: 0.7; }

        .mode-toggle {
            background: #1E0059; color: #FCE688; border: 1px solid #8B6914;
            font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-family: inherit;
        }
        .mode-toggle.active { background: #7A0000; }

        .hud-content {
            flex: 1; position: relative; padding: 6px;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        .resize-handle {
            position: absolute; bottom: 0; right: 0; width: 20px; height: 20px; cursor: se-resize;
            background: linear-gradient(135deg, transparent 50%, #C4A464 50%); touch-action: none;
        }

        .btn-grid {
            display: grid; gap: 4px; width: 100%; height: 100%;
            grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
        }

        .gesture-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;
            background: rgba(255, 230, 136, 0.05); touch-action: none;
        }

        #joy-base {
            position: absolute; width: 50%; height: 50%; max-width: 100px; max-height: 100px;
            border: 2px solid rgba(252, 230, 136, 0.3); border-radius: 50%; transform: translate(-50%, -50%);
            display: none; pointer-events: none;
        }
        #joy-stick {
            position: absolute; width: 25%; height: 25%; max-width: 40px; max-height: 40px;
            background: rgba(252, 230, 136, 0.6); border-radius: 50%; transform: translate(-50%, -50%);
            display: none; pointer-events: none;
        }
        #gesture-canvas { width: 100%; height: 100%; pointer-events: none; }

        .btn {
            background-color: #1E0059; border: 2px solid #8B6914; border-top-color: #C4A464; border-left-color: #C4A464;
            color: #FCE688; font-size: 0.7rem; font-weight: bold; display: flex; flex-direction: column;
            align-items: center; justify-content: center; user-select: none; cursor: pointer;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.5); text-align: center; min-height: 35px;
        }
        .btn span.emoji { font-size: 1.2rem; margin-bottom: 2px; }
        .btn:active { background-color: #150040; box-shadow: none; border-color: #8B6914; border-top-color: #3B0000; border-left-color: #3B0000; }
        .active-action { background-color: #7A0000 !important; border-color: #FCE688 !important; }

        #settings-drawer {
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            background: rgba(59, 0, 0, 0.95); border: 2px solid #8B6914; border-bottom: none;
            border-radius: 12px 12px 0 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000; width: 90%; max-width: 450px; backdrop-filter: blur(4px); pointer-events: auto;
        }
        #settings-drawer.collapsed { transform: translate(-50%, calc(100% - 28px)); }
        .settings-handle { height: 28px; color: #FCE688; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.8rem; cursor: pointer; border-bottom: 1px solid rgba(196, 164, 100, 0.3); }
        .settings-content { display: flex; flex-wrap: wrap; justify-content: space-around; padding: 10px; gap: 8px; }
        .settings-btn { flex: 1 1 30%; padding: 8px 0; font-size: 0.7rem; height: auto; }

        #action-toast {
            position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(252, 230, 136, 0.9); color: #3B0000; padding: 10px 20px;
            font-size: 1.5rem; font-weight: bold; border: 2px solid #8B6914; border-radius: 8px;
            opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200;
        }
        #hidden-keyboard { position: absolute; top: -1000px; opacity: 0; pointer-events: none; }

    </style>
</head>
<body>

<div id="app-container">

    <div id="emulator-wrapper">
        <div id="pan-zoom-container">
            <div id="scale-target">
                <!-- Mac OS 7.6, speed defaults to 2, pause=true forces interaction to unlock audio -->
                <iframe src="https://infinitemac.org/embed?disk=Mac+OS+7.6&infinite_hd=true&machine=Quadra+650&pause=true&auto_pause=true&settings=%7B%22swapControlAndCommand%22%3Afalse%2C%22speed%22%3A2%2C%22useMouseDeltas%22%3Afalse%2C%22trackpadMode%22%3Afalse%7D&cdrom=https%3A%2F%2Fgardenmirror.oldapplestuff.com%2Fgames%2Fcythera_infinitemac.dsk"
                    width="640" id="mac-iframe" allow="autoplay; cross-origin-isolated" frameborder="0"></iframe>
                <div id="touch-overlay"></div>
            </div>
        </div>
    </div>

    <div id="hud-layer">
        
        <div class="hud-window" id="hud-dpad" style="left: 10px; bottom: 50px; width: 160px; height: 180px;">
            <div class="hud-header"><span class="drag-handle">MOVE</span><button class="mode-toggle">Gestures</button></div>
            <div class="hud-content">
                <div class="btn-grid">
                    <div class="btn dir-btn" data-code="Numpad7">↖️</div>
                    <div class="btn dir-btn" data-code="Numpad8">⬆️</div>
                    <div class="btn dir-btn" data-code="Numpad9">↗️</div>
                    <div class="btn dir-btn" data-code="Numpad4">⬅️</div>
                    <div class="btn" data-code="Space">⏱️</div>
                    <div class="btn dir-btn" data-code="Numpad6">➡️</div>
                    <div class="btn dir-btn" data-code="Numpad1">↙️</div>
                    <div class="btn dir-btn" data-code="Numpad2">⬇️</div>
                    <div class="btn dir-btn" data-code="Numpad3">↘️</div>
                </div>
                <div class="gesture-area" id="move-gesture-zone"><div id="joy-base"></div><div id="joy-stick"></div></div>
            </div>
            <div class="resize-handle"></div>
        </div>

        <div class="hud-window" id="hud-actions" style="right: 10px; bottom: 50px; width: 180px; height: 180px;">
            <div class="hud-header"><span class="drag-handle">ACTIONS</span><button class="mode-toggle">Gestures</button></div>
            <div class="hud-content">
                <div class="btn-grid">
                    <div class="btn action-btn" data-code="KeyG"><span class="emoji">💰</span>Get</div>
                    <div class="btn action-btn" data-code="KeyT"><span class="emoji">💬</span>Talk</div>
                    <div class="btn action-btn" data-code="KeyL"><span class="emoji">👁️</span>Look</div>
                    <div class="btn action-btn" data-code="KeyU"><span class="emoji">🖐️</span>Use</div>
                    <div class="btn action-btn" data-code="KeyD"><span class="emoji">🫳</span>Drop</div>
                    <div class="btn action-btn" data-code="KeyA"><span class="emoji">⚔️</span>Atk</div>
                    <div class="btn action-btn" data-code="KeyC"><span class="emoji">✨</span>Cast</div>
                    <div class="btn" id="kb-toggle"><span class="emoji">⌨️</span>Keyb</div>
                    <div class="btn" data-code="Enter"><span class="emoji">↩️</span>Ent</div>
                </div>
                <div class="gesture-area" id="action-gesture-zone"><canvas id="gesture-canvas"></canvas></div>
            </div>
            <div class="resize-handle"></div>
        </div>

        <div id="action-toast"></div>

        <div id="settings-drawer" class="collapsed">
            <div class="settings-handle" id="settings-handle">⚙️ DISPLAY & SETTINGS ⚙️</div>
            <div class="settings-content">
                <div class="btn settings-btn" id="touch-mode-toggle"><span class="emoji">👆</span>Direct</div>
                <div class="btn settings-btn" id="filter-toggle"><span class="emoji">📺</span>Crisp</div>
                <div class="btn settings-btn" id="pause-btn"><span class="emoji">⏸️</span>Pause</div>
                <div class="btn settings-btn" id="speed-btn"><span class="emoji">⚡</span>Spd: 2</div>
                <div class="btn settings-btn" id="mute-btn"><span class="emoji">🔊</span>Audio</div>
            </div>
        </div>

        <input type="text" id="hidden-keyboard" autocomplete="off" spellcheck="false" autocorrect="off">
    </div>

</div>

<script>
    const iframe = document.getElementById('mac-iframe');
    const scaleTarget = document.getElementById('scale-target');
    const panZoomContainer = document.getElementById('pan-zoom-container');
    const touchOverlay = document.getElementById('touch-overlay');
    const hudLayer = document.getElementById('hud-layer');

    // --- AUDIO UNLOCK & UI ACTIVATION ---
    // The emulator starts paused. When the user taps the native play button inside the iframe, 
    // the iframe steals window focus (blur event) or finishes loading.
    let hasStarted = false;
    function enableControls() {
        if (!hasStarted) {
            hasStarted = true;
            // Add a slight delay to let the emulator transition out of the play screen
            setTimeout(() => {
                touchOverlay.classList.add('active');
                hudLayer.classList.add('active');
            }, 300);
        }
    }
    window.addEventListener('blur', enableControls);
    window.addEventListener("message", e => {
        if (e.data && e.data.type === "emulator_loaded") enableControls();
    });

    // --- DYNAMIC FULLSCREEN MATH ---
    const baseWidth = 640; 
    const baseHeight = Math.round(baseWidth * (window.innerHeight / window.innerWidth));
    scaleTarget.style.width = `${baseWidth}px`;
    scaleTarget.style.height = `${baseHeight}px`;
    const cssScale = window.innerWidth / baseWidth;
    scaleTarget.style.transform = `scale(${cssScale})`;

    function sendKey(code, isKeyDown) {
        if (!iframe.contentWindow) return;
        iframe.contentWindow.postMessage({ type: isKeyDown ? 'emulator_key_down' : 'emulator_key_up', code: code }, '*');
    }

    // --- WINDOW DRAGGING, RESIZING, & GESTURE TOGGLES ---
    document.querySelectorAll('.hud-window').forEach(win => {
        const dragHandle = win.querySelector('.drag-handle');
        const resizeHandle = win.querySelector('.resize-handle');
        const toggleBtn = win.querySelector('.mode-toggle');
        const btnGrid = win.querySelector('.btn-grid');
        const gestureArea = win.querySelector('.gesture-area');
        
        let isDragging = false, dragStartX, dragStartY, initialLeft, initialTop;
        dragHandle.addEventListener('touchstart', e => {
            isDragging = true; dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
            const rect = win.getBoundingClientRect(); initialLeft = rect.left; initialTop = rect.top; win.style.zIndex = 200;
        });
        dragHandle.addEventListener('touchmove', e => {
            if (!isDragging) return; e.preventDefault(); 
            win.style.left = `${initialLeft + (e.touches[0].clientX - dragStartX)}px`; win.style.top = `${initialTop + (e.touches[0].clientY - dragStartY)}px`;
            win.style.bottom = 'auto'; win.style.right = 'auto';
        });
        dragHandle.addEventListener('touchend', () => { isDragging = false; win.style.zIndex = ''; });

        let isResizing = false, resizeStartX, resizeStartY, initialWidth, initialHeight;
        resizeHandle.addEventListener('touchstart', e => {
            isResizing = true; resizeStartX = e.touches[0].clientX; resizeStartY = e.touches[0].clientY;
            initialWidth = win.offsetWidth; initialHeight = win.offsetHeight; e.stopPropagation(); 
        });
        resizeHandle.addEventListener('touchmove', e => {
            if (!isResizing) return; e.preventDefault(); e.stopPropagation();
            win.style.width = `${Math.max(140, initialWidth + (e.touches[0].clientX - resizeStartX))}px`;
            win.style.height = `${Math.max(140, initialHeight + (e.touches[0].clientY - resizeStartY))}px`;
            if(win.id === 'hud-actions' && gestureArea.style.display === 'block') resizeGestureCanvas();
        });
        resizeHandle.addEventListener('touchend', () => isResizing = false);

        toggleBtn.addEventListener('pointerdown', e => {
            e.preventDefault(); e.stopPropagation();
            if (toggleBtn.classList.toggle('active')) {
                btnGrid.style.display = 'none'; gestureArea.style.display = 'block';
                if(win.id === 'hud-actions') resizeGestureCanvas();
            } else { btnGrid.style.display = 'grid'; gestureArea.style.display = 'none'; }
        });

        win.addEventListener('touchstart', e => e.stopPropagation());
        win.addEventListener('touchmove', e => e.stopPropagation());
        win.addEventListener('touchend', e => e.stopPropagation());
    });


    // --- JOYSTICK LOGIC (Left Window) ---
    const moveZone = document.getElementById('move-gesture-zone');
    const joyBase = document.getElementById('joy-base');
    const joyStick = document.getElementById('joy-stick');
    let moveStartX = 0, moveStartY = 0, currentMoveKey = null;

    function applyMovementKey(angleDeg, dist) {
        if (dist < 15) return null; 
        if (angleDeg >= -22.5 && angleDeg < 22.5) return 'Numpad6'; 
        if (angleDeg >= 22.5 && angleDeg < 67.5) return 'Numpad3'; 
        if (angleDeg >= 67.5 && angleDeg < 112.5) return 'Numpad2'; 
        if (angleDeg >= 112.5 && angleDeg < 157.5) return 'Numpad1'; 
        if (angleDeg >= 157.5 || angleDeg < -157.5) return 'Numpad4'; 
        if (angleDeg >= -157.5 && angleDeg < -112.5) return 'Numpad7'; 
        if (angleDeg >= -112.5 && angleDeg < -67.5) return 'Numpad8'; 
        if (angleDeg >= -67.5 && angleDeg < -22.5) return 'Numpad9'; 
        return null;
    }

    moveZone.addEventListener('touchstart', e => {
        const rect = moveZone.getBoundingClientRect();
        moveStartX = e.touches[0].clientX - rect.left; moveStartY = e.touches[0].clientY - rect.top;
        joyBase.style.left = `${moveStartX}px`; joyBase.style.top = `${moveStartY}px`;
        joyStick.style.left = `${moveStartX}px`; joyStick.style.top = `${moveStartY}px`;
        joyBase.style.display = 'block'; joyStick.style.display = 'block';
    });

    moveZone.addEventListener('touchmove', e => {
        const rect = moveZone.getBoundingClientRect();
        let dx = (e.touches[0].clientX - rect.left) - moveStartX; let dy = (e.touches[0].clientY - rect.top) - moveStartY;
        let dist = Math.hypot(dx, dy); let angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;

        let displayDist = Math.min(dist, moveZone.offsetWidth / 3);
        joyStick.style.left = `${moveStartX + Math.cos(angleDeg * Math.PI/180) * displayDist}px`;
        joyStick.style.top = `${moveStartY + Math.sin(angleDeg * Math.PI/180) * displayDist}px`;

        let newKey = applyMovementKey(angleDeg, dist);
        if (newKey !== currentMoveKey) {
            if (currentMoveKey) sendKey(currentMoveKey, false);
            if (newKey) sendKey(newKey, true);
            currentMoveKey = newKey;
        }
    });

    function stopMovement() {
        if (currentMoveKey) { sendKey(currentMoveKey, false); currentMoveKey = null; }
        joyBase.style.display = 'none'; joyStick.style.display = 'none';
    }
    moveZone.addEventListener('touchend', stopMovement);
    moveZone.addEventListener('touchcancel', stopMovement);


    // --- GESTURE LOGIC (Right Window) ---
    const actionZone = document.getElementById('action-gesture-zone');
    const gestureCanvas = document.getElementById('gesture-canvas');
    const gCtx = gestureCanvas.getContext('2d');
    const actionToast = document.getElementById('action-toast');
    let gesturePoints = [];
    
    function resizeGestureCanvas() { gestureCanvas.width = actionZone.clientWidth; gestureCanvas.height = actionZone.clientHeight; }
    function showToast(text) { actionToast.textContent = text; actionToast.style.opacity = '1'; setTimeout(() => actionToast.style.opacity = '0', 700); }

    actionZone.addEventListener('touchstart', e => {
        const rect = actionZone.getBoundingClientRect();
        gesturePoints = [{ x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top }];
        gCtx.clearRect(0, 0, gestureCanvas.width, gestureCanvas.height);
        gCtx.beginPath(); gCtx.moveTo(gesturePoints[0].x, gesturePoints[0].y);
        gCtx.strokeStyle = '#FCE688'; gCtx.lineWidth = 4; gCtx.lineCap = 'round'; gCtx.lineJoin = 'round';
    });
    actionZone.addEventListener('touchmove', e => {
        const rect = actionZone.getBoundingClientRect(); const pt = { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        gesturePoints.push(pt); gCtx.lineTo(pt.x, pt.y); gCtx.stroke();
    });
    actionZone.addEventListener('touchend', e => {
        gCtx.clearRect(0, 0, gestureCanvas.width, gestureCanvas.height);
        if(gesturePoints.length === 0) return;
        let dirs = "", currentDir = null, lastPt = gesturePoints[0];
        let totalDist = Math.hypot(gesturePoints[gesturePoints.length-1].x - gesturePoints[0].x, gesturePoints[gesturePoints.length-1].y - gesturePoints[0].y);

        for (let i = 1; i < gesturePoints.length; i++) {
            let dx = gesturePoints[i].x - lastPt.x, dy = gesturePoints[i].y - lastPt.y;
            if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
                let dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
                if (dir !== currentDir) { dirs += dir; currentDir = dir; }
                lastPt = gesturePoints[i];
            }
        }
        let actionKey = null, actionName = "";
        if (totalDist < 15 && gesturePoints.length < 10) { actionKey = 'KeyA'; actionName = "ATTACK (Tap)"; }
        else {
            if (dirs === "U" || dirs === "LU" || dirs === "RU") { actionKey = 'KeyG'; actionName = "GET (Up)"; }
            else if (dirs === "D" || dirs === "LD" || dirs === "RD") { actionKey = 'KeyD'; actionName = "DROP (Down)"; }
            else if (dirs.includes("DR")) { actionKey = 'KeyL'; actionName = "LOOK (L)"; }
            else if (dirs.includes("DRU") || dirs.includes("DLU")) { actionKey = 'KeyU'; actionName = "USE (U)"; }
            else if (dirs.includes("LDR") || dirs.includes("LD") || dirs.includes("DL")) { actionKey = 'KeyC'; actionName = "CAST (C)"; }
            else if (dirs.includes("RD") || dirs.includes("RDL")) { actionKey = 'KeyT'; actionName = "TALK (T)"; }
        }
        if (actionKey) { showToast(actionName); sendKey(actionKey, true); setTimeout(() => sendKey(actionKey, false), 50); } 
        else { showToast("?"); }
    });


    // --- SETTINGS DRAWER BUTTONS ---
    document.getElementById('settings-handle').addEventListener('pointerdown', e => {
        e.preventDefault(); document.getElementById('settings-drawer').classList.toggle('collapsed');
    });

    let touchMode = 0; // 0: Direct, 1: Trackpad, 2: Pan
    const touchModeToggle = document.getElementById('touch-mode-toggle');
    const touchModeLabels = ['<span class="emoji">👆</span>Direct', '<span class="emoji">🖱️</span>Trackpad', '<span class="emoji">🖐️</span>Pan View'];
    touchModeToggle.addEventListener('pointerdown', (e) => {
        e.preventDefault(); touchMode = (touchMode + 1) % 3; touchModeToggle.innerHTML = touchModeLabels[touchMode];
    });

    let isCrisp = true;
    const filterToggle = document.getElementById('filter-toggle');
    filterToggle.addEventListener('pointerdown', e => {
        e.preventDefault(); isCrisp = !isCrisp;
        iframe.style.imageRendering = isCrisp ? 'pixelated' : 'auto'; 
        filterToggle.innerHTML = isCrisp ? '<span class="emoji">📺</span>Crisp' : '<span class="emoji">📺</span>Smooth';
    });

    let isPaused = false;
    const pauseBtn = document.getElementById('pause-btn');
    pauseBtn.addEventListener('pointerdown', e => {
        e.preventDefault(); isPaused = !isPaused;
        if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: isPaused ? 'emulator_pause' : 'emulator_unpause' }, '*');
        pauseBtn.innerHTML = isPaused ? '<span class="emoji">▶️</span>Play' : '<span class="emoji">⏸️</span>Pause';
    });

    let currentSpeed = 2;
    const speedBtn = document.getElementById('speed-btn');
    speedBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        let speeds = [-2, -1, 0, 1, 2];
        let newSpeed = speeds[(speeds.indexOf(currentSpeed) + 1) % speeds.length];
        
        if(confirm(`Set CPU Speed to ${newSpeed}? \n\nWARNING: This will restart the emulated Mac and you will lose any unsaved progress.`)) {
            currentSpeed = newSpeed;
            speedBtn.innerHTML = `<span class="emoji">⚡</span>Spd: ${currentSpeed}`;
            const settingsObj = { swapControlAndCommand: false, speed: currentSpeed, useMouseDeltas: false, trackpadMode: false };
            const settingsStr = encodeURIComponent(JSON.stringify(settingsObj));
            iframe.src = `https://infinitemac.org/embed?disk=Mac+OS+7.6&infinite_hd=true&machine=Quadra+650&pause=true&auto_pause=true&settings=${settingsStr}&cdrom=https%3A%2F%2Fgardenmirror.oldapplestuff.com%2Fgames%2Fcythera_infinitemac.dsk`;
            
            // Re-hide UI so user can click the new play button
            hasStarted = false;
            touchOverlay.classList.remove('active');
            hudLayer.classList.remove('active');
        }
    });

    let isMuted = false;
    const muteBtn = document.getElementById('mute-btn');
    muteBtn.addEventListener('pointerdown', e => {
        e.preventDefault();
        isMuted = !isMuted;
        muteBtn.innerHTML = isMuted ? '<span class="emoji">🔇</span>Muted' : '<span class="emoji">🔊</span>Audio';
        
        if (iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'emulator_mute', mute: isMuted }, '*');
            iframe.contentWindow.postMessage({ type: 'emulator_set_volume', volume: isMuted ? 0 : 1 }, '*');
        }
    });


    // --- BUTTON HIGHLIGHTING & INJECTION ---
    const actionBtns = document.querySelectorAll('.action-btn');
    const dirBtns = document.querySelectorAll('.dir-btn');
    actionBtns.forEach(btn => btn.addEventListener('pointerdown', () => { actionBtns.forEach(b => b.classList.remove('active-action')); btn.classList.add('active-action'); }));
    dirBtns.forEach(btn => btn.addEventListener('pointerdown', () => actionBtns.forEach(b => b.classList.remove('active-action'))));

    document.querySelectorAll('.btn[data-code]').forEach(btn => {
        btn.addEventListener('pointerdown', e => { e.preventDefault(); sendKey(btn.getAttribute('data-code'), true); });
        btn.addEventListener('pointerup', e => { e.preventDefault(); sendKey(btn.getAttribute('data-code'), false); });
        btn.addEventListener('pointerleave', e => { e.preventDefault(); sendKey(btn.getAttribute('data-code'), false); });
    });

    const kbInput = document.getElementById('hidden-keyboard');
    document.getElementById('kb-toggle').addEventListener('touchend', (e) => { e.preventDefault(); kbInput.focus(); });
    const charToCode = { 'a':'KeyA', 'b':'KeyB', 'c':'KeyC', 'd':'KeyD', 'e':'KeyE', 'f':'KeyF', 'g':'KeyG', 'h':'KeyH', 'i':'KeyI', 'j':'KeyJ', 'k':'KeyK', 'l':'KeyL', 'm':'KeyM', 'n':'KeyN', 'o':'KeyO', 'p':'KeyP', 'q':'KeyQ', 'r':'KeyR', 's':'KeyS', 't':'KeyT', 'u':'KeyU', 'v':'KeyV', 'w':'KeyW', 'x':'KeyX', 'y':'KeyY', 'z':'KeyZ', '1':'Digit1', '2':'Digit2', '3':'Digit3', '4':'Digit4', '5':'Digit5', '6':'Digit6', '7':'Digit7', '8':'Digit8', '9':'Digit9', '0':'Digit0', ' ':'Space', 'backspace':'Backspace', 'enter':'Enter' };
    kbInput.addEventListener('keydown', (e) => { let code = e.code || charToCode[e.key.toLowerCase()]; if(code && code!=='Unidentified') sendKey(code, true); });
    kbInput.addEventListener('keyup', (e) => { let code = e.code || charToCode[e.key.toLowerCase()]; if(code && code!=='Unidentified') sendKey(code, false); });
    kbInput.addEventListener('blur', () => kbInput.value = '');


    // --- ADVANCED TOUCH (PAN, ZOOM, TRACKPAD, DIRECT) ---
    let pzScale = 1, pzX = 0, pzY = 0;
    let startDist = 0, initialPzScale = 1, initialPzX = 0, initialPzY = 0, pinchCenterX = 0, pinchCenterY = 0;
    let touchStartTime = 0, isClickCandidate = false, isTwoFingerTap = false;
    let cursorX = baseWidth / 2, cursorY = baseHeight / 2, lastTouchX = 0, lastTouchY = 0;

    function getEmulatorCoords(clientX, clientY) {
        const rect = scaleTarget.getBoundingClientRect();
        const relX = clientX - rect.left; const relY = clientY - rect.top;
        const fatFingerOffsetMacY = -12; 
        const macX = relX / (rect.width / baseWidth);
        const macY = (relY / (rect.height / baseHeight)) + fatFingerOffsetMacY;
        return { x: macX, y: macY };
    }

    touchOverlay.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 2) {
            startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            initialPzScale = pzScale; initialPzX = pzX; initialPzY = pzY;
            pinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2; pinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            isClickCandidate = false; isTwoFingerTap = true; touchStartTime = Date.now();
            if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'emulator_mouse_up', button: 0 }, '*');
        } else if (e.touches.length === 1) {
            isClickCandidate = true; isTwoFingerTap = false; touchStartTime = Date.now();
            lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;

            // PREVENT CURSOR MOVEMENT IN PAN MODE on TouchStart
            if (touchMode !== 2) { 
                if (touchMode !== 1) { // Direct mode
                    const coords = getEmulatorCoords(lastTouchX, lastTouchY);
                    cursorX = coords.x; cursorY = coords.y;
                }
                if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'emulator_mouse_move', x: Math.round(cursorX), y: Math.round(cursorY) }, '*');
            }
        }
    });

    touchOverlay.addEventListener('touchmove', (e) => {
        e.preventDefault(); isClickCandidate = false; 
        if (e.touches.length === 2) {
            const currentPinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const currentPinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            if (Math.abs(dist - startDist) > 15 || Math.hypot(currentPinchCenterX - pinchCenterX, currentPinchCenterY - pinchCenterY) > 15) isTwoFingerTap = false; 
            
            const maxZoom = 2.5 / cssScale; 
            const newScale = Math.min(Math.max(1, initialPzScale * (dist / startDist)), maxZoom); 
            const scaleRatio = newScale / initialPzScale;
            pzX = currentPinchCenterX - (pinchCenterX - initialPzX) * scaleRatio;
            pzY = currentPinchCenterY - (pinchCenterY - initialPzY) * scaleRatio;
            pzScale = newScale; updatePanZoom();
        } else if (e.touches.length === 1) {
            const currentTouchX = e.touches[0].clientX;
            const currentTouchY = e.touches[0].clientY;

            if (touchMode === 2) { // PAN MODE (Visual Pan Only, No Mouse Input)
                pzX += (currentTouchX - lastTouchX);
                pzY += (currentTouchY - lastTouchY);
                updatePanZoom();
            } else if (touchMode === 1) { // TRACKPAD MODE
                const dX = (currentTouchX - lastTouchX) / (cssScale * pzScale);
                const dY = (currentTouchY - lastTouchY) / (cssScale * pzScale);
                cursorX = Math.max(0, Math.min(baseWidth, cursorX + (dX * 1.5)));
                cursorY = Math.max(0, Math.min(baseHeight, cursorY + (dY * 1.5)));
                if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'emulator_mouse_move', x: Math.round(cursorX), y: Math.round(cursorY) }, '*');
            } else { // DIRECT MODE
                const coords = getEmulatorCoords(currentTouchX, currentTouchY);
                cursorX = Math.max(0, Math.min(baseWidth, coords.x));
                cursorY = Math.max(0, Math.min(baseHeight, coords.y));
                if (iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'emulator_mouse_move', x: Math.round(cursorX), y: Math.round(cursorY) }, '*');
            }
            lastTouchX = currentTouchX; lastTouchY = currentTouchY;
        }
    });

    touchOverlay.addEventListener('touchend', (e) => {
        e.preventDefault();
        if (e.touches.length === 0) {
            const timeElapsed = Date.now() - touchStartTime;
            if (isTwoFingerTap && timeElapsed < 300) {
                if (iframe.contentWindow) { iframe.contentWindow.postMessage({ type: 'emulator_mouse_down', button: 2 }, '*'); setTimeout(() => iframe.contentWindow.postMessage({ type: 'emulator_mouse_up', button: 2 }, '*'), 50); }
            } else if (isClickCandidate && timeElapsed < 300) {
                
                // If in PAN MODE and tapped, jump cursor to tap location and click
                if (touchMode === 2) {
                    const coords = getEmulatorCoords(lastTouchX, lastTouchY);
                    if (iframe.contentWindow) {
                        iframe.contentWindow.postMessage({ type: 'emulator_mouse_move', x: Math.round(coords.x), y: Math.round(coords.y) }, '*');
                        setTimeout(() => {
                            iframe.contentWindow.postMessage({ type: 'emulator_mouse_down', button: 0 }, '*');
                            setTimeout(() => iframe.contentWindow.postMessage({ type: 'emulator_mouse_up', button: 0 }, '*'), 50);
                        }, 20); // slight delay ensures OS registers mouse move before down
                    }
                } else {
                    if (iframe.contentWindow) { 
                        iframe.contentWindow.postMessage({ type: 'emulator_mouse_down', button: 0 }, '*'); 
                        setTimeout(() => iframe.contentWindow.postMessage({ type: 'emulator_mouse_up', button: 0 }, '*'), 50); 
                    }
                }
            }
            isTwoFingerTap = false;
        }
    });

    function updatePanZoom() {
        const scaledW = window.innerWidth * pzScale; const scaledH = window.innerHeight * pzScale;
        if (pzScale <= 1) { pzX = 0; pzY = 0; } 
        else { pzX = Math.min(0, Math.max(pzX, window.innerWidth - scaledW)); pzY = Math.min(0, Math.max(pzY, window.innerHeight - scaledH)); }
        panZoomContainer.style.transform = `translate(${pzX}px, ${pzY}px) scale(${pzScale})`;
    }

</script>
</body>
</html>
