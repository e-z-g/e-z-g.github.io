<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Mobile Tester</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100dvh; width: 100vw;
            background-color: #1a1a1a; color: #eee;
            display: flex; flex-direction: column;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .btn {
            border: none; padding: 20px; font-size: 1.2rem;
            font-weight: bold; cursor: pointer; text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 10;
            display: block; box-sizing: border-box; width: 100%;
        }
        #auto-btn { background-color: #2E8B57; color: #fff; font-size: 1.5rem; }
        #auto-btn:active { background-color: #1c5e39; }
        
        #upload-btn { background-color: #3b5998; color: #fff; font-size: 1.2rem; }
        #upload-btn:active { background-color: #263961; }
        
        .divider { text-align: center; padding: 10px; font-weight: bold; background: #222; }

        #manual-section { display: flex; flex-direction: column; flex: 1; }
        #code-input {
            flex: 1; width: 100%; background-color: #0d0d0d; color: #00ff00;
            font-family: 'Courier New', Courier, monospace; font-size: 14px;
            padding: 10px; border: none; outline: none; resize: none; box-sizing: border-box;
        }
        #run-btn { background-color: #C4A464; color: #3B0000; }
        #run-btn:active { background-color: #8B6914; }

        /* Hide the actual file input, we trigger it via the label styling */
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <button id="auto-btn" class="btn" onclick="autoPaste()">📋 AUTO-PASTE & RUN</button>
    
    <div class="divider">OR UPLOAD FILE</div>
    
    <label for="file-upload" id="upload-btn" class="btn">📁 CHOOSE HTML FILE</label>
    <input type="file" id="file-upload" accept=".html, .txt, .htm">
    
    <div class="divider">OR MANUAL PASTE</div>
    
    <div id="manual-section">
        <textarea id="code-input" placeholder="Paste your HTML code here on your phone..."></textarea>
        <button id="run-btn" class="btn" onclick="runManual()">🚀 LAUNCH PREVIEW</button>
    </div>

    <script>
        let lastCode = "";

        // 1. File Upload Logic
        document.getElementById('file-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                if (!text || !text.includes("<html")) {
                    alert("This doesn't look like a valid HTML file!");
                    return;
                }
                executeCode(text);
            };
            reader.readAsText(file);
        });

        // 2. Attempt to Auto-Read clipboard the moment the tab becomes visible
        document.addEventListener("visibilitychange", async () => {
            if (document.visibilityState === "visible") {
                try {
                    const text = await navigator.clipboard.readText();
                    if (text && text.includes("<html") && text !== lastCode) {
                        if (confirm("New HTML code detected in clipboard! Launch it?")) {
                            executeCode(text);
                        }
                    }
                } catch (err) {
                    console.log("Background clipboard read blocked or unavailable.");
                }
            }
        });

        // 3. Giant Auto-Paste Button Logic
        async function autoPaste() {
            try {
                const text = await navigator.clipboard.readText();
                if (!text || !text.includes("<html")) {
                    alert("Clipboard doesn't contain HTML code!");
                    return;
                }
                executeCode(text);
            } catch (err) {
                alert("Clipboard permission denied. Please use the file upload or paste manually below.");
            }
        }

        // 4. Standard Manual Paste Logic
        function runManual() {
            const code = document.getElementById('code-input').value;
            if (!code.trim()) {
                alert("Please paste some HTML first!");
                return;
            }
            executeCode(code);
        }

        // 5. Overwrite Document Function
        function executeCode(codeStr) {
            lastCode = codeStr;
            document.open();
            document.write(codeStr);
            document.close();
        }
    </script>

</body>
</html>
